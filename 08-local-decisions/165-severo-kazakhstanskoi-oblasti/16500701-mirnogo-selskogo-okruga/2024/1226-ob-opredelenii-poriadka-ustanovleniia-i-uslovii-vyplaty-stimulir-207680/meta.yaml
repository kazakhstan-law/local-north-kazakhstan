title:
  rus: Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников  организаций Мирного сельского округа Жамбылского района Северо-Казахстанской области финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Солтүстік Қазақстан облысы Жамбыл ауданы Мирный ауылдық округі ұйымдары қызметкерлерінің лауазымдық жалақысына ынталандырушы үстемеақы төлеу тәртібі мен шарттарын айқындау туралы
