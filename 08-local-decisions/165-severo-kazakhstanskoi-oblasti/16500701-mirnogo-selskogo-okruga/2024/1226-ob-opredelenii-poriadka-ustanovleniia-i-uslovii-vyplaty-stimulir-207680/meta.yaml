  requisite: Решение акима Мирного сельского округа Жамбылского района Северо-Казахстанской области от 7 февраля 2025 года № 4
  title:
    rus: О внесении дополнений к решению акима Мирного сельского округа Жамбылского района Северо-Казахстанской области от 26 декабря 2024 года № 27 «Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников коммунального государственного учреждения «Аппарат акима Мирного сельского округа Жамбылского района Северо-Казахстанской области» финансируемых из местного бюджета
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы Мирный ауылдық округі әкімінің 2024 жылғы 26 желтоқсандағы № 27 «Жергілікті бюджеттен қаржыландырылатын Солтүстік Қазақстан облысы Жамбыл ауданы Мирный ауылдық округі әкімінің аппараты» коммуналдық мемлекеттік мекемесінің жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын төлеу тәртібі мен шарттарын айқындау туралы» шешіміне толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/207682/rus
