    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Черкас селолық округінің Добровольское селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Черкасское ауылдық округі әкімінің 2013 жылғы 14 қаңтардағы № 3 шешіміне өзгерістер енгізу туралы
