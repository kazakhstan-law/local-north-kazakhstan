    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Шағалалы ауылы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Шағалалы ауылдық округі әкімінің 2012 жылғы 6 қыркүйектегі № 16 шешіміне өзгерістер енгізу туралы
