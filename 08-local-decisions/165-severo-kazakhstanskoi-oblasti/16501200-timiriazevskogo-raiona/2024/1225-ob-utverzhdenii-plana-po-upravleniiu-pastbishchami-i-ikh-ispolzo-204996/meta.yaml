  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата Северо-Казахстанской области от 25 декабря 2024 года № 22/21 «Об утверждении Плана по управлению пастбищами и их использованию по Тимирязевскому району Северо-Казахстанской области на 2024-2028 годы»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданы бойынша жайылымдарды басқару және оларды пайдалану жөніндегі 2024-2028 жылдарға арналған жоспарды бекіту туралы» Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2024 жылғы 25 желтоқсандағы № 22/21 шешіміне өзгерістер енгізу туралы
