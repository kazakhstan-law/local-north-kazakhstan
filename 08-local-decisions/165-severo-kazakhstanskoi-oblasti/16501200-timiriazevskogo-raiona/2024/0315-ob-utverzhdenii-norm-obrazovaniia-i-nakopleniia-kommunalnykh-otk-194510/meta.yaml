  title:
    rus: О внесении изменения в решение маслихата Тимирязевского района Северо-Казахстанской области от 15 марта 2024 года № 14/4 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку и захоронение твердых бытовых отходов по Тимирязевскому району Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға және көмуге арналған тарифтерді бекіту туралы» Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2024 жылғы 15 наурыздағы № 14/4 шешіміне өзгеріс енгізу туралы
