act_code: '194510'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 15 марта 2024 года № 14/4
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Тимирязевскому району Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы
