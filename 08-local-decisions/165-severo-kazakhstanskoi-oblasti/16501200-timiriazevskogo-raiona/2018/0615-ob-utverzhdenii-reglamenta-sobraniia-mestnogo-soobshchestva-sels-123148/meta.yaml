  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата Северо-Казахстанской области от 15 июня 2018 года № 24/5 «Об утверждении Регламента собрания местного сообщества сельских округов Тимирязевского района Северо-Казахстанской области»
