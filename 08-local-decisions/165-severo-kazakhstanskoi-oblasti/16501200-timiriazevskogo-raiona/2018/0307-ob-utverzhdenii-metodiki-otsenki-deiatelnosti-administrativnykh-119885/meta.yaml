requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 7 марта 2018 года № 21/10. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 марта 2018 года № 4617. Утратил силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 10/10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат Тимирязевского районного маслихата Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
