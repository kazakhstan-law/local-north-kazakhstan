act_code: '53485'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 23 июня 2010 года № 24/6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 июля 2010 года № 13-12-111. Утратило силу - решением маслихата Тимирязевского района Северо-Казахстанской области от 28 марта 2011 года № 31/7
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района на 2010 год
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2010 жылға әлеуметтік қолдау шараларын ұсыну туралы
