act_code: '56921'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 24 декабря 2010 года № 28/7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 января 2011 года № 13-12-120. Утратило силу - решением маслихата Тимирязевского района Северо-Казахстанской области от 16 апреля 2012 года № 3/3
title:
  rus: О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулықты сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік шараларын ұсыну туралы
