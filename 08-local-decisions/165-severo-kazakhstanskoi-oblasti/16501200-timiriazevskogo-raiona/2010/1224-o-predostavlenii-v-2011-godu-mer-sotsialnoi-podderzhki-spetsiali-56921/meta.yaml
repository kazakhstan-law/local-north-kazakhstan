  code: '60294'
  requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 1 августа 2011 года № 34/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 августа 2011 года № 13-12-131. Утратило силу - решением маслихата Тимирязевского района Северо-Казахстанской области от 16 апреля 2012 года № 3/3
  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата от 24 декабря 2010 года № 28/7 "О предоставлении в 2011 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района"
    kaz: '"Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулықты сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік шараларын ұсыну туралы" Тимирязев аудандық мәслихаттың 2010 жылғы 24 желтоқсандағы № 28/7 шешіміне өзгеріс енгізу туралы'
