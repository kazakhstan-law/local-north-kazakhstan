    kaz: «Тимирязев ауданы Тимирязев селолық округі Тимирязев селосы көшелерінің атауын өзгерту туралы» Солтүстік Қазақстан облысы Тимирязев ауданы Тимирязев ауылдық округі әкімінің 2010 жылғы 16 сәуірдегі № 23 шешіміне өзгерістер енгізу туралы
