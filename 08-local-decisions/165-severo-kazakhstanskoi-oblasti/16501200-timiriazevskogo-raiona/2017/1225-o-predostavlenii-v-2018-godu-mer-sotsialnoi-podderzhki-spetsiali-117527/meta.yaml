act_code: '117527'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 25 декабря 2017 года № 18/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 января 2018 года № 4473
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын ұсыну туралы
