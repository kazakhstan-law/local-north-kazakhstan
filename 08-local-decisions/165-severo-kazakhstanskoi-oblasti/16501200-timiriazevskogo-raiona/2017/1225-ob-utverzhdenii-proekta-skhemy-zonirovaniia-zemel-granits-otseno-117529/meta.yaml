  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата Северо-Казахстанской области от 25 декабря 2017 года № 18/6 «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Тимирязево и сельских населенных пунктов Тимирязевского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2017 жылғы 25 желтоқсандағы № 18/6 «Солтүстік Қазақстан облысы Тимирязев ауданы Тимирязев ауылының және ауылдық елді мекендерінің жерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
