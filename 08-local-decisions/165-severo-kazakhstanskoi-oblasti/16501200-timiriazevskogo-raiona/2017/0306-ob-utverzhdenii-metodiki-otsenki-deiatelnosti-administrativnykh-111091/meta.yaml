requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 6 марта 2017 года № 11/9. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 апреля 2017 года № 4138. Утратило силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 7 марта 2018 года № 21/10
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат Тимирязевского районного маслихата Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
