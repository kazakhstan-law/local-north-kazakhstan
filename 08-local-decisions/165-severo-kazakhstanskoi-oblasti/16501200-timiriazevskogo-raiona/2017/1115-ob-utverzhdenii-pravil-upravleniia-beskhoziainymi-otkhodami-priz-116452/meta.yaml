requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 15 ноября 2017 года № 17/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 декабря 2017 года № 4393. Утратил силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 5 августа 2021 года № 5/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Тимирязевского района Северо-Казахстанской области
  kaz: Сот шешімімен Солтүстік Қазақстан облысы Тимирязев ауданының коммуналдық меншігіне түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы
