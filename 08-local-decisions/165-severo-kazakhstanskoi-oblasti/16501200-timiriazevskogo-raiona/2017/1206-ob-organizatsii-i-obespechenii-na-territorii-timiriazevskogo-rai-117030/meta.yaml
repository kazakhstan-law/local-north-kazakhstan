requisite: Решение акима Тимирязевского района Северо-Казахстанской области от 6 декабря 2017 года № 19. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 декабря 2017 года № 4441
title:
  rus: Об организации и обеспечении на территории Тимирязевского района Северо-Казахстанской области приписки и медицинского освидетельствования граждан Республики Казахстан мужского пола с января по март 2018 год
  kaz: Қазақстан Республикасының ер азаматтарын 2018 жылғы қаңтардан бастап наурызға дейін Солтүстік Қазақстан облысы Тимирязев ауданының аумағында тіркеу және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
