requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 3 мая 2017 года № 12/7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 июня 2017 года № 4203. Утратило силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 24 июня 2020 года № 47/16 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
