title:
  rus: Об организации и обеспечении на территории Тимирязевского района Северо-Казахстанской области приписки и медицинского освидетельствования граждан Республики Казахстан мужского пола с января по март 2017 года
  kaz: Қазақстан Республикасының ер азаматтарын 2017 жылғы қаңтардан бастап наурызға дейін Солтүстік Қазақстан облысы Тимирязев ауданының аумағында тіркеу және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
