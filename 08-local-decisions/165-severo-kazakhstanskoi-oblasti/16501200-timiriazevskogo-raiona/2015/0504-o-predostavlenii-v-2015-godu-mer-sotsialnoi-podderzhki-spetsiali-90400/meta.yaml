act_code: '90400'
requisite: Решение №36/3 от 04.05.2015, Маслихат Тимирязевского района. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 04 июня 2015 года № 3267. Утратило силу решением маслихата Тимирязевского района Северо-Казахстанской области от 25 декабря 2015 года № 44/7
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы әлеуметтік қолдау шараларын ұсыну туралы
