  kaz: Қазақстан Республикасының ер азаматтарын 2016 жылғы қаңтардан бастап наурызға дейін Солтүстік Қазақстан облысы Тимирязев ауданының аумағында тіркеу және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
