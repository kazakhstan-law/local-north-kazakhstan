act_code: '98285'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 25 декабря 2015 года № 44/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 января 2016 года № 3590
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры,спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және  агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдау шараларын ұсыну туралы
