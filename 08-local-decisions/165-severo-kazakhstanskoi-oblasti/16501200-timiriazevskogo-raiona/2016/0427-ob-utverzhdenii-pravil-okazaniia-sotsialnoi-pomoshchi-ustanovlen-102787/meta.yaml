  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата Северо-Казахстанской области от 27 апреля 2016 года № 2/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Тимирязевского района»
    kaz: Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2016 жылғы 27 сәуірдегі № 2/4 «Тимирязев ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
