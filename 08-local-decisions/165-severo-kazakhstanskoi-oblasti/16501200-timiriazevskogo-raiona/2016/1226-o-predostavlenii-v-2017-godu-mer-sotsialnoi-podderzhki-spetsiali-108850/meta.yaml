act_code: '108850'
requisite: Решение Тимирязевского районнного маслихата Северо-Казахстанской области от 26 декабря 2016 года № 8/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 января 2017 года № 4014
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы әлеуметтік қолдау шараларын ұсыну туралы
