act_code: '70347'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 20 декабря 2012 года № 10/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 января 2013 года № 2072. Утратило силу (письмо Тимирязевского районного маслихата Северо-Казахстанской области от 26 июня 2014 года № 483)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік шараларын ұсыну туралы
