act_code: '65196'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 16 апреля 2012 года № 3/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 мая 2012 года № 13-12-149. Утратило силу решением маслихата Тимирязевского района Северо-Казахстанской области от 29 марта 2013 года № 11/4
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Тимирязевксого района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға әлеуметтік шараларын ұсыну туралы
