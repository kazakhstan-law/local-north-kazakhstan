  kaz: Қазақстан Республикасының ер азаматтарын 2013 жылдың қаңтарынан наурызына дейін Солтүстік Қазақстан облысы Тимирязев ауданының аумағында тіркеуді және медициналық куәландырылуды ұйымдастыру және қамтамасыз ету туралы
