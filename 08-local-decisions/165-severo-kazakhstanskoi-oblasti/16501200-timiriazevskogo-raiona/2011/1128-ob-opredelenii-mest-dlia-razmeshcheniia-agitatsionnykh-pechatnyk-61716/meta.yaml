requisite: Постановление акимата Тимирязевского района Северо-Казахстанской области от 28 ноября 2011 года № 310. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 декабря 2011 года № 13-12-136. Утратило силу - постановлением акимата Тимирязевского района Северо-Казахстанской области от 8 февраля 2012 года № 27
title:
  rus: Об определении мест для размещения агитационных печатных материалов и помещений для проведения встреч с избирателями кандидатов в депутаты Мажилиса Парламента Республики Казахстан, областного и районного маслихатов на территории Тимирязевского района
  kaz: Тимирязев ауданының аумағында Қазақстан Республикасы Парламенті Мәжілісінің, облыстық және аудандық мәслихатына депутаттыққа кандидаттар сайлаушылармен кездесу өткізу үшін үй-жайларды және үгіттік баспа материалдарын орналастыру үшін орындарды анықтау туралы
