  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата Северо-Казахстанской области от 25 апреля 2023 года № 2/14 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат Тимирязевского районного маслихата Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2023 жылғы 25 сәуірдегі № 2/14 шешіміне өзгерістер енгізу туралы
