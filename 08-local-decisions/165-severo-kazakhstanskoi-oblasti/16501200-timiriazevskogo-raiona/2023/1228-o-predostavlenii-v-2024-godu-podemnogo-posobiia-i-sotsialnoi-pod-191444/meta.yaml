act_code: '191444'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 28 декабря 2023 года № 10/18
title:
  rus: О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района Северо-Казахстанской области
  kaz: 2024 жылы Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
