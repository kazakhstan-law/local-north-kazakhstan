  title:
    rus: О внесении изменений и дополнения в решение Тимирязевского районного маслихата Северо-Казахстанской области от 28 ноября 2023 года № 8/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданындағы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2023 жылғы 28 қарашадағы № 8/8 шешіміне өзгерістер мен толықтыру енгізу туралы
