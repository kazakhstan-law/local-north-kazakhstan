act_code: '189184'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 28 ноября 2023 года № 8/14
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей сел, улиц, многоквартирных жилых домов для участия в сходе местного сообщества в Тимирязевском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиындарына қатысу үшін ауылдар, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
