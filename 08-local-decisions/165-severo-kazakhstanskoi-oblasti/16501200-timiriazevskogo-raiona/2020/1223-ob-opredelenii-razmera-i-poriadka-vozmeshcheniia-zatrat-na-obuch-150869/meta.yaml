requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 23 декабря 2020 года № 50/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 декабря 2020 года № 6860. Утратил силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 24 сентября 2021 года № 6/12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану
