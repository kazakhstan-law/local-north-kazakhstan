requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 17 сентября 2020 года № 48/7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 сентября 2020 года № 6548. Утратил силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 10/10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества Белоградовского сельского округа Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданы Белоградов ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
