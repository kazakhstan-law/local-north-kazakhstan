act_code: '140560'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 17 марта 2020 года № 44/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 марта 2020 года № 6113
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: 2020 жылы Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
