requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 23 декабря 2020 года № 50/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 декабря 2020 года № 6862. Утратило силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 28 ноября 2023 года № 8/8  (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Тимирязевского района
  kaz: Тимирязев ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
