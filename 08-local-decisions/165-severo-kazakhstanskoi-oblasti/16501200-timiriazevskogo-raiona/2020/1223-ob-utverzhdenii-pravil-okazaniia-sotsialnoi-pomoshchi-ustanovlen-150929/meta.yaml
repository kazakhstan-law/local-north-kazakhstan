  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата от 23 декабря 2020 года № 50/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Тимирязев аудандық мәслихатының 2020 жылғы 23 желтоқсандағы № 50/3 шешіміне өзгеріс енгізу туралы
