  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата от 24 июня 2020 года № 47/10 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Тимирязевского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Тимирязев аудандық мәслихатының 2020 жылғы 24 маусымдағы № 47/10 шешіміне өзгеріс енгізу туралы
