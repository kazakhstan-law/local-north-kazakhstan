  code: '157682'
  requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 5 августа 2021 года № 5/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 августа 2021 года № 23892
  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата от 7 августа 2019 года № 36/4 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющихся гражданскими служащими и работающих в сельской местности Тимирязевского района Северо-Казахстанской области»
    kaz: Тимирязев аудандық мәслихатының 2019 жылғы 7 тамыздағы № 36/4 «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық жерінде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157682/rus
