  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата от 17 января 2019 года № 30/4 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района на 2019 год»
    kaz: Тимирязев аудандық мәслихатының 2019 жылғы 17 қаңтардағы № 30/4 «2019 жылға арналған Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
