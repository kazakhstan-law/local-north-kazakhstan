requisite: Решение Тимирязевского районнного маслихата Северо-Казахстанской области от 28 февраля 2014 года № 24/14. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 апреля 2014 года № 2630. Утратил силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 10/10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества Москворецкого сельского округа Тимирязевского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданы Москворецкий ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
