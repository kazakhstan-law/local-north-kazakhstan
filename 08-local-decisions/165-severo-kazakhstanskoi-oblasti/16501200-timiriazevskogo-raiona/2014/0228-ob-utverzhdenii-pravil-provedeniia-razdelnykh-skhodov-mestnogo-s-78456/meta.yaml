  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата Северо-Казахстанской области от 28 февраля 2014 года №24/8 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Есильского сельского округа Тимирязевского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2014 жылғы 28 ақпандағы № 24/8 «Солтүстік Қазақстан облысы Тимирязев ауданы Есіл ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
