act_code: '85930'
requisite: Решение от 23.12.2014 №32/3, Маслихат Тимирязевского района. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 января 2015 года № 3067. Утратило силу решением маслихата Тимирязевского района Северо-Казахстанской области от 04 мая 2015 года № 36/3
title:
  rus: 'О предоставлении в 2015 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района '
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2015 жылы әлеуметтік қолдау шараларын ұсыну туралы
