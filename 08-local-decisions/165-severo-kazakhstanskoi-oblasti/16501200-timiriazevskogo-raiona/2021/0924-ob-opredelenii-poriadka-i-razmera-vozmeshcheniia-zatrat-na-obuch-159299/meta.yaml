  title:
    rus: О внесении изменений в решение Тимирязевского районного маслихата от 24 сентября 2021 года № 6/12 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Тимирязевском районе»
    kaz: Тимирязев аудандық мәслихатының 2021 жылғы 24 қыркүйектегі № 6/12 «Тимирязев ауданында жеке оқу жоспары бойынша мүгедектер қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
