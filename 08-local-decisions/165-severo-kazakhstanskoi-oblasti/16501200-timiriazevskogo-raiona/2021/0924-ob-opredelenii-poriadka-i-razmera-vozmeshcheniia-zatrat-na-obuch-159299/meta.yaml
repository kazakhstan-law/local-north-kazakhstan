title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Тимирязевском районе
  kaz: Тимирязев ауданында жеке оқу жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы
