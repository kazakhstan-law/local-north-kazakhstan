requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 24 сентября 2021 года № 6/12. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 октября 2021 года № 24672
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Тимирязевском районе
