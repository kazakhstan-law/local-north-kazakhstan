act_code: '154182'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 30 марта 2021 года № 3/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 апреля 2021 года № 7226
title:
  rus: О предоставлении в 2021 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района Северо-Казахстанской области
  kaz: 2021 жылы Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
