act_code: '77037'
requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 26 декабря 2013 года № 21/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 января 2014 года № 2512. Утратило силу (письмо маслихата Тимирязевского района Северо-Казахстанской области от 5 января 2015 года № 13.2.1.25/4)
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района
  kaz: Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
