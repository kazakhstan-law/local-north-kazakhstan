  title:
    rus: О внесении изменений в решение районного маслихата от 26 декабря 2013 года № 21/3 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района"
    kaz: '"Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы" Тимирязев аудандық мәслихатының 2013 жылғы 26 желтоқсандағы № 21/3 шешіміне өзгерістер енгізу туралы'
