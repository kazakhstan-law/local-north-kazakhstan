act_code: '164959'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 10/6. Утратило силу решением Тимирязевского районного маслихата Северо-Казахстанской области от 28 ноября 2023 года № 8/14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Тимирязевском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тимирязев ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
