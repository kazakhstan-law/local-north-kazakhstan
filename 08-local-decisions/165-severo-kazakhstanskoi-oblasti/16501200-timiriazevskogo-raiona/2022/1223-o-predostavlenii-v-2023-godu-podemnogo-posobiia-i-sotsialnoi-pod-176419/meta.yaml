  requisite: Решение маслихата Тимирязевского района Северо-Казахстанской области от 20 сентября 2023 года № 6/8
  title:
    rus: О внесении изменения в решение Тимирязевского районного маслихата Северо-Казахстанской области от 23 декабря 2022 года № 17/18  «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов,  прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района Северо-Казахстанской области»
    kaz: «2023 жылы Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы»  Солтүстік Қазақстан облысы Тимирязев аудандық мәслихатының 2022 жылғы 23 желтоқсандағы№ 17/18 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186486/rus
