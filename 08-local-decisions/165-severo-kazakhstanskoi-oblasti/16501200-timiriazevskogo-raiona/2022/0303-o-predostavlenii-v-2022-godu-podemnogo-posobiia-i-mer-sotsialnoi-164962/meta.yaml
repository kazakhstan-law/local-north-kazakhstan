act_code: '164962'
requisite: Решение Тимирязевского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 10/5
title:
  rus: О предоставлении в 2022 году подъемного пособия и мер социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тимирязевского района Северо-Казахстанской области
  kaz: 2022 жылы Солтүстік Қазақстан облысы Тимирязев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға әлеуметтік қолдау шараларын ұсыну туралы
