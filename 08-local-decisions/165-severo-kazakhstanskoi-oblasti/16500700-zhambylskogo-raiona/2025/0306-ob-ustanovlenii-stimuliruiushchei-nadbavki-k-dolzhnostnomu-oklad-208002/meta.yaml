  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 6 марта 2025 года № 26/9 «Об установлении стимулирующей надбавки к должностному окладу работников коммунального государственного учреждения «Аппарат акима Пресновского сельского округа Жамбылского района Северо-Казахстанской области», финансируемых из местного бюджета»
