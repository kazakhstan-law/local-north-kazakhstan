act_code: '101295'
requisite: Решение Жамбылского районного маслихата Северо-Казахстанской области от 9 марта 2016 года № 46/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 апреля 2016 года № 3694
title:
  rus: О предоставлении подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области в 2016 году
  kaz: 2016 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
