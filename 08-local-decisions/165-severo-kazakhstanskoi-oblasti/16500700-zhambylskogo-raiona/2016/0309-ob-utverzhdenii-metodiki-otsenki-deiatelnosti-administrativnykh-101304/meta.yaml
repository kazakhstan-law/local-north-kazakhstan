requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 9 марта 2016 года № 46/6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 апреля 2016 года № 3714. Утратило силу решением Жамбылского районного маслихата Северо-Казахстанской области от 20 февраля 2017 года № 9/10
title:
  rus: Об утверждении Методики оценки деятельности  административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
