requisite: Решение Жамбылского районного маслихата Северо-Казахстанской области от 26 декабря 2016 года № 7/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 января 2017 года № 3999
title:
  rus: О признании утратившим силу решения маслихата Жамбылского района Северо-Казахстанской области от 30 октября 2015 года № 41/2 «Об утверждении Положения государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области»»
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы маслихатының аппараты» мемлекеттік мекемесінің Ережесін бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2015 жылғы 30 қазандағы  № 41/2 шешімінің күші жойылды деп танылғаны туралы
