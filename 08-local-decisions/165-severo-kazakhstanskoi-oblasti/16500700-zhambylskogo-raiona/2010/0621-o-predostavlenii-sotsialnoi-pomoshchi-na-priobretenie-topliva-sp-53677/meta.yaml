  title:
    rus: О внесении дополнения в решение районного маслихата от 21 июня 2010 года № 24/3 "О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта проживающим и работающим в сельских населенных пунктах Жамбылского района"
    kaz: '"Жамбыл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы" аудандық мәслихаттың 2010 жылғы 21 маусымдағы № 24/3 шешіміне толықтыру енгізу туралы'
