act_code: '53677'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 21 июня 2010 года № 24/3. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 26 июля 2010 года № 13-7-132. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 21 января 2015 года № 35/3
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта проживающим и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сактау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
