requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 26 июля 2010 года № 25/2. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 1 сентября 2010 года № 13-7-134. Утратило силу (письмо маслихата Жамбылского района Северо-Казахстанской области от 3 апреля 2013 года № 03-31/43)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в населенные пункты Жамбылского района в 2010 году
  kaz: 2010 жылы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға әлеуметтік қолдауды ұсыну туралы
