requisite: Решение Жамбылского районного маслихата Северо-Казахстанской области от 24 мая 2007 года № 6/38. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 29 июня 2007 года № 13-7-53. Утратило силу решением Жамбылского районного маслихата Северо-Казахстанской области от 27 апреля 2009 года № 16/9
title:
  rus: О ставках разовых талонов для лиц, занимающихся реализацией товаров на рынках, ставках разовых талонов для физических лиц, осуществляющих деятельность эпизодического характера на 2007 и последующие годы, ставках ежемесячной платы за размещение наружной (визуальной) рекламы на территории района
  kaz: Базарларда тауар өткізумен айналысатын тұлғалар үшін бір реттік талондардың мөлшерлемелері, мерзімдік сипаттағы қызметтерді жүзеге асыратын жеке тұлғалар үшін бір реттік талондардың 2007 және одан арғы жылдарға мөлшерлемелері, аудан аумағында сыртқы (көрнекі) жарнаманы орналастыру үшін ай сайынга төлем мөлшерлемелері туралы
