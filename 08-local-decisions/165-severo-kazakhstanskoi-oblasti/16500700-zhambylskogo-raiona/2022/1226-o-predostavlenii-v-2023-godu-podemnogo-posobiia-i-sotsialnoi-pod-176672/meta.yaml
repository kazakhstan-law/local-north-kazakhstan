  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 26 декабря 2022 года № 22/2 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области»
    kaz: «2023 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және қызметшілеріне әлеуметтік қолдау көрсету туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2022 жылғы 26 желтоқсандағы № 22/2 шешіміне өзгеріс енгізу туралы»
  link: https://zan.gov.kz/client/#!/doc/186780/rus
