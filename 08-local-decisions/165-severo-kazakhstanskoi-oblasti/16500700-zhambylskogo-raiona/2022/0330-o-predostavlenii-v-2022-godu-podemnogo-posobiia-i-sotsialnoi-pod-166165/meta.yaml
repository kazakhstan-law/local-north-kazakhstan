act_code: '166165'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 30 марта 2022 года № 13/15
title:
  rus: О предоставлении в 2022 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области
  kaz: 2022 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және қызметшілеріне әлеуметтік қолдау көрсету туралы
