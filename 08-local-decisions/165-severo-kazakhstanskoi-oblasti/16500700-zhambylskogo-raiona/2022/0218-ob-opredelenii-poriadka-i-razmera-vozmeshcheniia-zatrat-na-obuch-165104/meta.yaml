  title:
    rus: О внесении изменений в решение маслихата Жамбылского района Северо-Казахстанской области от 18 февраля 2022 года № 12/3 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жамбылском районе»
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2022 жылғы 18 ақпандағы № 12/3 «Жамбыл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
