act_code: '168915'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 8 июня 2022 года № 16/15. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 29 ноября 2023 года № 9/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, сельского округа, улицы, многоквартирного жилого дома в Жамбылском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданыңда жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиналысына қатысу үшін ауыл, ауылдық округ, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
