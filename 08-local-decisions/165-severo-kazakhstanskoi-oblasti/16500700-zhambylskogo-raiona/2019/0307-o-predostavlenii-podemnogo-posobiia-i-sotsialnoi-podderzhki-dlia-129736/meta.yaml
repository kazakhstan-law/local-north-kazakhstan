act_code: '129736'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 7 марта 2019 года № 33/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 марта 2019 года № 5255
title:
  rus: О предоставлении подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области в 2019 году
  kaz: 2019 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
