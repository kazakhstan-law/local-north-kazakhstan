caused_by:
  code: '161983'
  requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 8 декабря 2021 года № 9/6. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2021 года № 25917
  title:
    rus: О внесении изменений в решение маслихата Жамбылского района Северо-Казахстанской области от 29 апреля 2019 года № 34/3 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жамбылского района Северо-Казахстанской области»
    kaz: «Азаматтық қызметші болып табылатын және Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» Солтүстік Қазақстан облысы Жамбыл ауданының мәслихатының 2019 жылғы 29 сәуірдегі № 34/3 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161983/rus
