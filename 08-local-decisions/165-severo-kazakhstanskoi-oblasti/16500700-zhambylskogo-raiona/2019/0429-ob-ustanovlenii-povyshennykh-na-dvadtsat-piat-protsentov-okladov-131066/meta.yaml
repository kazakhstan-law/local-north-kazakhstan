act_code: '131066'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 29 апреля 2019 года № 34/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 мая 2019 года № 5382
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жамбылского района Северо-Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендерінде жұмыс істейтін әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
