  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 27 декабря 2023 года № 11/3 «О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области»
    kaz: «2024 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға әлеуметтік қолдау көрсету туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2023 жылғы 27 желтоқсандағы № 11/3 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201907/rus
