  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 27 декабря 2023 года № 11/4 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2023 жылғы 27 желтоқсандағы № 11/4 шешіміне өзгеріс енгізу туралы
