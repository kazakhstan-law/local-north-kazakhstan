requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 14 апреля 2023 года № 2/3. Отменено решением маслихата Жамбылского района Северо-Казахстанской области от 18 апреля 2025 года № 28/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту
