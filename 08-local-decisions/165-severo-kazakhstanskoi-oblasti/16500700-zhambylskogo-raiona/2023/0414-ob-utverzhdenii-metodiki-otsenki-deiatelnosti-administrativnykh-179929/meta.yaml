  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 14 апреля 2023 года № 2/3 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области»
