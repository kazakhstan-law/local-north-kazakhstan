    kaz: «2024-2026 жылдарға арналған Солтүстік Қазақстан облысы Жамбыл ауданының Первомай ауылдық округінің бюджетін бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2023 жылғы 28 желтоқсандағы № 12/10 шешіміне өзгерістер енгізу туралы
