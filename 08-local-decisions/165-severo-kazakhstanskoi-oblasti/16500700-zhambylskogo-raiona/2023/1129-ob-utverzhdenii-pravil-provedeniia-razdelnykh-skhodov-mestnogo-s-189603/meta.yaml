  title:
    rus: О внесении изменений в решение маслихата Жамбылского района Северо-Казахстанской области от 29 ноября 2023 года № 9/2 «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, сельского округа, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Жамбылском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, ауылдық округ, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2023 жылғы 29 қарашадағы № 9/2 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198896/rus
