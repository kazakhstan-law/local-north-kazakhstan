title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, сельского округа, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Жамбылском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, ауылдық округ, көшелер, көппәтерлі тұрғын үйлер тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
