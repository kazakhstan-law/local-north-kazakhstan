  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 8 июня 2020 года № 49/5 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2020 жылғы 8 маусымдағы № 49/5 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187713/rus
