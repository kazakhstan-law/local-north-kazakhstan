    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық округтерінің жергілікті қоғамдастық жиналысының регламентін бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2021 жылғы 15 маусымдағы № 5/17 шешіміне өзгеріс енгізу туралы
