  title:
    rus: О внесении изменений в решение маслихата Жамбылского района Северо-Казахстанской области № 5/17 от 15 июня 2021 года «Об утверждении регламента собрания местного сообщества сельских округов Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық округтерінің жергілікті қоғамдастық жиналысының регламентін бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2021 жылдың 15 маусымындағы № 5/17 шешіміне өзгерістер енгізу туралы
