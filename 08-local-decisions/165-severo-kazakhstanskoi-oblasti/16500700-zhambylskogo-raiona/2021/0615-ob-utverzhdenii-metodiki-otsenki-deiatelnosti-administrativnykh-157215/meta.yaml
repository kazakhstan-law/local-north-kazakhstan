requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 15 июня 2021 года № 5/16. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 30 марта 2022 года № 13/16 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата  Жамбылского района Северо-Казахстанской области
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
