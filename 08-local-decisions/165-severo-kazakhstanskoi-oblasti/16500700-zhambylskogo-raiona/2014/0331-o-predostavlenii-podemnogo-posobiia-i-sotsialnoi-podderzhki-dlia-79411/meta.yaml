act_code: '79411'
requisite: Решение Жамбылского районного маслихата Северо-Казахстанской области от 31 марта 2014 года № 26/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2014 года № 2696
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пуснкты Жамбылского района Северо-Казахстанской области в 2014 году
  kaz: 2014 жылы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсеп кешен саласы мамандарына тұрғын үй сатып алунемесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
