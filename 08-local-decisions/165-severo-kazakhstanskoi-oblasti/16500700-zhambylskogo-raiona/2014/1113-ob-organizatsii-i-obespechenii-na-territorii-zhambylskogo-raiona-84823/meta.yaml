  kaz: Қазақстан Республикасының ер азаматтарын 2015 жылдың қаңтарынан наурызына дейін Солтүстік Қазақстан облысы Жамбыл ауданының аумағында тіркеуді және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
