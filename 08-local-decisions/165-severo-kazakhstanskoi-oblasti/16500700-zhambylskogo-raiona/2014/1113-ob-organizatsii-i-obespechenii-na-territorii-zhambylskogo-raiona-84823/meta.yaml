requisite: Решение акима Жамбылского района Северо-Казахстанской области от 13 ноября 2014 года № 50. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 декабря 2014 года № 3010. Утратило силу в связи с истечением срока действия (письмо акима Жамбылского района Северо-Казахстанской области от 16 июня 2015 года № 8.1.5-2/615)
title:
