requisite: Решение Жамбылского районного маслихата Северо-Казахстанской области от 28 февраля 2014 года № 25/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 апреля 2014 года № 2642. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 18 февраля 2022 года № 12/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Благовещенского сельского округа Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданының Благовещенка ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
