  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 28 февраля 2014 года № 25/3 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Благовещенского сельского округа Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының Благовещенка ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2014 жылғы 28 ақпандағы № 25/3 шешіміне өзгеріс енгізу туралы
