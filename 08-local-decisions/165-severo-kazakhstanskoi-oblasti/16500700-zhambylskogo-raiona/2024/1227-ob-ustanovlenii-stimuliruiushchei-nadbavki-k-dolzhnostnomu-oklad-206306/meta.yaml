  title:
    rus: О внесении изменения в решение маслихата Жамбылского района Северо-Казахстанской области от 27 декабря 2024 года № 25/14 «Об установлении стимулирующей надбавки к должностному окладу работников коммунального государственного учреждения «Аппарат акима Майбалыкского сельского округа Жамбылского района Северо-Казахстанской области», финансируемых из местного бюджета
    kaz: Жергілікті бюджеттен қаржыландырылатын «Солтүстік Қазақстан облысы Жамбыл ауданы Майбалық ауылдық округі әкімінің аппараты» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2024 жылғы 27 желтоқсандағы № 25/14 шешіміне өзгерістер енгізу туралы
