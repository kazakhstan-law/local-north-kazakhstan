  title:
    rus: О внесении дополнений в решение акима Жамбылского сельского округа Жамбылского района Северо-Казахстанской области от 19 декабря 2024 года № 27 «Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников коммунального государственного учреждения «Аппарат акима Жамбылского сельского округа Жамбылского района Северо-Казахстанской области» финансируемых из местного бюджета
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы Жамбыл ауылдық округі әкімінің 2024 жылғы 19 желтоқсандағы № 27 «Жергілікті бюджеттен қаржыландырылатын «Солтүстік Қазақстан облысы Жамбыл ауданы Жамбыл ауылдық округі әкімінің аппараты» коммуналдық мемлекеттік мекемесінің жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын төлеу тәртібі мен шарттарын айқындау туралы» шешіміне толықтырулар енгізу туралы
