title:
  rus: Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников коммунального государственного учреждения «Аппарат акима Жамбылского сельского округа Жамбылского района Северо-Казахстанской области» финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Солтүстік Қазақстан облысы Жамбыл ауданы Жамбыл ауылдық округі әкімінің аппараты» коммуналдық мемлекеттік мекемесінің жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын төлеу тәртібі мен шарттарын айқындау туралы
