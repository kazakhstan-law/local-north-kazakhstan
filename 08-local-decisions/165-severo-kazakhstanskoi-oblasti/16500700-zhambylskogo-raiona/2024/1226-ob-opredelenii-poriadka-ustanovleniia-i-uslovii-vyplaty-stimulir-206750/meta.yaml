title:
  rus: Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников организаций Кайранкольского сельского округа Жамбылского района Северо-Казахстанской области финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Солтүстік Қазақстан облысы Жамбыл ауданы Қайранкөл ауылдық округі ұйымының жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын төлеу тәртібі мен шарттарын айқындау туралы
