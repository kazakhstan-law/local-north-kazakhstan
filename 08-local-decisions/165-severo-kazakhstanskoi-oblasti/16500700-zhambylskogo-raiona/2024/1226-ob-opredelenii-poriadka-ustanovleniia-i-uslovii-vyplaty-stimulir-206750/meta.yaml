  title:
    rus: О внесении дополнений в решение акима Кайранкольского сельского округа Жамбылского района Северо-Казахстанской области от 26 декабря 2024 года № 25 «Об определении Порядка установления и условий выплаты стимулирующей надбавки к должностному окладу работников организаций Кайранкольского сельского округа Жамбылского района Северо-Казахстанской области финансируемых из местного бюджета»
    kaz: Солтүстік Қазақстан облысы Жамбыл ауданы Қайранкөл ауылдық округі әкімінің 2024 жылғы 26 желтоқсандағы № 25 «Жергілікті бюджеттен қаржыландырылатын Солтүстік Қазақстан облысы Жамбыл ауданы Қайранкөл ауылдық округі ұйымының жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын төлеу Тәртібі мен шарттарын айқындау туралы» шешіміне толықтырулар енгізу туралы
