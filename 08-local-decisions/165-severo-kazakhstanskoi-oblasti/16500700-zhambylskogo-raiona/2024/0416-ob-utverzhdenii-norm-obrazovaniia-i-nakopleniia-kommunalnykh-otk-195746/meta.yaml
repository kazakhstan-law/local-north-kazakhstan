title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку и захоронение твердых бытовых отходов по Жамбылскому району Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға және көмуге арналған тарифтерді бекіту туралы
