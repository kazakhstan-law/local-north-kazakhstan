  title:
    rus: О внесении изменений в решение маслихата Жамбылского района Северо-Казахстанской области от 16 апреля 2024 года № 17/2 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Жамбылскому району Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының 2024 жылдың 16 сәуірдегі № 17/2 шешіміне өзгерістер енгізу туралы
