requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 20 марта 2018 года № 20/6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 апреля 2018 года № 4637. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 29 апреля 2021 года № 4/4  (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области
  kaz: «Солтүстік Қазақстан облысы Жамбыл ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
