act_code: '119008'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 12 февраля 2018 года № 19/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 февраля 2018 года № 4577
title:
  rus: О предоставлении подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области в 2018 году
  kaz: 2018 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
