requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 20 февраля 2017 года № 9/11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 марта 2017 года № 4104. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 8 июня 2020 года № 49/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат маслихата Жамбылского района Северо-Казахстанской области» и его описания
