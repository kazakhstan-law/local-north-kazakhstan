  title:
    rus: О внесении изменений в решение маслихата Жамбылского района от 29 сентября 2017 года № 15/2 «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Пресновка и сельских населенных пунктов Жамбылского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Жамбыл ауданының Пресновка ауылы мен ауылдық елді мекендеріндегі жерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» Жамбыл ауданы мәслихатының 2017 жылғы 29 қыркүйектегі № 15/2 шешіміне өзгерістер енгізу туралы
