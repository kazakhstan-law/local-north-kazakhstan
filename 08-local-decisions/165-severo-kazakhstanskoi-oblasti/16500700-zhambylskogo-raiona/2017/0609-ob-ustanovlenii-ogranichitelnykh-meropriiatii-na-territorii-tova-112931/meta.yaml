requisite: Решение акима Кладбинского сельского округа Жамбылского района Северо-Казахстанской области от 9 июня 2017 года № 06. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 июня 2017 года № 4229. Утратило силу решением акима Кладбинского сельского округа Жамбылского района Северо-Казахстанской области от 6 сентября 2017 года № 13
title:
  rus: Об установлении ограничительных мероприятий на территории товарищества с ограниченной ответственностью «Агротехника Жамбыл» села Новорыбинка Кладбинского сельского округа Жамбылского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Жамбыл ауданы Кладбинка ауылдық округі Новорыбинка ауылындағы «Агротехника Жамбыл» жауапкершілігі шектеулі серіктестігінің аумағында шектеу іс-шараларын белгілеу туралы
