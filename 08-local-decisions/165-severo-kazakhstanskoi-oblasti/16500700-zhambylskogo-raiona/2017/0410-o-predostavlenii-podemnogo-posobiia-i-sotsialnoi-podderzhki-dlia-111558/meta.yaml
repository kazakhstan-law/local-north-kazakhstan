act_code: '111558'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 10 апреля 2017 года № 10/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 апреля 2017 года № 4158
title:
  rus: О предоставлении подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области в 2017 году
  kaz: 2017 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
