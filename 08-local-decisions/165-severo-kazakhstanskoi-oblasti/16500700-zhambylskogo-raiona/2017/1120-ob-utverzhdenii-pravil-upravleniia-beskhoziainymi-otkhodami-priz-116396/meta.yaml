requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 20 ноября 2017 года № 16/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 декабря 2017 года № 4394. Утратил силу решением маслихата Жамбылского района Северо-Казахстанской области от 24 ноября 2021 года № 9/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
