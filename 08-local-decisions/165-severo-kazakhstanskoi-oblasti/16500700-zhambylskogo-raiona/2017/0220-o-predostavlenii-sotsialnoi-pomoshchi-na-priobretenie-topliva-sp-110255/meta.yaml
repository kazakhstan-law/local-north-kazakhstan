act_code: '110255'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 20 февраля 2017 года № 9/6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 марта 2017 года № 4086. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 16 июля 2019 года № 36/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының ауылдық елдi мекендерінде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы
