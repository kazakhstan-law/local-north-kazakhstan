requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 28 марта 2011 года № 32/2. Зарегистрировано Управлением юстиции Жамбылского района Северо-Казахстанской области 21 апреля 2011 года № 13-7-146. Утратило силу - решением маслихата Жамбылского района Северо-Казахстанской области от 16 апреля 2012 года № 3/7
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты Жамбылского района в 2011 году
  kaz: 2011 жылы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға әлеуметтік қолдауды ұсыну туралы
