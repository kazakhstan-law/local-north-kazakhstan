act_code: '61995'
requisite: Решение акима Жамбылского района Северо-Казахстанской области от 29 ноября 2011 года № 32. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 декабря 2011 года № 13-7-165. Утратило силу в связи с истечением срока действия (письмо аппарата акима Жамбылского района Северо-Казахстанской области от 22 мая 2012 года № 02-05-1.4-2/328
title:
  rus: Об организации и обеспечении на территории Жамбылского района приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Жамбыл ауданының аумағында Қазақстан Республикасының тіркеу жылында он жеті жасқа толатын ер жынысты, сонымен қатар, жасы үлкен бұрын шақыру учаскесінде тіркелмеген азаматтарды тіркеуді ұйымдастыру және қамтамасыз ету жөнінде
