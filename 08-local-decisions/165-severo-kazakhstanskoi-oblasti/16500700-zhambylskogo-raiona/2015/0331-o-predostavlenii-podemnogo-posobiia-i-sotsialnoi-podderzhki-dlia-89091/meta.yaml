act_code: '89091'
requisite: Решение маслихата Жамбылского района Северо-Казахстанской области от 31 марта 2015 года № 36/7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 апреля 2015 года № 3225. Утратило силу решением маслихата Жамбылского района Северо-Казахстанской области от 9 марта 2016 года № 46/15
title:
  rus: О предоставлении подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жамбылского района Северо-Казахстанской области в 2015 году
  kaz: 2015 жылы Солтүстік Қазақстан облысы Жамбыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
