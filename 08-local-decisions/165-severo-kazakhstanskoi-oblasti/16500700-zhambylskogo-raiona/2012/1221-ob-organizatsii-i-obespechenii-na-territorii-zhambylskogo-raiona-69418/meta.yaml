requisite: Решение акима Жамбылского района Северо-Казахстанской области от 21 декабря 2012 года № 40. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 декабря 2012 года № 2026. Утратило силу (письмо аппарата акима Жамбылского района Северо-Казахстанской области от 12 октября 2013 года № 02-05-1.4-12/898)
