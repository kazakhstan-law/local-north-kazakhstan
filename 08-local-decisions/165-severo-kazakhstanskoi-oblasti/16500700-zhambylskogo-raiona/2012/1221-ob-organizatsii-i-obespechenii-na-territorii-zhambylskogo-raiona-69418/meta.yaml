  kaz: Қазақстан республикасының ер азаматтарын 2013 жылдың қаңтарынан наурызына дейін Солтүстік Қазақстан облысы Жамбыл ауданының аумағында тіркеуді және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
