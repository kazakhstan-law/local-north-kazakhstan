requisite: Решение акима Комсомольского сельского округа Тимирязевского района Северо-Казахстанской области от 28 марта 2016 года № 4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 марта 2016 года № 3673. Утратило силу решением акима Комсомольского сельского округа Тимирязевского района Северо-Казахстанской области от 2 сентября 2016 года № 9
