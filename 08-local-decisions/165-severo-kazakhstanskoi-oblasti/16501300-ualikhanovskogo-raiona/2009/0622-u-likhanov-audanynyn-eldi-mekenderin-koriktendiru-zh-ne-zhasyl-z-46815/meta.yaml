act_code: '46815'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2009 жылғы 22 маусымдағы № 9-14с шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2009 жылғы 10 шілдеде № 13-13-107 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2012 жылғы 14 маусымдағы № 15-4с шешімімен
