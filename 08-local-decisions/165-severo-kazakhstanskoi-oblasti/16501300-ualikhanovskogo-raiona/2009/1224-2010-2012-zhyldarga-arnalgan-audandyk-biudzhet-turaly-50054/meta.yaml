act_code: '50054'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2009 жылғы 24 желтоқсандағы № 2-18с шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 19 қаңтарда № 13-13-118 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2011 жылғы 3 қазандағы № 02-03-03/222 хаты)
