requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2004 жылғы 15 шілдедегі № 9-8 с шешімі. Солтүстік Қазақстан облысының Әділет департаментінде 2004 жылғы 17 тамызда № 1330 болып тіркелді
