requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихаттың 2004 жылғы 27 ақпандағы № 6-5с шешімі. Солтүстік Қазақстан облысының Әділет департаментінде 2004 жылғы 24 наурызда № 1194 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихаттың 2010 жылғы 2 тамыздағы № 9-23с шешімімен
