  title:
    rus: О внесении изменения в решение Уалихановского районного маслихата Северо-Казахстанской области от 12 ноября 2021 года № 13-11 с «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Уалихановском районе»
    kaz: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2021 жылғы 12 қарашадағы № 13-11 с «Уәлиханов ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгеріс енгізу туралы
