act_code: '111996'
requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 12 апреля 2017 года № 2-14 с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 мая 2017 года № 4174. Утратило силу решением Уалихановского районного маслихата Северо-Казахстанской области от 15 ноября 2023 года № 13-10 с (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
