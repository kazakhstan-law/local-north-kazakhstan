    kaz: Уәлиханов аудандық мәслихатының 2017 жылғы 12 сәуірдегі №2-14 с «Солтүстік Қазақстан облысы Уәлиханов ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
