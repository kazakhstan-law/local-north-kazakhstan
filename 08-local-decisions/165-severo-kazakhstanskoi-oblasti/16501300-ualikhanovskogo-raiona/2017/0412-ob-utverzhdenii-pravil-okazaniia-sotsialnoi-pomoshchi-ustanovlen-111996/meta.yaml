  title:
    rus: О внесении изменений в решение Уалихановского районного маслихата Северо-Казахстанской области от 12 апреля 2017 года № 2-14с «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Уалихановского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2017 жылғы 12 сәуірдегі № 2-14с «Солтүстік Қазақстан облысы Уәлиханов ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
