title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Кишкенеколь и населенных пунктов Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы Кішкенекөл ауылы және ауылдық елді мекендерінің жер учаскелеріне базалық мөлшерлемелер төлеміне түзету коэффициенттерін және жерлерді аймақтау жобасын (схемасын), бағалау аймақтарының шекараларын бекіту туралы
