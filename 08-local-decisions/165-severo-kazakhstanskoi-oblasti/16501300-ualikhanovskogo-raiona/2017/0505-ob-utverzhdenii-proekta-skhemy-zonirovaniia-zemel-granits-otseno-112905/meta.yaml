  title:
    rus: О внесении изменений в решение Уалихановского районного маслихата Северо-Казахстанской области от 5 мая 2017 года № 7-15 с «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Кишкенеколь и населенных пунктов Уалихановского района Северо-Казахстанской области»
