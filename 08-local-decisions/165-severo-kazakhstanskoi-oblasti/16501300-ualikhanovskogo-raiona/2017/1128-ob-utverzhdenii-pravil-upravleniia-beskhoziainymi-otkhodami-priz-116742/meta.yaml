requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 28 ноября 2017 года № 9-18с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 декабря 2017 года № 4422. Утратил силу решением Уалихановского районного маслихата Северо-Казахстанской области от 14 октября 2021 года № 5-10 с (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Уалихановского района Северо-Казахстанской области
