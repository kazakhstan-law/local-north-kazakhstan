requisite: Решение акима Амангельдинского сельского округа Уалихановского района Северо-Казахстанской области от 11 сентября 2017 года № 5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 сентября 2017 года № 4324. Утратило силу решением акима Амангельдинского сельского округа Уалихановского района Северо-Казахстанской области от 16 января 2018 года № 2
title:
  rus: Об установлении ограничительных мероприятий по бруцеллезу крупного рогатого скота на стадо в трех километрах юго-восточнее от села Тлеусай Амангельдинского сельского округа Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы, Амангелді ауылдық округі Тлеусай ауылының оңтүстік-шығысынан үш шақырым қашықтықта тұрған ірі қара мал табынында бруцеллез ауруы бойынша шектеу іс-шараларын белгілеу туралы
