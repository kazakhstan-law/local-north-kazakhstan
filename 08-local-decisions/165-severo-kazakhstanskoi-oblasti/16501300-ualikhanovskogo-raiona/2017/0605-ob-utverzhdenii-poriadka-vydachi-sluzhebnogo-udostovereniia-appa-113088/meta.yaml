act_code: '113088'
requisite: Постановление акимата Уалихановского района Северо-Казахстанской области от 5 июня 2017 года № 177. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 июня 2017 года № 4238. Утратило силу постановлением акимата Уалихановского района Северо-Казахстанской области от 5 июня 2020 года № 146 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения аппарата акима района, аппаратов акимов сельских округов и исполнительных органов Уалихановского района Северо-Казахстанской области, содержащихся за счет средств районного бюджета, и его описания
  kaz: Аудан әкімі аппараты, ауылдық округ әкімдері аппараттарының және аудандық бюджет қаражаты есебінен ұсталатын Солтүстік Қазақстан облысы Уәлиханов ауданы атқарушы органдарының қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы
