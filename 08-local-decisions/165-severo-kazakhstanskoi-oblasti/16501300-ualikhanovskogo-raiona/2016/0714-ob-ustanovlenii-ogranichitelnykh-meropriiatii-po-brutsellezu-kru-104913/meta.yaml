requisite: Решение акима Кишкенекольского сельского округа Уалихановского района Северо-Казахстанской области от 14 июля 2016 года № 52. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 июля 2016 года № 3838. Утратило силу решением акима Кишкенекольского сельского округа Уалихановского района Северо-Казахстанской области от 25 октября 2016 года № 70
