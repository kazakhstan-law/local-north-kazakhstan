act_code: '108904'
requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 26 декабря 2016 года № 5-10 с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 января 2017 года № 4015
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2017 году
  kaz: 2017 жылы Уәлиханов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
