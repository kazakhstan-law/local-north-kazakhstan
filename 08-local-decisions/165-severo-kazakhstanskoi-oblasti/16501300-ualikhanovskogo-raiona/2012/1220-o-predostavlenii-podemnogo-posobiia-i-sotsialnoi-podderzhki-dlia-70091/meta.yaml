requisite: Решение маслихата Уалихановского района Северо-Казахстанской области от 20 декабря 2012 года № 8-9с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 января 2013 года № 2054. Утратило силу (письмо маслихата Уалихановского района Северо-Казахстанской области от 04.08.2014 № 14.2.3-3/167).
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2013 год
  kaz: 2013 жылы Уәлиханов ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін үшін әлеуметтік қолдауды ұсыну туралы
