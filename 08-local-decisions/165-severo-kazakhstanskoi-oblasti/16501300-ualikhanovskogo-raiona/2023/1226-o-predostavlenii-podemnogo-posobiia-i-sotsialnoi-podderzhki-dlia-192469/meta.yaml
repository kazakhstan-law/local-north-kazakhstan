act_code: '192469'
requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 26 декабря 2023 года № 5-12 с
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы  и проживания в сельские населенные пункты Уалихановского района в 2024 году
  kaz: 2024 жылы Уәлиханов ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды көрсету туралы
