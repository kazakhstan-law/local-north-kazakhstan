    kaz: Уәлиханов аудандық мәслихатының 2023 жылғы 15 қарашадағы № 13-10 с «Солтүстік Қазақстан облысы Уәлиханов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
