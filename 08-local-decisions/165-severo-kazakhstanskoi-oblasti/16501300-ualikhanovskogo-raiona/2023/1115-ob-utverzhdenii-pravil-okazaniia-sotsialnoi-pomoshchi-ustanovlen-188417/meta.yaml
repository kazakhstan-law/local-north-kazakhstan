  title:
    rus: О внесении изменения в решение Уалихановского районного маслихата Северо-Казахстанской области от 15 ноября 2023 года № 13-10 с «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Уалихановского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2023 жылғы 15 қарашадағы № 13-10 с «Солтүстік Қазақстан облысы Уәлиханов ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
