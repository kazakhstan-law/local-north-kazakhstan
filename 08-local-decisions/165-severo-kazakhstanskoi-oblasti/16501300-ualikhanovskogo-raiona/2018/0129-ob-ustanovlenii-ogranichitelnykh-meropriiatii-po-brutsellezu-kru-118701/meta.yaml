requisite: Решение акима Коктерекского сельского округа Уалихановского района Северо-Казахстанской области от 29 января 2018 года № 2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 февраля 2018 года № 4566. Утратило силу решением акима Коктерекского сельского округа  Уалихановского района Северо-Казахстанской области от 27 февраля 2019 года № 8 (вводится в действие со дня его первого официального опубликования)
title:
