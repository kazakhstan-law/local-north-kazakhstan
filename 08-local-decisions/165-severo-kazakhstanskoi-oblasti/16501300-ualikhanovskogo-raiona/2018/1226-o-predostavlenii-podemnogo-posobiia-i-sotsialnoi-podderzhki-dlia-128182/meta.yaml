  title:
    rus: О внесении изменения в решение Уалихановского районного маслихата Северо – Казахстанской области от 26 декабря 2018 года № 8-32 с «О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2019 году»
    kaz: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2018 жылғы 26 желтоқсандағы № 8-32 с «2019 жылы Уәлиханов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы» шешіміне өзгеріс енгізу туралы
