requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімінің 2010 жылғы 5 қаңтардағы № 1 шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 6 қаңтарда № 13-13-117 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов ауданы әкімінің 2010 жылғы 6 желтоқсандағы № 22 Шешімімен
