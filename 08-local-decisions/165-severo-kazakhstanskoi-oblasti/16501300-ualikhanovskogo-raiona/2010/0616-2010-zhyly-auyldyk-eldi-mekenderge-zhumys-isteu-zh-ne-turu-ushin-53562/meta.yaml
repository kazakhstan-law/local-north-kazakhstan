act_code: '53562'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2010 жылғы 16 маусымдағы № 5-22с шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 20 шілдеде № 13-13-126 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2011 жылғы 3 қазандағы № 02-03-03/222 хаты)
title:
  rus: 2010 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
