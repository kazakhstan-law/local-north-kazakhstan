act_code: '57122'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 6-25с шешімі. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 25 қаңтарда № 13-13-135 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы мәслихатының 2012 жылғы 10 желтоқсандағы № 02-03-03/237 хаты)
