requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2010 жылғы 12 сәуірдегі № 2-21с шешімі. Солтүстік Қазақстан облысы Уәлиханов ауданының Әділет басқармасында 2010 жылғы 29 сәуірде № 13-13-121 тіркелді. Күші жойылды - Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2013 жылғы 29 наурыздағы № 19-10с шешімімен
