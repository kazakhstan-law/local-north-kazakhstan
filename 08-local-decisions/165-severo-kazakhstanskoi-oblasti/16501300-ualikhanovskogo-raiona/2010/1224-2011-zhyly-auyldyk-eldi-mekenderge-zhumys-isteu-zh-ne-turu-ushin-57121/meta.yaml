act_code: '57121'
requisite: Солтүстік Қазақстан облысы Уәлиханов аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 9-25с шешімі. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 25 қаңтарда № 13-13-134 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы мәслихатының 2012 жылғы 10 желтоқсандағы № 02-03-03/237 хаты)
title:
  rus: 2011 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
  kaz: 2011 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
