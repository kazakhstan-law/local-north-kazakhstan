act_code: '61797'
requisite: Солтүстік Қазақстан облысы Уәлиханов ауданы әкімінің 2011 жылғы 30 қарашадағы № 33 шешімі. Солтүстік Қазақстан облысының Әділет департаментінде 2011 жылғы 8 желтоқсанда № 13-13-149 тіркелді. Қолдану мерзімінің өтуіне байланысты күшін жойды (Солтүстік Қазақстан облысы Уәлиханов ауданы әкімі аппаратының 2012 жылғы 13 қыркүйектегі № 02.12.06-09/233 хаты)
title:
  rus: Қазақстан Республикасының 1995 жылы туған еркек жынысты азаматтарын Уәлиханов ауданының аумағында 2012 жылдың қаңтарынан наурызына дейін шақыру учаскесінде тіркеуді ұйымдастыру және қамтамасыз ету туралы
