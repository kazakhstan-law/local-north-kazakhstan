  title:
    rus: О внесении изменений в решение Уалихановского районного маслихата от 6 февраля 2014 года № 2-20с "Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Уалихановском районе"
    kaz: '"Уәлиханов ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін  айқындаудың қағидасын бекіту туралы" Уәлиханов аудандың мәслихатының 2014 жылғы 6 ақпандағы № 2-20с шешіміне өзгерістер енгізу туралы'
