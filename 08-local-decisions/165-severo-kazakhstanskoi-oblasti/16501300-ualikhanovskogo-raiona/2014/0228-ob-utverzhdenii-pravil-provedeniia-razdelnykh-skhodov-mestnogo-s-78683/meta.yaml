requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 28 февраля 2014 года № 13-21с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 апреля 2014 года № 2657. Утратил силу решением Уалихановского районного маслихата Северо-Казахстанской области от 24 декабря 2021 года № 8-13 с (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц, многоквартирного жилого дома села Кишкенеколь для участия в сходе местного сообщества Кишкенекольского сельского округа Уалихановского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Уәлиханов ауданы Кішкенекөл ауылының Кішкенекөл ауылдық округі жергілікті қоғамдастық жиынына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу қағидасын және көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
