act_code: '137689'
requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 25 декабря 2019 года № 3-48 с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области от 30 декабря 2019 года № 5775
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2020 году
  kaz: 2020 жылы Уәлиханов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
