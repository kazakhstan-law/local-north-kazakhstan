act_code: '76975'
requisite: Решение Уалихановского районного маслихата Северо-Казахстанской области от 25 декабря 2013 года № 7-19с. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 января 2014 года № 2503. Утратило силу в связи с истечением срока действия (письмо маслихата Уалихановского района Северо-Казахстанской области от 10 марта 2015 года № 14.2.3-3/38)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2014 году
  kaz: 2014 жылы Уәлиханов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
