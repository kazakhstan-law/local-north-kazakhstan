  title:
    rus: О внесении изменений в решение Уалихановского районного маслихата от 25 декабря 2013 года № 7-19 с "О предоставлении подъемного Пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Уалихановского района в 2014 году
    kaz: '"2014 жылы Уәлиханов ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы" Уәлиханов аудандық мәслихатының 2013 жылғы 25 желтоқсандағы N 7-19 с шешіміне өзгерістер енгізу туралы'
