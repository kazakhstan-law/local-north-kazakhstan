  title:
    rus: О внесении изменений в решение маслихата Есильского района Северо-Казахстанской области от 16 марта 2017 года № 11/61 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Есильского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2017 жылғы 16 наурыздағы № 11/61 «Солтүстік Қазақстан облысы Есіл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
