  title:
    rus: О внесении изменений в решение маслихата Есильского района Северо-Казахстанской области от 11 декабря 2017 года № 22/113 «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Явленка и сельских населенных пунктов Есильского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2017 жылғы 11 желтоқсандағы № 22/113 «Солтүстік Қазақстан облысы Явленка ауылының жер телімдерінің және Есіл ауданының ауылдық елді мекендердің төлемақылық базалық ставкаларына арналған түзету коэффиценттерін және бағалау аймақтарының шекараларын, жерлерді аймақтандыру жобасын (схемасын) бекіту туралы» шешіміне өзгерістер енгізу туралы
