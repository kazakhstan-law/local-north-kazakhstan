title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Явленка и сельских населенных пунктов Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Явленка ауылының жер телімдерінің және Есіл ауданының ауылдық елді мекендердің төлемақылық базалық ставкаларына арналған түзету коэффициенттерін және бағалау аймақтарының шекараларын, жерлерді аймақтандыру жобасын (схемасын) бекіту туралы
