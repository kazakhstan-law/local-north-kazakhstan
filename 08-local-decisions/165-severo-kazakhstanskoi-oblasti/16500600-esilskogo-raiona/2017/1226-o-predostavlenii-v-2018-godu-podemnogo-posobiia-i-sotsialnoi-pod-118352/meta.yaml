act_code: '118352'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 26 декабря 2017 года № 23/116. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 января 2018 года № 4515
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешендері мамандарына тұрғын-үй салуға немесе сатып алуға 2018 жылы әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
