requisite: Решение маслихата Есильского района Северо-Казахстанской области от 6 марта 2017 года № 11/62. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 апреля 2017 года № 4135. Утратило силу решением маслихата Есильского района Северо-Казахстанской области от 27 марта 2018 года № 26/139
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Есильского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Есіл ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
