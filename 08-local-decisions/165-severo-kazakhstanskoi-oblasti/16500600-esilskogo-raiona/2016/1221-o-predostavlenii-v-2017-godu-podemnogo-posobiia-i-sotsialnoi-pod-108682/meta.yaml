act_code: '108682'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 21 декабря 2016 года № 9/50. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 января 2017 года № 4000
title:
  rus: О предоставлении в 2017 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру,мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына тұрғын үй сатып алу немесе салу үшін 2017 жылы көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
