  title:
    rus: О внесения изменения в решение маслихата Есильского района Северо-Казахстанской области от 27 марта 2014 года № 29/186 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов для участия в сходе местного сообщества села Явленка»
    kaz: «Явленка ауылының жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер мен көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Есіл ауданы мәслихатының 2014 жылғы 27 наурыздағы № 29/186 шешіміне өзгеріс енгізу туралы
