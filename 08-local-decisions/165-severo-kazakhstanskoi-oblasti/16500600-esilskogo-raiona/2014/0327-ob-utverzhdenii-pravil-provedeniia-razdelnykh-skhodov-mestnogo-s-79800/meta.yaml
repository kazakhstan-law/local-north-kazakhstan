requisite: Решение маслихата Есильского района Северо-Казахстанской области от 27 марта 2014 года № 29/180. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 мая 2014 года № 2736. Утратило силу решением маслихата Есильского района Северо-Казахстанской области от 19 сентября 2023 года № 8-94 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Корнеевского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының Корнеевка ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар мен көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
