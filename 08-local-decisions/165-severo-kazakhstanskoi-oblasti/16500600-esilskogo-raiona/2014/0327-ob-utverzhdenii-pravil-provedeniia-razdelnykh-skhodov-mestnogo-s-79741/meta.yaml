title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Заречного сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының Заречный ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар мен көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
