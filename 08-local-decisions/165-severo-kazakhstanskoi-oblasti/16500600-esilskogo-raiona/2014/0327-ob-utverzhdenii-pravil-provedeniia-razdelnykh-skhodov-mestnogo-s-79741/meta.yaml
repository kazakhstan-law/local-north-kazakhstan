  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 27 марта 2014 года № 29/177 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Заречного сельского округа Есильского района Северо-Казахстанской области»
