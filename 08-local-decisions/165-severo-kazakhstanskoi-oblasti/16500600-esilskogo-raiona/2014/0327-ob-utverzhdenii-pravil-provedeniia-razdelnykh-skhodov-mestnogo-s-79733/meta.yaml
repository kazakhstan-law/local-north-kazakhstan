  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 27 марта 2014 года № 29/176 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Волошинского сельского округа Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданы Волошинка ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар мен көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2014 жылғы 27 наурыздағы № 29/176 шешіміне өзгеріс енгізу туралы
