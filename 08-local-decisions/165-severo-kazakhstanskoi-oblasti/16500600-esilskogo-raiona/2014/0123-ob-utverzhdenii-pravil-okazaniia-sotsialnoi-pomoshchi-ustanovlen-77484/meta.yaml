  title:
    rus: О внесении изменений в решение маслихата Есильского района Северо-Казахстанской области от 23 января 2014 года № 26/157 "Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Есильском районе Северо-Казахстанской области"
    kaz: '"Солтүстік Қазақстан облысының Есіл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2014 жылғы 23 қаңтардағы № 26/157 шешіміне өзгерістер енгізу туралы'
