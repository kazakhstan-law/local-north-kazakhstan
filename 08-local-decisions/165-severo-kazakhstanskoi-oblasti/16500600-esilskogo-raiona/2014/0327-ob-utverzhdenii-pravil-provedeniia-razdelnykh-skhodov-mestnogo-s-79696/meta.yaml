title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Алматинского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының Алматы ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
