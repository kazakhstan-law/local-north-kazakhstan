  title:
    rus: О внесении изменений в решение маслихата Есильского района Северо-Казахстанской области от 27 марта 2014 года № 29/172 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Алматинского сельского округа Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының Алматы ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2014 жылғы 27 наурыздағы № 29/172 шешіміне өзгерістер енгізу туралы
