  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 9 февраля 2024 года № 13/196 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Есильскому району Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2024 жылғы 9 ақпандағы № 13/196 шешіміне өзгеріс енгізу туралы
