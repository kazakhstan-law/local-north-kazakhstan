act_code: '97884'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 21 декабря 2015 года № 48/300. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 января 2016 года № 3562
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения,  образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына тұрғын үй сатып алу немесе салу үшін 2016 жылы көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
