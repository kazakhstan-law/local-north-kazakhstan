  title:
    rus: О внесении изменений и дополнения в решение маслихата Есильского района Северо-Казахстанской области от 19 октября 2015 года № 45/286 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2015 жылғы 19 қазандағы № 45/286 шешіміне өзгерістер мен толықтыру енгізу туралы
