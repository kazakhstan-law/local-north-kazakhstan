act_code: '137787'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 25 декабря 2019 года № 45/265. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 31 декабря 2019 года № 5779
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: 2020 жылы Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
