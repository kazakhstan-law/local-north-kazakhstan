  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 23 января 2019 года № 35/204 «О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2019 жылғы 23 қаңтардағы № 35/204 «2019 жылы Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы» шешіміне өзгерту енгізу туралы
