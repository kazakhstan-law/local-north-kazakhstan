  title:
    rus: О внесении изменений в решение маслихата Есильского района Северо-Казахстанской области от 7 октября 2021 года № 11/102 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Есильском районе»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2021 жылғы 7 қазандағы № 11/102 «Есіл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртiбі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
