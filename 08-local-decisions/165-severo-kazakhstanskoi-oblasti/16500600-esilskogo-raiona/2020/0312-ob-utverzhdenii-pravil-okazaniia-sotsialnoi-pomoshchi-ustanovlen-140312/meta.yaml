  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 12 марта 2020 года № 46/290 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Есильском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2020 жылғы 12 наурыздағы № 46/290 «Солтүстік Қазақстан облысы Есіл ауданында әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
