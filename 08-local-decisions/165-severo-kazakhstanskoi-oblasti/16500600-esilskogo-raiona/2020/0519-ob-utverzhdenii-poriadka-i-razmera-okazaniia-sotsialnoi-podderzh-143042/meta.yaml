act_code: '143042'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 19 мая 2020 года № 50/322. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 мая 2020 года № 6311
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданының ауылдық елдi мекендерінде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі мен мөлшерін бекіту туралы
