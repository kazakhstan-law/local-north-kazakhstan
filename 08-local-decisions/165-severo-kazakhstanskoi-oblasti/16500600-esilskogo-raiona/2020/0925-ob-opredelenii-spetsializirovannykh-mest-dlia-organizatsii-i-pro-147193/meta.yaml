act_code: '147193'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 25 сентября 2020 года № 54/340. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 октября 2020 года № 6582
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка использования мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования в Есильском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
