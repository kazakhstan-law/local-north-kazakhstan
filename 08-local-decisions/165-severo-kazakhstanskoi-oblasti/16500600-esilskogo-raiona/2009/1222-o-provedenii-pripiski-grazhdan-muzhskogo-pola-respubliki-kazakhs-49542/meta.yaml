requisite: Решение акима Есильского района Северо-Казахстанской области от 22 декабря 2009 года № 9. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 28 декабря 2009 года № 13-6-133. Утратило силу - решением акима Есильского района Северо-Казахстанской области от 24 ноября 2010 года № 18
title:
  rus: О проведении приписки граждан мужского пола Республики Казахстан 1993 года рождения и старших призывных возрастов, не прошедших ранее приписку к призывному участку отдела по делам обороны Есильского района Северо-Казахстанской области с января по март 2010 года
  kaz: Қазақстан Республикасының 1993 жылы туған еркек жынысты азаматтарын және шақырылу жасынан өткен бұрын шақыру учаскесінде тіркеуден өтпеген ересек азаматтарды Солтүстік Қазақстан облысы Есіл ауданының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне 2010 жылғы қаңтар-наурыз аралығында тіркеуді жүргізу туралы
