  title:
    rus: О внесении изменений в решение акима Есильского района от 22 декабря 2009 года № 9 "О проведении приписки граждан мужского пола Республики Казахстан 1993 года рождения и старших призывных возрастов, не прошедших ранее приписку к призывному участку отдела по делам обороны Есильского района Северо-Казахстанской области с января по март 2010 года"
    kaz: '"Қазақстан Республикасының 1993 жылы туған еркек жынысты азаматтарын және шақырылу жасынан өткен бұрын шақыру учаскесінде тіркеуден өтпеген ересек азаматтарды Солтүстік Қазақстан облысы Есіл ауданының қорғаныс істері жөніндегі бөлімінің шақыру учаскесіне 2010 жылғы қаңтар-наурыз аралығында тіркеуді жүргізу туралы" Есіл ауданы әкімінің 2009 жылғы 22 желтоқсандағы № 9 шешіміне өзгерістер енгізу туралы'
