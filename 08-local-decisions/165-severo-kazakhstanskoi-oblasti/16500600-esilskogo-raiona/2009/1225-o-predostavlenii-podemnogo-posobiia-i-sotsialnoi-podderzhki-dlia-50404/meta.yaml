requisite: Решение маслихата Есильского района Северо-Казахстанской области от 25 декабря 2009 года № 24/146. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 29 января 2010 года № 13-6-138. Утратило силу - решением маслихата Есильского района Северо-Казахстанской области от 22 декабря 2010 года № 36/212
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Есильского района в 2010 году
  kaz: 2010 жылы Есіл ауданының селолық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
