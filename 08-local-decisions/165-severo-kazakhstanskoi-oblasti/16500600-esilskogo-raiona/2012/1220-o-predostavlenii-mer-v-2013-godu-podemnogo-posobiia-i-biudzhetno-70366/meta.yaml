act_code: '70366'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 20 декабря 2012 года № 13/67. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 января 2013 года № 2090. Утратило силу (письмо маслихата Есильского района Северо-Казахстанской области от 25 февраля 2014 года № 7.2.1-22/45)
title:
  rus: О предоставлении мер в 2013 году подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй сатып алу немесе салу үшін 2013 жылы көтерме жәрдемақы мен бюджеттік несие беру туралы
