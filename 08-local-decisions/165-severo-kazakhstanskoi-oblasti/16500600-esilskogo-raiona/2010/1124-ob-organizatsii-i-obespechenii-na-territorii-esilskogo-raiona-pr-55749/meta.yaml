requisite: Решение акима Есильского района Северо-Казахстанской области от 24 ноября 2010 года № 18. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 8 декабря 2010 года № 13-6-153. Утратило силу - решением акима Есильского района Северо-Казахстанской области от 2 декабря 2011 года № 26
title:
