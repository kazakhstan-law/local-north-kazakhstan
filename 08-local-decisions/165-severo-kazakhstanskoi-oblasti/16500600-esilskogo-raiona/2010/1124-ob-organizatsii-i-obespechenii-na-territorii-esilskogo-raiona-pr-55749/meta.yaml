  kaz: Қазақстан Республикасының 1994 жылы туған еркек жынысты азаматтарын Есіл ауданының аумағында 2011 жылдың қаңтарынан наурызына дейін шақыру учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
