act_code: '57005'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 22 декабря 2010 года № 36/212. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 26 января 2011 года № 13-6-160. Утратило силу - решением маслихата Есильского района Северо-Казахстанской области от 22 декабря 2011 года № 51/276
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін көтерме жәрдемақы мен бюджеттік несие беру туралы
