  title:
    rus: О внесении изменения в решение районного маслихата от 22 декабря 2010 года № 36/212 "О предоставлении подъемного пособия и бюджетного кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Есильского района"
    kaz: '"Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін көтерме жәрдемақы мен бюджеттік несие беру туралы" аудандық мәслихаттың 2010 жылғы 22 желтоқсандағы № 36/212 шешіміне өзгеріс енгізу туралы'
