act_code: '62816'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 22 декабря 2011 года № 51/276. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 января 2012 года № 13-6-183. Утратило силу в связи с истечением срока действия (письмо маслихата Есильского района Северо-Казахстанской области от 11 января 2013 года № 01-21/9)
title:
  rus: О предоставлении в 2012 году подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Есильского района
  kaz: «Есіл ауданының селолық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен бюджеттік несие беру туралы
