requisite: Решение акима Есильского района Северо-Казахстанской области от 2 декабря 2011 года № 26. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 декабря 2011 года № 13-6-181. Утратило силу в связи с истечением срока действия (письмо аппарата акима Есильского района Северо-Казахстанской области от 13 сентября 2012 года № 02.04.01-35/555)
