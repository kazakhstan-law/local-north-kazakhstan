act_code: '189103'
requisite: Решение маслихата Есильского района Северо-Казахстанской области от 27 ноября 2023 года № 10/142
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы для участия в сходе местного сообщества Ильинского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Ильинка ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің сандық құрамын бекіту туралы
