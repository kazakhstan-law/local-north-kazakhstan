  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 27 ноября 2023 года № 10/145 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы для участия в сходе местного сообщества Петровского сельского округа Есильского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы Петровка ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2023 жылғы 27 қарашадағы № 10/145 шешіміне өзгеріс енгізу туралы
