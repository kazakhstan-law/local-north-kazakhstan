  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 17 октября 2023 года № 9/118 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Есильском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2023 жылғы 17 қазандағы № 9/118 «Солтүстік Қазақстан облысы Есіл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
