    kaz: Солтүстік Қазақстан облысы Есіл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2023 жылғы 17 қазандағы № 9/118 шешіміне өзгеріс енгізу туралы
