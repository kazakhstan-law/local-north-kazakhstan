  title:
    rus: О внесении изменений в решение акима Ильинского сельского округа Есильского района Северо-Казахстанской области  от 12 апреля 2023 года № 11 «О присвоении наименований и переименований улиц Ильинского сельского округа Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданы Ильинка ауылдық округі көшелеріне атаулар беру және қайта атау туралы» Солтүстік Қазақстан облысы Есіл ауданы Ильинка ауылдық округі әкімінің 2023 жылғы 12 сәуірдегі № 11 шешіміне өзгерістер енгізу туралы
