title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы для участия в сходе местного сообщества Есильского района Заречного сельского округа Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Заречный ауылдық округінің жергілікті қоғамдастығының бөлек жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің сандық құрамын бекіту туралы
