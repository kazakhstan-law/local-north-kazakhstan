requisite: Решение маслихата Есильского района Северо-Казахстанской области от 17 мая 2022 года № 19/228. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 мая 2022 года № 28092
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности Есильского района Северо-Казахстанской области, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және Солтүстік Қазақстан облысы Есіл ауданының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
