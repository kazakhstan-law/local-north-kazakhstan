  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 17 мая 2022 года № 19/231 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Есильского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Есіл ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2022 жылғы 17 мамырдағы № 19/231 шешімне өзгеріс енгізу туралы
