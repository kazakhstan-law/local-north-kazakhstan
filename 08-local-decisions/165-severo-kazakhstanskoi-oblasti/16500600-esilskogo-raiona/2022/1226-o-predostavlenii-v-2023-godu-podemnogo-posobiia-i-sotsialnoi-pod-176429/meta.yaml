  title:
    rus: О внесении изменения в решение маслихата Есильского района Северо-Казахстанской области от 26 декабря 2022 года № 25/285 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Есильского района»
    kaz: «2023 жылы Есіл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» Солтүстік Қазақстан облысы Есіл ауданы мәслихатының 2023 жылғы 26 желтоқсандағы № 25/285 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/185535/rus
