requisite: Решение маслихата Есильского района Северо-Казахстанской области от 20 марта 2008 года № 6/43. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 17 апреля 2008 года № 13-6-87. Утратило силу в связи с истечением срока действия (письмо маслихата Есильского района Северо-Казахстанской области от 10 октября 2012 года № 01-20/139)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры и спорта, работающим в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт азаматтық қызметкерлеріне жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік көрсеткіштерді белгілеу туралы
