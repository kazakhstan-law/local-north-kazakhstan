requisite: Решение маслихата Есильского района Северо-Казахстанской области от 22 декабря 2008 года № 12/82. Зарегистрировано Управлением юстиции Есильского района Северо-Казахстанской области 30 января 2009 года № 13-6-110. Утратило силу решением маслихата Есильского района Северо-Казахстанской области от 5 июля 2013 года № 18/99
title:
  rus: Об установлении повышенных на двадцать пять процентов должностых окладов и тарифных ставок гражданским служащим, социального обеспечения, образования, культуры и спорта, работающих в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерлерде жұмыс істейтін әлеуметтік қамтамасыз ету, білім, мәдениет және спорт салаларындағы азаматтық қызметшілердің жиырма бес пайызға арттырылған лауазымдық жалақылары мен тарифтік мөлшерлемелерін бекіту туралы
