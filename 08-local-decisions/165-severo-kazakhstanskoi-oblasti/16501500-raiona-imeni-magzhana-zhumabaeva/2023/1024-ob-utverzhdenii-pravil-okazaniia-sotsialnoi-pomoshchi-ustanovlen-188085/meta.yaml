requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 24 октября 2023 года № 7-3. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 8 ноября 2023 года № 7614-15. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 8 мая 2026 года № 39-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
