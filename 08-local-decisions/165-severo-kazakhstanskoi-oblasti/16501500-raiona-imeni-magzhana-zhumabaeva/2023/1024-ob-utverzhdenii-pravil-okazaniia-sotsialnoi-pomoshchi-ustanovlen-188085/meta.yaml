  title:
    rus: О внесении изменений в решение маслихата района Магжана Жумабаева от 24 октября 2023 года № 7-3 «Об утверждении Правил оказания социальной помощи, установления её размеров и определения перечня отдельных категорий нуждающихся граждан района Магжана Жумабаева Северо-Казахстанской области»
    kaz: Мағжан Жұмабаев ауданы мәслихатының 2023 жылғы 24 қазандағы № 7-3 «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының әлеуметтік көмек көрсету, оның мөлшерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
