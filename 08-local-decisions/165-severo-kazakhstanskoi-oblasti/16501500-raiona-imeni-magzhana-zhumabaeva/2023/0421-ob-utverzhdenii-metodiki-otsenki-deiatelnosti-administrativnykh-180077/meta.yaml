    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 21 апреля 2023 года № 2-2 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района Магжана Жумабаева Северо-Казахстанской области»
