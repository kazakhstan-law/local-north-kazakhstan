act_code: '192109'
requisite: Решение Магжана Жумабаевского районного маслихата Северо-Казахстанской области от 27 декабря 2023 года № 9-2
title:
  rus: О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты  района Магжана Жумабаева Северо-Казахстанской области
  kaz: 2024 жылы Солтүстік Қазақстан облысы Мағжан Жумабаев ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
