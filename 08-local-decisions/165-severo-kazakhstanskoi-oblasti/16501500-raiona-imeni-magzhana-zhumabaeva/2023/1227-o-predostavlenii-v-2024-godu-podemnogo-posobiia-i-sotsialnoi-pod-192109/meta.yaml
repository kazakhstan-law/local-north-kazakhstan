caused_by:
  code: '201323'
  requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 1 октября 2024 года № 19-1
  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 декабря 2023 года № 9-2 «О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «2024 жылы Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2023 жылғы 27 желтоқсандағы № 9-2 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201323/rus
