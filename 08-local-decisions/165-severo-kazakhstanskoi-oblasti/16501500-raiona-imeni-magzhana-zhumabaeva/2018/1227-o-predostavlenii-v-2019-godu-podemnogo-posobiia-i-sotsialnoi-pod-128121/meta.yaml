  code: '134181'
  requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 6 августа 2019 года № 31-7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 августа 2019 года № 5544
  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 декабря 2018 года № 25-5 «О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2018 жылғы 27 желтоқсандағы № 25-5 «2019 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134181/rus
