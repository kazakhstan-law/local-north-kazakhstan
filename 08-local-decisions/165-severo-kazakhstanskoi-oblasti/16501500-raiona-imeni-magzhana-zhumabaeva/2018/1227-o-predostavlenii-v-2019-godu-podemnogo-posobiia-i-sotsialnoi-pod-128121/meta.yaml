act_code: '128121'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 декабря 2018 года № 25-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2019 года № 5146
title:
  rus: О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева
  kaz: 2019 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
