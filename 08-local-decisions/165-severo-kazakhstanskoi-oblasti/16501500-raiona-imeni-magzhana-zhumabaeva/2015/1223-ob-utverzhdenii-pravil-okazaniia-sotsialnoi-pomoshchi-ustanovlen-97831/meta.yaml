  title:
    rus: О внесении изменений и дополнений в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2015 года № 45-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2015 жылғы 23 желтоқсандағы № 45-5 шешіміне өзгерістер мен толықтырулар енгізу туралы
