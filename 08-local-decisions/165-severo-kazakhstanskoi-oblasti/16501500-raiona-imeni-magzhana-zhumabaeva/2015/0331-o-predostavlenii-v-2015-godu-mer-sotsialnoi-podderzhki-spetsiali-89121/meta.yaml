act_code: '89121'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 31 марта 2015 года № 37-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 апреля 2015 года № 3221
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы әлеуметтік қолдау шараларын ұсыну туралы
