requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 30 июня 2004 года № 9-4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 августа 2004 года № 1313. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 20 октября 2009 года № 18-2
title:
  rus: О правилах оказания социальной помощи специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим в аульной (сельской) местности, на приобретение топлива
  kaz: Ауылды жерде тұратын денсаулық сақтау, білім, әлеуметтік қамсыздандыру, мәдениет және спорт мемлекеттік ұйымдарының мамандарына отын алу үшін әлеуметтік көмек көрсету ережесі туралы
