  requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 11 июня 2014 года № 28-4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 июля 2014 года № 2847
  title:
    rus: О внесении изменений в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2013 года № 21-6 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева Северо-Казахстанской области"
    kaz: '"Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жүмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы әлеуметтік қолдау шараларын ұсыну туралы" Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатынығ 2013 жылғы 23 желтоқсандағы № 21-6 шешіміне өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/81224/rus
