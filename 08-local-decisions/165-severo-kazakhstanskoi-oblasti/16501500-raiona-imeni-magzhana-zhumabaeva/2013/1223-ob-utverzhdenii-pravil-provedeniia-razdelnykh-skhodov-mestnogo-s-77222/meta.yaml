act_code: '77222'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2013 года № 21-20. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 января 2014 года № 2520. Утратил силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 14 февраля 2022 года № 11-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Возвышенского сельского округа района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы Возвышен ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
