act_code: '72118'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 29 марта 2013 года № 10-4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 апреля 2013 года № 2253. Утратило силу (письмо маслихата района Магжана Жумабаева Северо-Казахстанской области от 16 января 2014 года № 10.2.1-15/7)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева
  kaz: Мағжан Жұмабаев ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы әлеуметтік қолдау шараларын ұсыну туралы
