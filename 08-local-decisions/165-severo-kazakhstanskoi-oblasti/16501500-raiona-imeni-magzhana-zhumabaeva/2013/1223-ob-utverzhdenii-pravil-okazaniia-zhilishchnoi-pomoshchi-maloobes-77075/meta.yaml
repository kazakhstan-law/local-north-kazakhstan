  title:
    rus: О внесении изменений в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2013 года № 21-4 «Об утверждении Правил оказания жилищной помощи малообеспеченным семьям (гражданам), проживающим на территории района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы аумағында тұратын аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсету қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2013 жылғы 23 желтоқсандағы № 21-4 шешіміне өзгерістер енгізу туралы
