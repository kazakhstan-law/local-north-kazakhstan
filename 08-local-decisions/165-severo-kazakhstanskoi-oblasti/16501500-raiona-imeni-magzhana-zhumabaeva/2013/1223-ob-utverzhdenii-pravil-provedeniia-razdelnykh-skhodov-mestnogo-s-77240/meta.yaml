requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2013 года № 21-22. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 января 2014 года № 2538. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 18 февраля 2020 года № 36-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села для участия в сходе местного сообщества Карагандинского сельского округа района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы Қарағанды ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
