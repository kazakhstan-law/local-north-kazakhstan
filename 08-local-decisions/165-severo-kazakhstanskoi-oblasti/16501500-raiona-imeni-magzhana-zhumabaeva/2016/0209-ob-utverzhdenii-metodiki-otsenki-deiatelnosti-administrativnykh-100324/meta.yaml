requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 9 февраля 2016 года № 47-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 марта 2016 года № 3663. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 февраля 2017 года № 10-4
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата района Магжана Жумабаева Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
