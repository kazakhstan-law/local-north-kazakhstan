requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 декабря 2016 года № 8-8. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 января 2017 года № 4033. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 25 июня 2020 года № 39-13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат маслихата района Магжана Жумабаева Северо-Казахстанской области» и его описания
  kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлігін беру Қағидаларын және оның сипаттамасын бекіту туралы
