  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 14 ноября 2016 года № 7-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Магжана Жумабаева Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2016 жылғы 14 қарашадағы № 7-1 шешіміне өзгеріс енгізу туралы
