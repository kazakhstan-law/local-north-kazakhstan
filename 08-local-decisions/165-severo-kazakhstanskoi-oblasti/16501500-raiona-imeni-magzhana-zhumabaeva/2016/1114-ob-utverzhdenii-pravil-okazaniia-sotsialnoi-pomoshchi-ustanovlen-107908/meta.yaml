act_code: '107908'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 14 ноября 2016 года № 7-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 ноября 2016 года № 3946. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 2 июня 2017 года № 11-6
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
