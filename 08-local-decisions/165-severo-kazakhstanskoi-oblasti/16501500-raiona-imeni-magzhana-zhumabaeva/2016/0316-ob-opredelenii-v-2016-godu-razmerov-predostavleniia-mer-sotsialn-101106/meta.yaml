act_code: '101106'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 16 марта 2016 года № 48-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 апреля 2016 года № 3692
title:
  rus: Об определении в 2016 году размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
