act_code: '57100'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 24 декабря 2010 года № 29-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 января 2011 года № 13-9-127. Утратило силу - решением маслихата района имени Магжана Жумабаева Северо-Казахстанской области от 22 декабря 2011 года № 39-4
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева в 2011 годы
  kaz: 2011 жылы Мағжан Жұмабаев ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
