requisite: Решение акима района Магжана Жумабаева Северо-Казахстанской области от 26 ноября 2010 года № 34. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 декабря 2010 года № 13-9-124. Утратило силу - решением акима района Магжана Жумабаева Северо-Казахстанской области от 29 декабря 2011 года № 53
title:
  rus: Об организации и обеспечении на территории района Магжана Жумабаева приписки граждан мужского пола Республики Казахстан 1994 года рождения к призывному участку с января по март 2011 года
  kaz: Мағжан Жұмабаев ауданының шақырту учаскесіне 1994 жылы туған Қазақстан Республикасының ер азаматтарын 2011 жылы қаңтардан наурыз аралығында шақырту учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
