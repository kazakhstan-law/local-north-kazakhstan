act_code: '53361'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 17 июня 2010 года № 24-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 июля 2010 года № 13-9-120. Утратило силу - решением маслихата района имени Магжана Жумабаева Северо-Казахстанской области от 24 декабря 2010 года № 29-11
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева в 2010 году
  kaz: 2010 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу  және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
