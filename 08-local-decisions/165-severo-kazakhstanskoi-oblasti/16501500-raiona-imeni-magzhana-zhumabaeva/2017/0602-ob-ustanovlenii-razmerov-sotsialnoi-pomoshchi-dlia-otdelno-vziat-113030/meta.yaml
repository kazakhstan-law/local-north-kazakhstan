  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 2 июня 2017 года № 11-5 «Об установлении размеров социальной помощи для отдельно взятой категории получателей к памятным датам и праздничным дням»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының «Алушылардың жекелеген санаттары үшін атаулы күндер мен мереке күндеріне әлеуметтік көмектің мөлшерлерін белгілеу туралы» 2017 жылғы 2 маусымдағы № 11-5 шешіміне өзгеріс енгізу туралы
