act_code: '110442'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 февраля 2017 года № 10-4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 марта 2017 года № 4093. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области 29 марта 2018 года № 17-3
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района  Магжана Жумабаева Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
