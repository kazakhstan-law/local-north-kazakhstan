    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 2 июня 2017 года № 11-9 «Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки сельских населенных пунктов района Магжана Жумабаева Северо-Казахстанской области
