requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 2 июня 2017 года № 11-6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 июня 2017 года № 4232. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 19 марта 2020 года № 37-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
