requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 23 ноября 2017 года № 14-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 декабря 2017 года № 4392. Утратило силу решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 3 июля 2021 года № 6-19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
