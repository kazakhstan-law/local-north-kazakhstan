act_code: '66214'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 6 июня 2012 года № 4-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 июня 2012 года № 13-9-158. Утратило силу (письмо маслихата района Магжана Жумабаева Северо-Казахстанской области от 9 января 2013 года № 01-15/5)
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева
  kaz: Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылы әлеуметтік қолдау шараларын ұсыну туралы
