  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 26 августа 2021 года № 8-19 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в районе Магжана Жумабаева Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2021 жылғы 26 тамыздағы № 8-19 «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
