act_code: '154761'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 1 апреля 2021 года № 3-27. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 апреля 2021 года № 7238
title:
  rus: О предоставлении в 2021 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, бразования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева
  kaz: 2021 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
