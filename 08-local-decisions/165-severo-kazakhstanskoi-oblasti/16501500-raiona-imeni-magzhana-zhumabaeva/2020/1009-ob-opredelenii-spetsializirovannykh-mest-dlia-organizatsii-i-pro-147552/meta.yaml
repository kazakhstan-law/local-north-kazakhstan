act_code: '147552'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 9 октября 2020 года № 42-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 октября 2020 года № 6592
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования по району Магжана Жумабаева Северо-Казахстанской области
  kaz: Cолтүстік Қазақстан облысы Мағжан Жұмабаев ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
