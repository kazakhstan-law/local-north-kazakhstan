title:
  rus: О признании утратившим силу решения акима района Магжана Жумабаева Северо-Казахстанской области от 21 апреля 2020 года № 7 «Об объявлении на территории района Магжана Жумабаева Северо-Казахстанской области чрезвычайной ситуации природного характера местного масштаба»
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы әкімінің 2020 жылғы 21 сәуірдегі № 7 «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданының аумағында жергілікті ауқымдағы табиғи сипаттағы төтенше жағдайды жариялау туралы» шешімін күшін жойды деп тану туралы
