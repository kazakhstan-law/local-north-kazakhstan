  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 19 марта 2020 года № 37-4 «Об утверждении Правил оказания социальной помощи, размеров и определения перечня отдельных категорий нуждающихся граждан района Магжана Жумабаева Северо-Казахстанской области»
