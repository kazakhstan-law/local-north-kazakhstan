act_code: '139794'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 18 февраля 2020 года № 36-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 26 февраля 2020 года № 6030
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева
  kaz: 2020 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау шараларын ұсыну туралы
