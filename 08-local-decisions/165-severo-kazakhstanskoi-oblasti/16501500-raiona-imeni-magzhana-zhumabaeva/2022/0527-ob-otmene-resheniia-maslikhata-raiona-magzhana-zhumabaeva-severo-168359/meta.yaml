act_code: '168359'
requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 мая 2022 года № 14-23
title:
  rus: Об отмене решения маслихата района Магжана Жумабаева Северо-Казахстанской области от 15 марта 2022 года № 12-6 «Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по району Магжана Жумабаева Северо-Казахстанской области на 2022 год»
  kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2022 жылғы 15 наурыздағы № 12-6 «2022 жылға арналған Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін бекіту туралы» шешімінің күшін жою туралы
