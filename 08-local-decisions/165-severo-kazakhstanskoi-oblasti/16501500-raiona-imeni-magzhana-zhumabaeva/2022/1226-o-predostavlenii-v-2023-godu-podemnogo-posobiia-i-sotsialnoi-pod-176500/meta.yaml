  requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 24 октября 2023 года № 7-2
  title:
    rus: О внесении изменения в решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 26 декабря 2022 года № 21-5 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Магжана Жумабаева»
    kaz: Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының 2023 жылғы 26 желтоқсандағы № 21-5 «2023 жылы Мағжан Жұмабаев ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187711/rus
