requisite: Решение маслихата района Магжана Жумабаева Северо-Казахстанской области от 27 мая 2022 года № 14-21. Отменено решением маслихата района Магжана Жумабаева Северо-Казахстанской области от 21 апреля 2023 года № 2-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района Магжана Жумабаева Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Мағжан Жұмабаев ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
