act_code: '100321'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 23 февраля 2016 года № 46/7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 марта 2016 года № 3659
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты района Шал акына
  kaz: 2016 жылы Шал ақын ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
