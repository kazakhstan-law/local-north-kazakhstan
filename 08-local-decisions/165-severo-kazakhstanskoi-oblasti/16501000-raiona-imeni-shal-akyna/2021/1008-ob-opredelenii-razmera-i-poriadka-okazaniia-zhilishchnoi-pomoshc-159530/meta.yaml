  title:
    rus: О внесении изменений в решение маслихата района Шал акына Северо-Казахстанской области от 8 октября 2021 года № 12/3 «Об определении размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в районе Шал акына Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының 2021 жылғы 8 қазандағы № 12/3 «Солтүстік Қазақстан облысы Шал ақын ауданында аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
