requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 26 июля 2010 года № 27/3. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 26 августа 2010 года № 13-14-105. Утратило силу (письмо маслихата района Шал акына Северо-Казахстанской области 9 октября 2013 года № 02-04/195)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Шал акына в 2010 году
  kaz: 2010 жылы Шал ақын ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету, мәдениет және спорт мамандарына үй сатып алуға көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
