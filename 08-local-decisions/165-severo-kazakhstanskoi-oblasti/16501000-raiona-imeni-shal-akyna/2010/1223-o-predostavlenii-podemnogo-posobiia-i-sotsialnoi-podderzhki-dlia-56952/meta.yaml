  title:
    rus: О внесении изменения в решение маслихата района Шал акына от 23 декабря 2010 года № 32/5 "О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Шал акына"
    kaz: '"2011 жылы Шал ақын ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету, мәдениет және спорт мамандарына үй сатып алуға көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы" Шал ақын ауданы мәслихатының 2010 жылғы 23 желтоқсандағы № 32/5 шешіміне өзгертулер енгізу туралы'
