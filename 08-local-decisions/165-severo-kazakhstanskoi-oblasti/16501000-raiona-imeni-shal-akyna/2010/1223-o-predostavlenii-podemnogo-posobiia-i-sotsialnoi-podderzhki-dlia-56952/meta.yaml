requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 23 декабря 2010 года № 32/5. Зарегистрировано Управлением юстиции района Шал акына Северо-Казахстанской области 20 января 2011 года № 13-14-121. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата района Шал акына Северо-Казахстанской области от 25 августа 2015 года № 15.2.02-04/188)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Шал акына
  kaz: 2011 жылы Шал ақын ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету,  мәдениет және спорт мамандарына үй сатып алуға көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
