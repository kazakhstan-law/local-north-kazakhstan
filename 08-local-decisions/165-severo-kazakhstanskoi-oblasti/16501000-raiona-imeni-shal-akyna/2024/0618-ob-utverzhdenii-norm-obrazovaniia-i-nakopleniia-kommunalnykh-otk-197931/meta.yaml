requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 18 июня 2024 года № 19/5
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по району Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы
