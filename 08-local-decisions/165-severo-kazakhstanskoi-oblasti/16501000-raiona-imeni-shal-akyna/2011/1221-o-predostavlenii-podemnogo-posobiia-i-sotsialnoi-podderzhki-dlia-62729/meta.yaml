act_code: '62729'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 21 декабря 2011 года № 44/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 января 2012 года № 13-14-143. Утратило силу - решением маслихата района Шал акына Северо-Казахстанской области от 1 августа 2012 года № 5/5
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района Шал акына в 2012 году
  kaz: 2012 жылы Шал ақын ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету, мәдениет және спорт мамандарына үй сатып алуға көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
