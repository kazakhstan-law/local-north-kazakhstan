act_code: '62016'
requisite: Решение акима района Шал акына Северо-Казахстанской области от 18 ноября 2011 года № 32. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 декабря 2011 года № 13-14-139. Утратило силу в связи с истечением срока действия (письмо аппарата акима района Шал акына Северо-Казахстанской области от 5 сентября 2012 года № 2.13-03-13/589)
title:
  rus: Об организации и обеспечении на территории района Шал акына приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Шал ақын ауданы аумағында тізімге алу жылы он жеті жасқа толатын, сонымен қатар бұдан бұрын шақыру учаскесінде тізімге алынбаған үлкен жастардағы Қазақстан Республикасы ер азаматтарының тізімге алынуын ұйымдастыру және қамтамасыз ету туралы
