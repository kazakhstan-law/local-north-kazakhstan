requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 25 октября 2017 года № 18/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 ноября 2017 года № 4362. Утратил силу решением маслихата района Шал акына Северо-Казахстанской области от 19 августа 2021 года № 10/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность района Шал акына Северо-Казахстанской области
