requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 23 февраля 2017 года № 11/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 марта 2017 года № 4106. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 30 марта 2018 года № 23/3
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района Шал акына Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
