  title:
    rus: О внесении изменений в решение маслихата района Шал акына Северо-Казахстанской области от 30 марта 2022 года № 20/3 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в районе Шал акына Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының 2022 жылғы 30 наурыздағы № 20/3 «Солтүстік Қазақстан облысы Шал ақын ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
