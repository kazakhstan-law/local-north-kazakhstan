requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 10 августа 2022 года № 23/15. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 7 августа 2026 года № 44/7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района Шал акына Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
