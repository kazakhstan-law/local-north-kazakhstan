act_code: '165493'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 17 марта 2022 года № 19/4
title:
  rus: О предоставлении в 2022 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Шал акына Северо-Казахстанской области
  kaz: 2022 жылы Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе  салу үшін әлеуметтік қолдау көрсету туралы
