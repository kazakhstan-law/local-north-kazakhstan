requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 30 марта 2022 года № 20/1. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 1 ноября 2023 года № 9/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы для участия в сходе местного сообщества в районе Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиындарына қатысу үшін ауыл, көше тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
