act_code: '129952'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 18 марта 2019 года № 35/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 марта 2019 года № 5265
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности района Шал акына Северо-Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық жерінде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
