  title:
    rus: О внесении изменения в решение маслихата района Шал акына Северо - Казахстанской области от 1 ноября 2023 года № 9/3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Шал акына Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының 2023 жылғы 1 қарашадағы № 9/3 «Солтүстік Қазақстан облысы Шал ақын ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
