act_code: '191215'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 27 декабря 2023 года № 13/4. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 28 декабря 2023 года № 7667-15
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования,культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Шал акына
  kaz: Шал ақын ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
