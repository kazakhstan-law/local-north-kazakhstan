act_code: '70352'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 20 декабря 2012 года № 11/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 января 2013 года № 2081. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата района Шал акына Северо-Казахстанской области от 25 августа 2015 года № 15.2.02-04/188)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района Шал акына в 2013 году
  kaz: 2013 жылы Шал ақын ауданының селолық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыз ету, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау ұсыну туралы
