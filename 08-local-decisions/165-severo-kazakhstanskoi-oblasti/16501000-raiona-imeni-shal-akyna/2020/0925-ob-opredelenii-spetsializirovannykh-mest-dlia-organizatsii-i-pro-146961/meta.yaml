act_code: '146961'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 25 сентября 2020 года № 53/13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 октября 2020 года № 6562
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, норм их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования по району Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айкындау туралы
