act_code: '146839'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 25 сентября 2020 года № 53/12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 сентября 2020 года № 6560
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Шал акына Северо-Казахстанской области
  kaz: 2020 жылы Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
