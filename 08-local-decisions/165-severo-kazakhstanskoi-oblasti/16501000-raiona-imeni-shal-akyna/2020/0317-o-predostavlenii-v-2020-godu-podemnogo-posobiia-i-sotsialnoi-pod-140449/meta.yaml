act_code: '140449'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 17 марта 2020 года № 44/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 марта 2020 года № 6106. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 25 сентября 2020 года № 53/12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Шал акына Северо-Казахстанской области
  kaz: 2020 жылы Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
