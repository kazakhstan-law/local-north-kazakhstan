act_code: '119351'
requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 23 февраля 2018 года № 22/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 марта 2018 года № 4590
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Шал акына Северо-Казахстанской области
  kaz: 2018 жылы Солтүстік Қазақстан облысы Шал ақын ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
