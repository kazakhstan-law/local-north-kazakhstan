requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 30 марта 2018 года № 23/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 апреля 2018 года № 4646. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 13 мая 2021 года № 7/14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района Шал акына Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
