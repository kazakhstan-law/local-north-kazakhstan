  title:
    rus: О внесении изменения в решение маслихата района Шал акына Северо - Казахстанской области от 3 февраля  2014 года № 25/12 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей города для участия в сходе местного сообщества города Сергеевка района Шал акына Северо-Казахстанской области»
