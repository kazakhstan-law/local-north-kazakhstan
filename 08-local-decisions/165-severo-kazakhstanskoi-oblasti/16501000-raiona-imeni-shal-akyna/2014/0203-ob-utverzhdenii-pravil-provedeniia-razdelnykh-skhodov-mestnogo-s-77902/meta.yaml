requisite: Решение маслихата района Шал акына Северо-Казахстанской области от 3 февраля 2014 года № 25/12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 марта 2014 года № 2598. Утратило силу решением маслихата района Шал акына Северо-Казахстанской области от 17 марта 2022 года № 19/9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей города для участия в сходе местного сообщества города Сергеевка района Шал акына Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Шал ақын ауданының Сергеевка қаласында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиындарына қатысатын қала тұрғындары өкілдерінің сандық құрамын бекіту туралы
