    kaz: '"Солтүстік Қазақстан облысы Шал ақын ауданында әлеуметтік көмек көрсету, мөлшерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидаларын бекіту туралы" Шал ақын ауданы мәслихатының  2014 жылғы 3 ақпандағы № 25/1 шешіміне өзгерістер енгізу туралы'
