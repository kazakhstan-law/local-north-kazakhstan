act_code: '94896'
requisite: Решение от 07.10.2015 №42/2, Маслихат района имени Шал Акына
title:
  rus: 'О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Шал акына '
  kaz: 2015 жылы Шал ақын ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақымен әлеуметтік қолдауды ұсыну туралы
