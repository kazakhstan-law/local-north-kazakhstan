  title:
    rus: О внесении изменения в решение маслихата района Шал акына Северо-Казахстанской области от 23 декабря 2015 года № 44/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Шал акына Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Шал ақын ауданында әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Шал ақын ауданы мәслихатының 2015 жылғы 23 желтоқсандағы № 44/4 шешіміне өзгеріс енгізу туралы
