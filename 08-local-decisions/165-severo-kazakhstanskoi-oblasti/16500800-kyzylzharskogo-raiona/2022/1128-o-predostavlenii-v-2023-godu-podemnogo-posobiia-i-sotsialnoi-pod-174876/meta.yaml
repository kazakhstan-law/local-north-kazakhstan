act_code: '174876'
requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 28 ноября 2022 года № 18/2. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 27 сентября 2023 года № 5/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района Северо-Казахстанской области
  kaz: 2023 жылы Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
