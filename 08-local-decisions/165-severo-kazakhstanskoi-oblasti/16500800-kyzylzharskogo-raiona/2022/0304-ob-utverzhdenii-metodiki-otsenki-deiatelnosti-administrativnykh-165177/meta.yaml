  title:
    rus: О внесении изменения в решение Кызылжарского районного маслихата Северо-Казахстанской области от 4 марта 2022 года № 12/5 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2022 жылғы 4 наурыздағы № 12/5 шешіміне өзгеріс енгізу туралы
