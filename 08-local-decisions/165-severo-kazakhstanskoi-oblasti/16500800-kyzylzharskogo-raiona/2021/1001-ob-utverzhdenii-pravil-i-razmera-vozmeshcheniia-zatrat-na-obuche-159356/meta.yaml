  requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 16 июня 2026 года № 31/2. Зарегистрировано в Министерстве юстиции Республики Казахстан 18 июня 2026 года № 38995
  title:
    rus: О внесении изменений в решение маслихата Кызылжарского района Северо-Казахстанской области от 1 октября 2021 года № 8/6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Кызылжарском районе»
    kaz: «Қызылжар ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2021 жылғы 1 қазандағы № 8/6 шешіміне өзгерістер енгізу туралы
