  requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 28 ноября 2022 года № 18/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 ноября 2022 года № 30802
  title:
    rus: О внесении изменений в решение маслихата Кызылжарского района Северо-Казахстанской области от 1 октября 2021 года № 8/6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Кызылжарском районе»
    kaz: Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының 2021 жылғы 1 қазандағы № 8/6 «Қызылжар ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
