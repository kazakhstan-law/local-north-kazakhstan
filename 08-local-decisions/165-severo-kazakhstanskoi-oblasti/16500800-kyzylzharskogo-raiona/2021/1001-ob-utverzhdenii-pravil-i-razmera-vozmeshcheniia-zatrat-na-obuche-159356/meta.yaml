act_code: '159356'
requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 1 октября 2021 года № 8/6. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2021 года № 24719
title:
  rus: Об утверждении правил и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Кызылжарском районе
  kaz: Қызылжар ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу қағидалары мен мөлшерін бекіту туралы
