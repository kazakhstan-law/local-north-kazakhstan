requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 28 марта 2011 года № 33/3. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 14 апреля 2011 года № 13-8-142. Утратило силу - решением маслихата Кызылжарского района Северо-Казахстанской области от 16 апреля 2012 года № 4/4
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района в 2011 году
  kaz: 2011 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдауға және көтерме жәрдемақы ұсыну туралы
