act_code: '61655'
requisite: Решение акима Кызылжарского района Северо-Казахстанской области от 18 ноября 2011 года № 40. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 ноября 2011 года № 13-8-154. Утратило силу в связи с истечением срока действия (письмо аппарата акима Кызылжарского района Северо-Казахстанской области от 13 сентября 2012 года № 02-07-03-04/762)
title:
  rus: Об организации и обеспечении на территории Кызылжарского района приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Қызылжар ауданының аумағында тіркеу жылы он жеті жасқа толатын және одан үлкен жастағы шақыру учаскесінде бұрын тіркелмеген Қазақстан Республикасының ер азаматтарын тіркеуді ұйымдастыру және қамтамасыз ету туралы
