requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 22 декабря 2011 года № 43/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 января 2012 года № 13-8-159. Утратило силу решением маслихата Кызылжарского района Северо-Казахстанской области от 17 мая 2013 года № 14/6
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельской местности
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мемлекеттік мекемелерінің мамандарына отын алу үшін әлеуметтік көмек беру туралы
