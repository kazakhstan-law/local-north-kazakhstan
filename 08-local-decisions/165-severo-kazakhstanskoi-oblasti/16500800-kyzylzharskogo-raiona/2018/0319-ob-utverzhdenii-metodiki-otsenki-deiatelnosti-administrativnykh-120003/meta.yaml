requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 19 марта 2018 года № 25/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 марта 2018 года № 4622. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 23 апреля 2021 года № 5/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
