  title:
    rus: О внесении изменения в решение Кызылжарского районного маслихата Северо-Казахстанской области от 19 марта 2018 года №25/5 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2018 жылғы 19 наурыздағы №25/5 шешіміне өзгеріс енгізу туралы
