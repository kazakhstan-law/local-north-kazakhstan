    kaz: Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2018 жылғы 7 наурыздағы № 24/18 «Қызылжар ауданы бойынша жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешіміне өзгерістер енгізу туралы
