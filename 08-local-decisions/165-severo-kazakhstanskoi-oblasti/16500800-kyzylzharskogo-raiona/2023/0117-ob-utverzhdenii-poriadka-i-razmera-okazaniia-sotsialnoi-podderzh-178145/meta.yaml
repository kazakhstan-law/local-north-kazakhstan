act_code: '178145'
requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 17 января 2023 года № 20/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 января 2023 года № 7438
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, ветеринарии, проживающим и работающим в сельских населенных пунктах Кызылжарского района
  kaz: Қызылжар ауданы ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
