requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 27 сентября 2023 года № 5/4
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы для участия в сходе местного сообщества в Кызылжарском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
