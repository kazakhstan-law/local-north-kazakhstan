  title:
    rus: О внесении изменения в решение Кызылжарского районного маслихата Северо-Казахстанской области от 27 декабря 2023 года № 8/3 «О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района Северо-Казахстанской области»
    kaz: «2024 жылы Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» Солтүстік Қазақстан облысы Қызылжар аудандық маслихатының 2023 жылғы 27 желтоқсандағы № 8/3 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202203/rus
