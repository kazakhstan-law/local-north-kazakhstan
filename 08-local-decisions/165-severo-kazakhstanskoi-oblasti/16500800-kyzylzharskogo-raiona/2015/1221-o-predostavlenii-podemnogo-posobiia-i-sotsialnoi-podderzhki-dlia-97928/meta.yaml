act_code: '97928'
requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 21 декабря 2015 года № 43/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 января 2016 года № 3570
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья в 2016 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына 2016 жылы тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
