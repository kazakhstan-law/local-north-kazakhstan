    kaz: «Қызылжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2014 жылғы 31 қаңтардағы № 23/2 шешіміне өзгеріс енгізу туралы
