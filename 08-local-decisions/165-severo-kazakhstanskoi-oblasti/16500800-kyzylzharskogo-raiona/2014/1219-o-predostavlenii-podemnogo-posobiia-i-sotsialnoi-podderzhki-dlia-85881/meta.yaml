act_code: '85881'
requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 19 декабря 2014 года № 35/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 января 2015 года № 3063. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Кызылжарского района Северо-Казахстанской области от 12 января 2016 года N 9.2.1.29/02)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья в 2015 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района
  kaz: Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласы мамандарына 2015 жылы тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
