act_code: '79874'
requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 11 апреля 2014 года № 25/11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 мая 2014 года № 2772
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья в 2014 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района
  kaz: Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласы мамандарына 2014 жылы тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
