requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 26 февраля 2014 года № 24/18. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 апреля 2014 года № 2652. Утратило силу решением маслихата Кызылжарского района Северо-Казахстанской области от 4 марта 2022 года № 12/9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Светлопольского сельского округа Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданы Светлопольск ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
