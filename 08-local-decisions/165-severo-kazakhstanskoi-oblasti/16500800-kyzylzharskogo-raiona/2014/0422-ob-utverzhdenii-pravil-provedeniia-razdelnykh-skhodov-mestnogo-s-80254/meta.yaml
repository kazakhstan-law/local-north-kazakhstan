  title:
    rus: О внесении изменения в решение Кызылжарского районного маслихата Северо-Казахстанской области от 22 апреля 2014 года № 26/10 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел и улиц для участия в сходе местного сообщества Налобинского сельского округа Кызылжарского района Северо-Казахстанской области»
