requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 22 апреля 2014 года № 26/14. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 мая 2014 года № 2794. Утратило силу решением маслихата Кызылжарского района Северо-Казахстанской области от 4 марта 2022 года № 12/9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, улиц и многоквартирных жилых домов для участия в сходе местного сообщества Рассветского сельского округа Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданы Рассвет ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар, көшелер және көппәтерлі үйлердің тұрғындары өкілдерінің сандық құрамын бекіту туралы
