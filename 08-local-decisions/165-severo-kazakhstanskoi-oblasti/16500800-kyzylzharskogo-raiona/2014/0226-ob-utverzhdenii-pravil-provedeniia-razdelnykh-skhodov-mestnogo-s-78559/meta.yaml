requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 26 февраля 2014 года № 24/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 апреля 2014 года № 2654. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 19 июня 2020 года № 54/14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов для участия в сходе местного сообщества аула Бесколь Бескольского сельского округа Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданы Бескөл ауылдық округінің Бескөл ауылының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелердің және көппәтерлі үйлердің тұрғындары өкілдерінің сандық құрамын бекіту туралы
