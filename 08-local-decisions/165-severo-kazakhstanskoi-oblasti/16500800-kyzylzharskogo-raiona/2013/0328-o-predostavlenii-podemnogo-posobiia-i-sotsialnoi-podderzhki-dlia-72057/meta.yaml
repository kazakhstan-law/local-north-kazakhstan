act_code: '72057'
requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 28 марта 2013 года № 13/12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 17 апреля 2013 года № 2242. Утратило силу (письмо маслихата Кызылжарского района Северо-Казахстанской области от 15 января 2014 года № 9.2.1.29/08)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района в 2013 году
  kaz: 2013 жылы Қызылжар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
