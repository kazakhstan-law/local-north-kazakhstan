title:
  rus: О признании утратившим силу решения акима Кызылжарского района Северо-Казахстанской области от 29 июля 2025 года № 10 «Об образовании избирательных участков на территории Кызылжарского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Қызылжар ауданының аумағында сайлау учаскелерін құру туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімінің 2025 жылғы 29 шілдедегі № 10 шешімінің күшін жою туралы
