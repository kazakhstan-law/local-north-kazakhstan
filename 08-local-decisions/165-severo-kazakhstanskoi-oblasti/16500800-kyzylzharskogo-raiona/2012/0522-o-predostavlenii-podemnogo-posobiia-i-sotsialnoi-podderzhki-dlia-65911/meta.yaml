requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 22 мая 2012 года № 5/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 июня 2012 года № 13-8-169. Утратило силу (письмо маслихата Кызылжарского района Северо-Казахстанской области от 12 апреля 2013 года № 02-07-01-20/44)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района в 2012 году
  kaz: 2012 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
