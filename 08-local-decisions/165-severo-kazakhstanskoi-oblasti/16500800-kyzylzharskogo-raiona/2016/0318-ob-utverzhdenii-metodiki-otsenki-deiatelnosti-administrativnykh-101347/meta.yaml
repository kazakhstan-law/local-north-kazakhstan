requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 18 марта 2016 года № 45/13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 апреля 2016 года № 3716. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 27 февраля 2017 года № 11/5
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудыңәдістемесін бекіту туралы
