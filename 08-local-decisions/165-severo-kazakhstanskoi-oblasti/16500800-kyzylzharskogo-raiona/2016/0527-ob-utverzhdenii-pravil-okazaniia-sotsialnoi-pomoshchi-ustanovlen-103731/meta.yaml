requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 27 мая 2016 года № 4/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 июня 2016 года № 3788. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 3 мая 2017 года № 13/1
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
