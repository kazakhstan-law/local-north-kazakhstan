requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 20 марта 2008 № 7/13. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской области 28 апреля 2008 года № 13-8-74. Утратило силу - решением маслихата Кызылжарского района Северо-Казахстанской области от 22 декабря 2011 года № 43/4
title:
  rus: О выплате социальной помощи для приобретения топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекенде тұрып және жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім, мәдениет және спорт мемлекеттік ұйым мамандарына отын алу үшін әлеуметтік көмек өтемақысын төлеу туралы
