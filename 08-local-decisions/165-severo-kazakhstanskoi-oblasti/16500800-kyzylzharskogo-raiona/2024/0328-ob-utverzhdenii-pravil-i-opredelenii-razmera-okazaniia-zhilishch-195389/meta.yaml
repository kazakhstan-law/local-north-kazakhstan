    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданында тұрғын үй көмегін көрсетудің мөлшері мен тәртібін айқындау туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2024 жылғы 28 наурыздағы № 10/6 шешіміне өзгерістер мен толықтыру енгізу туралы»
