act_code: '128776'
requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 25 января 2019 года № 37/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 января 2019 года № 5210
title:
  rus: О предоставлении подъемного пособия и социальной поддержки на приобретение или строительство жилья в 2019 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2019 жылы көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
