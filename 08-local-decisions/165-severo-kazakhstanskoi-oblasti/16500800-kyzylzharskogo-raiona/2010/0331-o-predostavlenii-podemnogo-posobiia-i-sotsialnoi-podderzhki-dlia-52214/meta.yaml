requisite: Решение маслихата Кызылжарского района Северо-Казахстанской области от 31 марта 2010 года № 23/8. Зарегистрировано Управлением юстиции Кызылжарского района Северо-Казахстанской 5 мая 2010 года № 13-8-126. Утратило силу - решением маслихата Кызылжарского района Северо-Казахстанской области от 28 марта 2011 года № 33/3
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района в 2010 году
  kaz: 2010 жылы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдауға және көтерме жәрдемақы ұсыну туралы
