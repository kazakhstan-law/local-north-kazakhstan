requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 27 февраля 2017 года № 11/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 марта 2017 года № 4091. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 19 марта 2018 года № 25/5
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области»
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
