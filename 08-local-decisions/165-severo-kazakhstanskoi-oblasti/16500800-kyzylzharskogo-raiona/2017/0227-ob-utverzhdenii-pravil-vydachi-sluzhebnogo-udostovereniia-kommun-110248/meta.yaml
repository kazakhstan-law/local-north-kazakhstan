requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 27 февраля 2017 года № 11/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 марта 2017 года № 4092. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 19 июня 2020 года № 54/13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат маслихата Кызылжарского района Северо-Казахстанской области» и его описания
