  title:
    rus: О внесении изменений в решение Кызылжарского районного маслихата Северо-Казахстанской области от 3 мая 2017 года № 13/1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Кызылжарского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2017 жылғы 3 мамырдағы № 13/1 «Солтүстік Қазақстан облысы Қызылжар ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
