act_code: '117481'
requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 22 декабря 2017 года № 22/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2018 года № 4464
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья в 2018 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2018 жылы тұрғын үй алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
