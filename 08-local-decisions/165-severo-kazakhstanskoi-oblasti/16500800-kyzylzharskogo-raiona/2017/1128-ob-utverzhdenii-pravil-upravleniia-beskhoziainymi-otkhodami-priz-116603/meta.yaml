requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 28 ноября 2017 года № 21/1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 декабря 2017 года № 4419. Утратил силу решением маслихата Кызылжарского района Северо-Казахстанской области от 17 августа 2021 года № 7/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Кызылжарского района Северо-Казахстанской области
