  title:
    rus: О внесении изменений в решение Кызылжарского районного маслихата Северо-Казахстанской области от 11 августа 2017 года № 17/4 «Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки сельских населенных пунктов Кызылжарского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданының ауылдық елді мекендерінің жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» Солтүстік Қазақстан облысы Қызылжар аудандық мәслихатының 2017 жылғы 11 тамыздағы № 17/4 шешіміне өзгерістер енгізу туралы
