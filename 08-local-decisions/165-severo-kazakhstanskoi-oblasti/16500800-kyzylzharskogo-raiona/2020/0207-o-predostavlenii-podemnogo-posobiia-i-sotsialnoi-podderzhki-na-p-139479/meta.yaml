act_code: '139479'
requisite: Решение Кызылжарского районного маслихата Северо-Казахстанской области от 7 февраля 2020 года № 50/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 февраля 2020 года № 5997. Утратило силу решением Кызылжарского районного маслихата Северо-Казахстанской области от 22 декабря 2020 года № 59/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кызылжарского района в 2020 году
  kaz: 2020 жылы Қызылжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
