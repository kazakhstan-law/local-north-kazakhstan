  title:
    rus: О внесении изменений и дополнения в решение Петропавловского городского маслихата от 16 октября 2020 года № 5 «О возмещении затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Петропавл қалалық мәслихатының 2020 жылғы 16 қазандағы № 5 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өтеу туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
