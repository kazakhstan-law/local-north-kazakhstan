    kaz: Петропавл қалалық мәслихатының 2020 жылғы 16 қазандағы № 5 «Петропавл қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалатын шығындарды өндіріп алу тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер енгізу туралы»
