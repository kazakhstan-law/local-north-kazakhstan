  title:
    rus: О внесении изменений и дополнений в решение Петропавловского городского маслихата от 27 декабря 2013 года № 6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Петропавл қалалық мәслихатының 2013 жылғы 27 желтоқсандағы № 6 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
