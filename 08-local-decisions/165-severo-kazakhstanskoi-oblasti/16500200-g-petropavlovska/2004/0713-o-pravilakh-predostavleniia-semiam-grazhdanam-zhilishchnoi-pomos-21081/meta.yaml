  title:
    rus: О внесении изменений и дополнений в решение внеочередной седьмой сессии Петропавловского городского маслихата от 14 июля 2004 года № 6 "О Правилах предоставления малообеспеченным гражданам жилищной помощи на содержание жилья и оплату коммунальных услуг"
    kaz: '"Аз қамтамасыз етілген азаматтарға пәтер үйді ұстауға және коммуналдық қызметтерді төлеуге тұрғын үй көмегін ұсыну ережелері туралы" Петропавл қалалық мәслихатының 2004 жылғы 14 шілдедегі кезектен тыс жетінші сессиясының № 6 шешіміне өзгерістер мен толықтырулар енгізу туралы'
