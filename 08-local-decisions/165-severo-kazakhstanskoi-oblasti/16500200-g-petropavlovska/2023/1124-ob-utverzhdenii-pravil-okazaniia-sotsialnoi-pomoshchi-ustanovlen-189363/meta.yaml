    kaz: «Әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және Петропавл қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Петропавл қалалық мәслихатының 2023 жылғы 24 қарашадағы № 2 шешіміне өзгерістер енгізу туралы
