requisite: Решение Северо-Казахстанского областного маслихата от 13 апреля 2018 года № 20/18. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 апреля 2018 года № 4689. Утратило силу решением Северо-Казахстанского областного маслихата от 21 июня 2019 года № 34/8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О ставках платы за лесные пользования на участках государственного лесного фонда и особо охраняемых природных территориях и норм сбора физическими лицами для собственных нужд лесных ресурсов на территории государственного лесного фонда Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының мемлекеттік орман қоры учаскелерінде және ерекше қорғалатын табиғи аумақтарында орман пайдалану үшін төлемақы мөлшерлемелерін және жеке тұлғалардың мемлекеттік орман қоры аумағында өз мұқтажы үшін орман ресурстарын жинау нормалары туралы
