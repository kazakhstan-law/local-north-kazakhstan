requisite: Решение Северо-Казахстанского областного маслихата от 13 декабря 2018 года № 27/4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 декабря 2018 года № 5103. Утратило силу решением Северо-Казахстанского областного маслихата от 17 февраля 2021 года № 2/2 (вводится в действие с 1 января 2021 года)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар салаларындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
