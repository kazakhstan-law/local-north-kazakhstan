requisite: Решение Акима Северо-Казахстанской области от 23 февраля 2007 года № 9. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 марта 2007 года № 1643. Утратило силу в связи с истечением срока действия (письмо аппарата акима Северо-Казахстанской области от 17 октября 2011 года № 01.04-08/2964)
title:
  rus: Об утверждении объемов субсидий на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, неоходимых для проведения весенне-полевых и уборочных работ, повышения урожайности и качества продукции растениеводства на 2007 год
  kaz: 2007 жылға арналған көктемгі егіс және егін жинау жұмыстарын жүргізуге, өсімдік шаруашылығы өнімінің түсімділігі мен сапасын арттыруға қажетті жанар-жағар май материалдары мен басқа да тауарлық-материалдық құндылықтардың құнын арзандатуға арналған субсидия көлемін бекіту туралы
