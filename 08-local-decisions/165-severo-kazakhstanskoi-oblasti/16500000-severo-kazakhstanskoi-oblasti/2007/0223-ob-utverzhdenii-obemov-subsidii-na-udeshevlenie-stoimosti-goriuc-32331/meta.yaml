  title:
    rus: О внесении изменения в решение акима области от 23 февраля 2007 года № 9 "Об утверждении объемов субсидий на удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, повышения урожайности и качества продукции растениеводства на 2007 год"
