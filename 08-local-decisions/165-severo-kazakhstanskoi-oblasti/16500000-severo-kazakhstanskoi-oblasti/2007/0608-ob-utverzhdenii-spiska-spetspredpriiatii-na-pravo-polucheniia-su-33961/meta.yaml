title:
  rus: Об утверждении списка спецпредприятий на право получения субсидий, квоты спецпредприятиям и объемов субсидий на планируемые объемы реализуемой продукции на 2007 год
  kaz: Арнайы кәсіпорындардың субсидиялар алу құқығына арналған тізімін, 2007 жылға арнайы кәсіпорындарға берілетін квоталар мен сатылатын өнімнің жоспарланып отырған көлеміне арналған субсидиялардың көлемін бекіту туралы
