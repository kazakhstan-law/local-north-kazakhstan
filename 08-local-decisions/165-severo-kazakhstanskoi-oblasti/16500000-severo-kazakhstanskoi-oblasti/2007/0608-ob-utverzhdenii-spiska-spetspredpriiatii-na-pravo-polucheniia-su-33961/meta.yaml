  title:
    rus: О внесении изменений в решение акима области от 8 июня 2007 года № 18 "Об утверждении списка спецпредприятий на право получения субсидий, квоты спецпредприятиям и объемов субсидий на планируемые объемы реализуемой продукции на 2007 год"
    kaz: '"2007 жылға арналған арнайы кәсіпорындардың субсидиялар алу құқығының тізімін, арнайы кәсіпорындарға берілетін квоталар мен сатылатын өнімнің жоспарланып отырған көлеміне арналған субсидиялардың көлемін бекіту туралы" облыс әкімінің 2007 жылғы 8 маусымдағы № 18 шешіміне өзгертулер енгізу туралы'
