title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес пайызға жоғары жалақылар мен тарифтік ставкалар белгілеу туралы
