act_code: '228323'
requisite: Решение Северо-Казахстанского областного маслихата от 28 июля 2026 года № 39/4
title:
  rus: Об утверждении ставок платы за пользование лесными и растительными ресурсами, норм сбора физическими лицами для собственных нужд дикорастущих плодов, грибов, ягод, лекарственного сырья и иных лесных и растительных ресурсов на территории Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының аумағында орман және өсімдік ресурстарын пайдаланғаны үшін төлемақы мөлшерлемелерін, жеке тұлғалардың өз мұқтаждары үшін жабайы өсетін жемістерді, саңырауқұлақтарды, жидектерді, дәрілік шикізатты және өзге де орман және өсімдік ресурстарын жинау нормаларын бекіту туралы
