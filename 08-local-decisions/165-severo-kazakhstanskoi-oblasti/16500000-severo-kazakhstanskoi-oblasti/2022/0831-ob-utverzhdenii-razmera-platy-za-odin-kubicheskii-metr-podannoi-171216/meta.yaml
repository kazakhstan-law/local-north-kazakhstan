  title:
    rus: О внесении изменения в решение Северо-Казахстанского областного маслихата от 31 августа 2022 года № 20/8 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облыстық мәслихатының 2022 жылғы 31 тамыздағы № 20/8 «Солтүстік Қазақстан облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
