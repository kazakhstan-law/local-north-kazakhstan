requisite: Решение Северо-Казахстанского областного маслихата от 31 августа 2022 года № 20/8. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 сентября 2022 года № 29410. Утратило силу решением Северо-Казахстанского областного маслихата от 23 июня 2026 года № 37/3 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
