title:
  rus: О региональной программе по борьбе с преступностью на 1998-2000 г.г. в свете Послания Президента страны народу Казахстана и исполнению законов «О национальной безопасности» и «О борьбе с коррупцией»
  kaz: Ел Президентінің Қазақстан халқына Жолдауына және «Ұлттық қауіпсіздік туралы» және «Коррупциямен күрес туралы» Заңдардың орындалуына сәйкес 1998 - 2000 ж.ж. қылмыспен күрес жөніндегі аймақтық бағдарлама туралы
