requisite: Решение акима Северо-Казахстанской области от 22 апреля 1999 года № 85. Зарегистрировано Управлением юстиции Северо-Казахстанской области 23 сентября 1999 года за № 94. Утратило силу - решением акима Северо-Казахстанской области от 9 марта 2004 года № 10
title:
  rus: О мерах по реализации распоряжения Президента Республики Казахстан от 1 февраля 1999 года № 5 и его поручений, данных в выступлении на совместном заседании Палат Парламента страны 31 марта 1999 года
  kaz: Қазақстан Республикасы Президентінің 1999 жылғы 1 ақпандағы № 5 өкімін және ел Парламенті Палаталарының 1999 жылғы 31 наурыздағы біріккен отырысында сөйлеген сөзінде берген оның тапсырмаларын іске асыру жөніндегі шаралар туралы
