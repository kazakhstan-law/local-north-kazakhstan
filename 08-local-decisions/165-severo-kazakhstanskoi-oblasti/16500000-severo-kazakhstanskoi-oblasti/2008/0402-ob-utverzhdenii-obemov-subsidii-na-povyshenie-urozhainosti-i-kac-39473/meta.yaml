act_code: '39473'
requisite: Решение акима Северо-Казахстанской области от 2 апреля 2008 года № 8. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2008 года № 1673. Утратило силу в связи с истечением срока действия (письмо аппарата акима Северо-Казахстанской области от 1 июля 2015 года № 1.14-7/1840)
title:
  rus: Об утверждении объемов субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2008 год
  kaz: Өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға, 2008 жылғы көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті жанар-жағармай материалдары мен басқа да тауар-материалдық құндылықтардың құнын арзандатуға субсидиялар көлемін бекіту туралы
