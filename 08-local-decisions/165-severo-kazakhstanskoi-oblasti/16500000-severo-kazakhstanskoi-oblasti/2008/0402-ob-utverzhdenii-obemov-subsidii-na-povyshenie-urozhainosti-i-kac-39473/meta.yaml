  title:
    rus: О внесении изменения в решение акима области от 2 апреля 2008 года № 8 "Об утверждении объемов субсидий на повышение урожайности и качества продукции растениеводства, удешевление стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ на 2008 год"
    kaz: '"Өсімдік шаруашылығы өнімінің шығымдылығы мен сапасын арттыруға, 2008 жылғы көктемгі егіс және егін жинау жұмыстарын жүргізу үшін қажетті жанар-жағармай материалдары мен басқа да тауар-материалдық құндылықтардың құнын арзандатуға субсидиялар көлемін бекіту туралы" облыс әкімінің 2008 жылғы 2 сәуірдегі № 8 шешіміне өзгеріс енгізу туралы'
