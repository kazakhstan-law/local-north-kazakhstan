act_code: '38837'
requisite: Решение маслихата Северо-Казахстанской области от 18 марта 2008 года № 5/10. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 апреля 2008 года № 1669. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Северо-Казахстанской области от 13 августа 2015 года № 2.1-11/280)
title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов, должностных окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры и спорта, работающим в аульной (сельской) местности
  kaz: Ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт мамандарына жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
