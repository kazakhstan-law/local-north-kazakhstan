act_code: '141225'
requisite: Решение Северо-Казахстанского областного маслихата от 31 марта 2020 года № 41/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 апреля 2020 года № 6153
title:
  rus: Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования в Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысында сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы
