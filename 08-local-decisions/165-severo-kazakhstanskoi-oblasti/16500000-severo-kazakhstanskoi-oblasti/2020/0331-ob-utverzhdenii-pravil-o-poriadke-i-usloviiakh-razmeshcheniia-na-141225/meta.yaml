  title:
    rus: О внесении изменения в решение Северо-Казахстанского областного маслихата от 31 марта 2020 года № 41/2  «Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования в Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облыстық мәслихатының 2020 жылғы 31 наурыздағы № 41/2 «Солтүстік Қазақстан облысында сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы» шешіміне өзгеріс енгізу туралы
