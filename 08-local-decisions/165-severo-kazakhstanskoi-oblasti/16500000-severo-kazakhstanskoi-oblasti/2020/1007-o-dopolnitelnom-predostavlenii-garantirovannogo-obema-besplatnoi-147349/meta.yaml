  title:
    rus: О внесении изменения в решение Северо-Казахстанского областного маслихата от 7 октября 2020 года № 48/13 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Северо-Казахстанской области при амбулаторном лечении бесплатно»
    kaz: «Солтүстік Қазақстан облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» Солтүстік Қазақстан облыстық мәслихатының 2020 жылғы 7 қазандағы № 48/13 шешіміне өзгеріс енгізу туралы»
