  requisite: Решение Северо-Казахстанского областного маслихата от 13 июня 2025 года № 26/4
  title:
    rus: О внесении изменения в решение Северо-Казахстанского областного маслихата от 7 октября 2020 года № 48/13 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Северо-Казахстанской области при амбулаторном лечении бесплатно»
    kaz: «Солтүстік Қазақстан облысы Қызылжар ауданының аумағында барлық кандидаттардың үгіттік баспа материалдарын орналастыру үшін орындар белгілеу және сайлаушылармен кездесуі үшін үй-жайлар беру туралы» Солтүстік Қазақстан облысы Қызылжар ауданы әкімдігінің 2019 жылғы 6 мамырдағы № 127 қаулысына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211385/rus
