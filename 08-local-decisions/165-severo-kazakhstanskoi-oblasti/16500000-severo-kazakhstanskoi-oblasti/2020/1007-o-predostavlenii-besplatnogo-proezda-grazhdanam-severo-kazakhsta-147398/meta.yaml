requisite: Решение Северо-Казахстанского областного маслихата от 7 октября 2020 года № 48/14. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 октября 2020 года № 6587
title:
  rus: О предоставлении бесплатного проезда гражданам Северо-Казахстанской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Солтүстік Қазақстан облысының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
