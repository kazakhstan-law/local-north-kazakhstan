  title:
    rus: О внесении изменений в решение Северо-Казахстанского областного маслихата от 7 октября 2020 года № 48/15 «Об определении системы мер, порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность и поселок, город районного и областного значения Северо-Казахстанской области за счет бюджетных средств»
    kaz: Солтүстік Қазақстан облыстық мәслихатының 2020 жылғы 7 қазандағы № 48/15 «Солтүстік Қазақстан облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне бюджет қаражаты есебінен әлеуметтік қолдау шараларының жүйесін, тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
