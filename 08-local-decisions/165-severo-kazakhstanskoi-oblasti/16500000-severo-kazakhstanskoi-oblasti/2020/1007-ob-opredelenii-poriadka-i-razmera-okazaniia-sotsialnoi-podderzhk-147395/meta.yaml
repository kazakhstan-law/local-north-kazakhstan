title:
  rus: Об определении порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность и поселки, города районного и областного значения Северо-Казахстанской области за счет бюджетных средств
  kaz: Солтүстік Қазақстан облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы
