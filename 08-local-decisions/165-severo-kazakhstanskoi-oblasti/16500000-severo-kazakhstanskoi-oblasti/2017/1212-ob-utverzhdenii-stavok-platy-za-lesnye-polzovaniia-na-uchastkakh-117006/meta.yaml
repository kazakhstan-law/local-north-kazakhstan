requisite: Решение Северо-Казахстанского областного маслихата от 12 декабря 2017 года № 17/5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 декабря 2017 года № 4447. Утратило силу решением Северо-Казахстанского областного маслихата от 13 апреля 2018 года № 20/18
title:
  rus: Об утверждении ставок платы за лесные пользования на участках государственного лесного фонда и особо охраняемых природных территориях и норм сбора физическими лицами для собственных нужд лесных ресурсов на территории государственного лесного фонда Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының мемлекеттік орман қоры учаскелерінде және ерекше қорғалатын табиғи аумақтарында орман пайдалану үшін төлемақы мөлшерлемелерін және жеке тұлғалардың мемлекеттік орман қоры аумағында өз мұқтажы үшін орман ресурстарын жинау нормаларын бекіту туралы
