requisite: Решение акима Акжарского района Северо-Казахстанской области от 1 декабря 2011 года № 17. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 декабря 2011 года № 13-4-133. Утратило силу в связи с истечением срока действия (письмо аппарата акима Акжарского района Северо-Казахстанской области от 12 сентября 2012 года № 02.02-02/459)
title:
  rus: Об организации и обеспечении на территории Акжарского района приписки граждан мужского пола Республики Казахстан 1995 года рождения к призывному участку с января по март 2012 года
  kaz: 1995 жылы туған Ақжар ауданы аумағындағы Қазақстан Республикасының ер азаматтарының 2012 жылғы қаңтардан наурызға дейін әскерге шақыру учаскесінде тіркелуін ұйымдастыру және қамтамасыз ету туралы
