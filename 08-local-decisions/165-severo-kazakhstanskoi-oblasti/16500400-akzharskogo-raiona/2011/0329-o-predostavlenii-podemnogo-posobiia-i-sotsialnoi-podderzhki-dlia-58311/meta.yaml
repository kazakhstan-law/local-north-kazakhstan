title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения  жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Акжарского района на 2011 год
  kaz: 2011 жылы Ақжар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыздандыру, мәдениет және спорт мамандарына көтерме жәрдемағы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
