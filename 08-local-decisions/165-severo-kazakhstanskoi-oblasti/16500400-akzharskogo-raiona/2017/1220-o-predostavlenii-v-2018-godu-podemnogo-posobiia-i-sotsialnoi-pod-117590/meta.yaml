act_code: '117590'
requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 20 декабря 2017 года № 22-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2018 года № 4468
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін 2018 жылы көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
