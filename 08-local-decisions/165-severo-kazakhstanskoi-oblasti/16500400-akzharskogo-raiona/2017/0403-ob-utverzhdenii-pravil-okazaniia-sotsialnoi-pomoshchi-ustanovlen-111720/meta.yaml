  title:
    rus: О внесении изменения и дополнения в решение Акжарского районного маслихата Северо-Казахстанской области от 3 апреля 2017 года № 13-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Акжарском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2017 жылғы 3 сәуірдегі № 13-3 «Солтүстік Қазақстан облысының Ақжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
