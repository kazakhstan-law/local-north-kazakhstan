requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 3 апреля 2017 года № 13-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 мая 2017 года № 4170. Утратило силу решением Акжарского районного маслихата Северо-Казахстанской области от 7 ноября 2023 года № 11-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Акжарском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының Ақжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
