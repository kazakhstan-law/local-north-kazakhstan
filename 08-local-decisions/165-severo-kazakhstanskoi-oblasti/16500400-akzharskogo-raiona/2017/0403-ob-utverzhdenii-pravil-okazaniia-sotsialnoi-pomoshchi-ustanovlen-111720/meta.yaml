  title:
    rus: О внесении изменений в решение Акжарского районного маслихата Северо-Казахстанской области от 03 апреля 2017 года № 13-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Акжарском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2017 жылғы 03 сәуірдегі № 13-3 «Солтүстік Қазақстан облысы Ақжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
