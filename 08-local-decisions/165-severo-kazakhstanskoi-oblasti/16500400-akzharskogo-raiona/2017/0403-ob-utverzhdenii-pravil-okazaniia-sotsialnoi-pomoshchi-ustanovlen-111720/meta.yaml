  title:
    rus: О внесении изменения в решение Акжарского районного маслихата Северо-Казахстанской области от 3 апреля 2017 года № 13-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Акжарском районе Северо-Казахстанской области»
