  title:
    rus: О внесении изменения в решение Акжарского районного маслихата Северо-Казахстанской области от 28 февраля 2024 года № 16-5 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Акжарскому району Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ақжар ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін жинауға, тасымалдауға, қатты тұрмыстық қалдықтарды сұрыптау және көмуге арналған тарифтерді бекіту туралы» Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2024 жылғы 28 ақпандағы № 16-5 шешіміне өзгеріс еңгізу туралы
