title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Акжарскому району Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін жинауға, тасымалдауға, қатты тұрмыстық қалдықтарды сұрыптау және көмуге арналған тарифтерді бекіту туралы
