title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы для участия в сходе местного сообщества в Акжарском районе Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
