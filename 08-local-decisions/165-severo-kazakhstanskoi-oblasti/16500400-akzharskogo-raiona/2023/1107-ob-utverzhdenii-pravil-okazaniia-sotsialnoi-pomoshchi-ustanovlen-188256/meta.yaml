  title:
    rus: О внесении изменения в решение Акжарского районного маслихата Северо-Казахстанской области от 7 ноября 2023 года № 11-4 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категории нуждающихся граждан в Акжарском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысының Ақжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2023 жылғы 7 қарашадағы № 11-4 шешіміне өзгеріс еңгізу туралы
