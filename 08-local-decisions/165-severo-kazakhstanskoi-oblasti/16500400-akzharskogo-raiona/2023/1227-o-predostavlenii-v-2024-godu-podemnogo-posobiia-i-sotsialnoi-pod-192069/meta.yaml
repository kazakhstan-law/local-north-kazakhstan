act_code: '192069'
requisite: Решение маслихата Акжарского района Северо-Казахстанской области от 27 декабря 2023 года № 13-7
title:
  rus: О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, за исключением лиц, занимающих руководящие должности прибывшим для работы и проживания в сельские населенные пункты Акжарского района
  kaz: 2024 жылы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, басшышылық лауазымдарын атқаратын адамдарды қоспағанда, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
