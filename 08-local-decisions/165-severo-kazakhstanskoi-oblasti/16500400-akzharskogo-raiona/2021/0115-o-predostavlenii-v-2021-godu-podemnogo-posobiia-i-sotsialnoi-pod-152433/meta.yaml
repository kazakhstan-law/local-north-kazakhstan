act_code: '152433'
requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 15 января 2021 года № 1-7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 января 2021 года № 7096
title:
  rus: О предоставлении в 2021 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Акжарского района
  kaz: 2021 жылы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
