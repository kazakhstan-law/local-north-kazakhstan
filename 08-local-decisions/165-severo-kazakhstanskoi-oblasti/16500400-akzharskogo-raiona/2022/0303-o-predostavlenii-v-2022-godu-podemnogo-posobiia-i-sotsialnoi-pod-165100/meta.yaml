act_code: '165100'
requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 15-2
title:
  rus: О предоставлении в 2022 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим, за исключением лиц, занимающих руководящие должности, аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Акжарского района
  kaz: 2022 жылы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, басшышылық лауазымдарын атқаратын адамдарды қоспағанда, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
