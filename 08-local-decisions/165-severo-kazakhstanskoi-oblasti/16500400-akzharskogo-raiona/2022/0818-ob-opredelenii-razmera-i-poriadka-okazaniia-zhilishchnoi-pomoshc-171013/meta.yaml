  title:
    rus: О внесении изменений в решение Акжарского районного маслихата Северо-Казахстанской области от 18 августа 2022 года № 22-1 «Об определении размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в Акжарском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2022 жылғы 18 тамызындағы № 22-1 «Солтүстік Қазақстан облысы Ақжар ауданында аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудың мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
