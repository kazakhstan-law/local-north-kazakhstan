  title:
    rus: О внесении изменения в решение Акжарского районного маслихата Северо-Казахстанской области от 27 декабря 2022 года № 28-2 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим, за исключением лиц, занимающих руководящие должности, аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Акжарского района»
    kaz: Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2022 жылғы 27 желтоқсандағы № 28-2 «2023 жылы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, басшылық лауазымдарды атқаратын адамдарды қоспағанда, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы беру туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/185434/rus
