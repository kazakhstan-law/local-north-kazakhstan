requisite: Решение маслихата Акжарского района Северо-Казахстанской области от 5 августа 2010 года № 25-3. Зарегистрировано Управлением юстиции Акжарского района Северо-Казахстанской области 31 августа 2010 года № 13-4-109. Утратило силу - решением маслихата Акжарского района Северо-Казахстанской области от 29 марта 2011 года № 30-2
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Акжарского района в 2010 году
  kaz: 2010 жылда Ақжар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамтамасыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы беру туралы
