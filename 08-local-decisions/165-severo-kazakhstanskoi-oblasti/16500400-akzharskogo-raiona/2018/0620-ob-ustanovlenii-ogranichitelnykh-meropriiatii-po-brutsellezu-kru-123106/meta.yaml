requisite: Решение акима Айсаринского сельского округа Акжарского района Северо-Казахстанской области от 20 июня 2018 года № 03. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 июня 2018 года № 4789. Утратило силу решением акима Айсаринского сельского округа  Акжарского района Северо-Казахстанской области от 26 февраля 2019 года № 02 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий по бруцеллезу крупного рогатого скота находящегося на территории села Айсара Айсаринского сельского округа Акжарского района Северо-Казахстанской области
