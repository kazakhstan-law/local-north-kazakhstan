requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 7 марта 2018 года № 25-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 марта 2018 года № 4616. Утратило силу решением Акжарского районного маслихата Северо-Казахстанской области от 3 марта 2022 года № 15-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат Акжарского районного маслихата Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы
