act_code: '98582'
requisite: 'Решение маслихата Акжарского района Северо-Казахстанской области от 13 января 2016 года № 40-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 2 февраля 2016 года № 3597 '
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін 2016 жылы көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
