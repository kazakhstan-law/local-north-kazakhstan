  title:
    rus: О внесении изменений в решение Акжарского районного маслихата Северо-Казахстанской области от 17 марта 2016 года № 43-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Акжарском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысының Ақжар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Ақжар аудандық мәслихатының 2016 жылғы 17 наурыздағы № 43-2 шешіміне өзгертулер енгізу туралы
