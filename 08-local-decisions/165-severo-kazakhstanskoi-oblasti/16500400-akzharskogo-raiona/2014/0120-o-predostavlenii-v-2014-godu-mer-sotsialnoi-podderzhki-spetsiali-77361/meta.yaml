  title:
    rus: О внесении изменений в решение Акжарского районного маслихата Северо-Казахстанской области от 20 января 2014 года № 19-1 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Акжарского района Северо-Казахстанской области"
    kaz: '"Солтүстік Қазақстан облысының Ақжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулықты сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылға әлеуметтік шараларын ұсыну туралы" Солтүстік Қазақстан облысының Ақжар аудандық мәслихатының 2014 жылғы 20 қаңтардағы № 19-1 шешіміне өзгертулер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/79632/rus
