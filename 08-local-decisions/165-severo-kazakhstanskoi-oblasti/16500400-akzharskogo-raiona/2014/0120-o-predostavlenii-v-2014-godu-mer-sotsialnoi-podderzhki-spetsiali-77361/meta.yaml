act_code: '77361'
requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 20 января 2014 года № 19-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 февраля 2014 года № 2545
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысының Ақжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулықты сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік шараларын ұсыну туралы
