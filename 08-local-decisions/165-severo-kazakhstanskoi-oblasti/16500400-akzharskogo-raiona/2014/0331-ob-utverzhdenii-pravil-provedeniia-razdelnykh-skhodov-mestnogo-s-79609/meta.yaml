requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 31 марта 2014 года № 22-10. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 мая 2014 года № 2715. Утратил силу решением Акжарского районного маслихата Северо-Казахстанской области от 28 января 2022 года № 14-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов сел для участия в сходе местного сообщества Ленинградского сельского округа Акжарского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ақжар ауданының Ленинград ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл көшелер және көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
