requisite: Решение Акжарского районного маслихата Северо-Казахстанской области от 31 марта 2014 года № 22-6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 мая 2014 года № 2710. Утратил силу решением Акжарского районного маслихата Северо-Казахстанской области от 28 января 2022 года № 14-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Восходского сельского округа Акжарского района Северо-Казахстанской области
