act_code: '66595'
requisite: Решение маслихата Акжарского района Северо-Казахстанской области от 14 июня 2012 года № 4-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 июля 2012 года № 13-4-144
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Акжарского района
  kaz: Ақжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсалықты сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға әлеуметтік шараларын ұсыну туралы
