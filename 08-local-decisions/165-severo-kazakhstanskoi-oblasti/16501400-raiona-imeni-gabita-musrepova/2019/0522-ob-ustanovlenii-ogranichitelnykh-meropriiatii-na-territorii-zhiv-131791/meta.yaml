requisite: Решение акима Ломоносовского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 22 мая 2019 года № 15. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 мая 2019 года № 5412. Утратило силу решением акима Ломоносовского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 10 октября 2019 года № 31 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ограничительных мероприятий на территории животноводческой фермы товарищества с ограниченной ответственностью «Кужен» села Урожайное Ломоносовского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Ломоносов ауылдық округі Урожайный ауылының «Кужен» жауапкершiлiгi шектеулi серiктестiгінің мал шаруашылығы фермасының аумағында шектеу іс-шараларын белгілеу туралы
