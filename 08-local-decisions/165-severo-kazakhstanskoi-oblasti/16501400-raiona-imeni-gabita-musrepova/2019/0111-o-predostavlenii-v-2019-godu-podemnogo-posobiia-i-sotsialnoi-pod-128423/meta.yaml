act_code: '128423'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 11 января 2019 года № 40-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 января 2019 года № 5202
title:
  rus: О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова
  kaz: 2019 жылы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру,әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
