act_code: '137598'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 26 декабря 2019 года № 55-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 декабря 2019 года № 5764
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова
  kaz: 2020 жылы Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
