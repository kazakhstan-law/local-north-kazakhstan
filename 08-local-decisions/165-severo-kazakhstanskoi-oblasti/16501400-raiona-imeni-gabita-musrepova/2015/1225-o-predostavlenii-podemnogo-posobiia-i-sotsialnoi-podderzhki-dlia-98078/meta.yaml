act_code: '98078'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 25 декабря 2015 года № 40-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 января 2016 года № 3585
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова на 2016 год
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2016 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен салаларының мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
