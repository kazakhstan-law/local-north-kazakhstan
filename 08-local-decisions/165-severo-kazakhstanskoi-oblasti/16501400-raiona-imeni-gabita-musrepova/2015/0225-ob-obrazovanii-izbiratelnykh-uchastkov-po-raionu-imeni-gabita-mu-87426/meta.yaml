    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша сайлау учаскелерін құру туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімінің 2015 жылғы 25 ақпандағы № 5 шешіміне өзгеріс енгізу туралы
