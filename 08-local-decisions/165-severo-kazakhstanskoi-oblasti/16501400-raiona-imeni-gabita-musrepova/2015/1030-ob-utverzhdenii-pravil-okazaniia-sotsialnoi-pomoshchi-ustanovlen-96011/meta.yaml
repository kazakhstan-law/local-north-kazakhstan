  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 30 октября 2015 года № 38-7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова»
    kaz: «Ғабит Мүсірепов атындағы ауданның әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Ғабит Мүсірепов атындағы аудан мәслихатының 2015 жылғы 30 қазандағы № 38-7 шешіміне өзгерістер енгізу туралы
