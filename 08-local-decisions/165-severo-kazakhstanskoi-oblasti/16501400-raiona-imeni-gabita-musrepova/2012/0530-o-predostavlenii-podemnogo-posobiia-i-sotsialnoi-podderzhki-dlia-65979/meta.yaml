act_code: '65979'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 30 мая 2012 года № 4-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 12 июня 2012 года № 13-5-149. Утратило силу - решением маслихата района Габита Мусрепова Северо-Казахстанской области от 20 декабря 2012 года № 10-7
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова в 2012 году
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2012 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
