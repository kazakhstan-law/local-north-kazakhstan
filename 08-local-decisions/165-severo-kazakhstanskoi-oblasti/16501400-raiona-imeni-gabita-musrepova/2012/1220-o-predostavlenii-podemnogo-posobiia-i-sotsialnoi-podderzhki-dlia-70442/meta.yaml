act_code: '70442'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 20 декабря 2012 года № 10-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 января 2013 года № 2097. Утратило силу (письмо маслихата района имени Габита Мусрепова Северо-Казахстанской области от 5 июня 2014 года № 6.2.1-37/102)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района Габита Мусрепова в 2013 году
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2013 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария салаларының мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
