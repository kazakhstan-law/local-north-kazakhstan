act_code: '58372'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 28 марта 2011 года № 24-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 апреля 2011 года № 13-5-126. Утратило силу - решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 21 декабря 2011 года № 32-8
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова в 2011 году
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2011 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
