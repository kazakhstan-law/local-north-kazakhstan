  title:
    rus: О внесении изменения в решение районного маслихата № 24-3 от 28 марта 2011 года "О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова в 2011 году"
    kaz: Аудандық мәслихаттың 2011 жылғы 28 наурыздағы № 24-3 "Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2011 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы" шешіміне өзгерту енгізу туралы
