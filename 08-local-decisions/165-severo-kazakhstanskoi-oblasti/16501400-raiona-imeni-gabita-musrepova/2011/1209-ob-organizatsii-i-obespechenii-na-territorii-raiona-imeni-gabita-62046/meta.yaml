act_code: '62046'
requisite: Решение акима района имени Габита Мусрепова Северо-Казахстанской области от 9 декабря 2011 года № 33. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 декабря 2011 года № 13-5-138. Утратило силу в связи с истечением срока действия (письмо аппарата акима района имени Габита Мусрепова Северо-Казахстанской области от 13 сентября 2012 года № 02.09.01-05/986)
title:
  rus: Об организации и обеспечении на территории района имени Габита Мусрепова приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Ғабит Мүсірепов атындағы аудан аумағында Қазақстан Республикасының тіркеу жылы он жеті жасқа толатын жынысы ер азаматтарды, сондай-ақ жасы үлкен тіркеуді өтпеген жынысы ер ересек азаматтарды әскерге шақыру учаскесіне тіркеу жүргізуді ұйымдастыру және қамтамасыз ету туралы
