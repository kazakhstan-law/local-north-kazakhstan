  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова от 30 апреля 2026 года № 40-1 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2026 жылғы 30 сәуірдегі № 40-1 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
