requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 21 апреля 2016 года № 2-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 мая 2016 года № 3747. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 3 августа 2020 года № 64-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном регламентировании порядка проведения собраний, митингов,шествий, пикетов и демонстраций по району имени Габита Мусрепова Северо-Казахстанской области
