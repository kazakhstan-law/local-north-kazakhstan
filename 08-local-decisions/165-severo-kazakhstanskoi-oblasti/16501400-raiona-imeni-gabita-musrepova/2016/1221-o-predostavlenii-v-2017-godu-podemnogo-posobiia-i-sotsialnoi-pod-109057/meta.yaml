act_code: '109057'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 21 декабря 2016 года № 8-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 января 2017 года № 4013
title:
  rus: О предоставлении в 2017 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен салаласындағы мамандарға тұрғын үй сатып алу немесе салу үшін 2017 жылы көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
