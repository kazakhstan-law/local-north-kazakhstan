act_code: '204163'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 12 декабря 2024 года № 23-4
title:
  rus: О предоставлении в 2025 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова Северо-Казахстанской области
  kaz: 2025 жылы Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
