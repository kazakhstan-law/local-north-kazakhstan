act_code: '195950'
requisite: Решение акима Ломоносовского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 17 апреля 2024 года № 12
title:
  rus: О предоставлении права ограниченного целевого пользования (публичный сервитут) сроком на 49 лет на земельный участок коммунальному государственному  учреждению  «Отдел архитектуры, строительства, жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог акимата района имени Габита Мусрепова Северо-Казахстанской области»
  kaz: Шектелген мақсатты пайдалану құқығын беру туралы «Солтүстік Қазақстан облысы Ғабит Мүсірепов ауданы әкімдігінің сәулет, құрылыс, тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі» коммуналдық мемлекеттік мекемесіне жер учаскесіне 49 жыл мерзімге (жария сервитут)
