requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 22 мая 2024 года № 18-20
title:
  rus: Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по району имени Габита Мусрепова Северо-Казахстанской области на 2024 год
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша 2024 жылға кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін бекіту туралы
