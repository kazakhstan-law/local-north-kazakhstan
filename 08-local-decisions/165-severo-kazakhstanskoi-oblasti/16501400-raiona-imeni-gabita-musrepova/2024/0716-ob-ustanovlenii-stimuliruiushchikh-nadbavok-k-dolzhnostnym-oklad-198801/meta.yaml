  title:
    rus: О внесении изменения и дополнения в решение маслихата района имени Габита Мусрепова от 16 июля 2024 года № 19-1 «Об установлении стимулирующих надбавок к должностным окладам работников организаций, финансируемых из местного бюджета»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2024 жылғы 16 шілдедегі № 19-1 «Жергілікті бюджеттен қаржыландырылатын ұйымдар жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
