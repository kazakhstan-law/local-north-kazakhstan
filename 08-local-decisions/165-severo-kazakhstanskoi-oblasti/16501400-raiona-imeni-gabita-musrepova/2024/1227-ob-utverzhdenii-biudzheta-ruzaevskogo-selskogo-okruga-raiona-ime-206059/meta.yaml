    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2024 жылғы 27 желтоқсандағы № 25-11 «2025-2027 жылдарға арналған Ғабит Мүсірепов атындағы ауданы Рузаев ауылдық округінің бюджетін бекіту туралы» шешіміне өзгерістер енгізу туралы
