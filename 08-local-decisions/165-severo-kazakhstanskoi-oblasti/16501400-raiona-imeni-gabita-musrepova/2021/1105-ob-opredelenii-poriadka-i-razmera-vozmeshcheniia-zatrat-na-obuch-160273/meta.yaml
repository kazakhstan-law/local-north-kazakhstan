  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова от 5 ноября 2021 года № 11-9 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа  детей с инвалидностью по индивидуальному учебному плану в районе имени Габита Мусрепова»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2021 жылғы 5 қарашадағы № 11-9 «Ғабит Мүсірепов атындағы ауданда мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін  айқындау туралы» шешіміне өзгеріс енгізу туралы
