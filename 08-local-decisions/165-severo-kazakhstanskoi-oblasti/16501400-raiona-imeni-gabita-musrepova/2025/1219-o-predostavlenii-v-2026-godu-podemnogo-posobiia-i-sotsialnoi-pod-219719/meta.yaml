  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 19 декабря 2025 года № 35-2 «О предоставлении в 2026 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2025 жылғы 19 желтоқсандағы № 35-2 «2026 жылы Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/231024/rus
