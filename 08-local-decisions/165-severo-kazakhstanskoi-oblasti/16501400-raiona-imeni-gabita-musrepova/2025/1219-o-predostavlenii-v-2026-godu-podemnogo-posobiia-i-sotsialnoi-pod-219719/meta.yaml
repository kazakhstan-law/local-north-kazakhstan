act_code: '219719'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 19 декабря 2025 года № 35-2
title:
  rus: О предоставлении в 2026 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, архивного дела, культуры, спорта, в сфере цифровых технологий, агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим или вернувшимся с обучения для работы и проживания в сельские населенные пункты района имени Габита Мусрепова Северо-Казахстанской области
  kaz: 2026 жылы Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген немесе оқудан оралған денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, архив ісі, мәдениет, спорт, цифрлық технологиялар, агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
