  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 24 декабря 2025 года № 36-6 «Об утверждении бюджета Кырымбетского сельского округа района имени Габита Мусрепова на 2026-2028 годы»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2025 жылғы 24 желтоқсандағы № 36-6 «2026-2028 жылдарға арналған Ғабит Мүсірепов атындағы ауданы Қырымбет ауылдық округінің бюджетін бекіту туралы» шешіміне өзгерістер енгізу туралы
