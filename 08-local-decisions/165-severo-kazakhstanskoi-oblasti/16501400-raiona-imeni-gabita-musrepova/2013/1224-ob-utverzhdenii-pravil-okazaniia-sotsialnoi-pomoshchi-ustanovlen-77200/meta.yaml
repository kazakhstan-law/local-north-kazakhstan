  requisite: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудандық мәслихатының 2014 жылғы 25 желтоқсандағы № 32-4 шешімі. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 января 2015 года № 3089. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 30 октября 2015 года № 38-7
  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 24 декабря 2013 года № 22-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова
    kaz: «Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Ғабит Мүсірепов атындағы аудан мәслихатының 2013 жылғы 24  желтоқсандағы № 22-5 шешіміне өзгерістер енгізу туралы
