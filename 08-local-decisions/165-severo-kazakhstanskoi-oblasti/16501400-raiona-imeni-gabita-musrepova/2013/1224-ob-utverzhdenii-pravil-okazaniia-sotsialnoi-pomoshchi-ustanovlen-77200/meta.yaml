  title:
    rus: О внесении изменений и дополнения в решение маслихата района имени Габита Мусрепова от 24 декабря  2013 года № 22-5 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова"
    kaz: '"Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" Ғабит Мүсірепов атындағы ауданы мәслихатының 2013 жылғы 24 желтоқсандағы № 22-5 шешіміне өзгерістер  мен толықтыру енгізу туралы'
