act_code: '77035'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 24 декабря 2013 года № 22-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 января 2014 года № 2509. Утратило силу в связи с истечением срока действия (письмо маслихата района имени Габита Мусрепова Северо-Казахстанской области от 10 марта 2015 года № 6.2.1-22/37)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова на 2014 год
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2014 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  салаларының мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
