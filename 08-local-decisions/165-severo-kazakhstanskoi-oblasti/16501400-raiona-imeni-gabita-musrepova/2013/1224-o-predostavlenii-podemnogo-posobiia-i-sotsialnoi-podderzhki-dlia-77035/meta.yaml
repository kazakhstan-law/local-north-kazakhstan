  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 24 декабря 2013 года № 22-2 "О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова на 2014 год"
    kaz: Ғабит Мүсірепов атындағы аудан мәслихатының 2013 жылғы 24 желтоқсандағы № 22-2 "Ғабит  Мүсірепов атындағы ауданның, ауылдық елді мекендеріне 2014 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру,  әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария салаларының  мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және  көтерме жәрдемақы ұсыну туралы" шешіміне өзгерістер енгізу туралы
