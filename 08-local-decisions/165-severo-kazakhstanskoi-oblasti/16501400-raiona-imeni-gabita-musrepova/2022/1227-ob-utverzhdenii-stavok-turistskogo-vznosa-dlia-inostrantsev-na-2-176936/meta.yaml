requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 27 декабря 2022 года № 24-4. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 января 2023 года № 31578. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 14 ноября 2023 года № 10-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
