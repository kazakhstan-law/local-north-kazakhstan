title:
  rus: Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по району имени Габита Мусрепова Северо-Казахстанской области на 2022 год
  kaz: 2022 жылға арналған Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін бекіту туралы
