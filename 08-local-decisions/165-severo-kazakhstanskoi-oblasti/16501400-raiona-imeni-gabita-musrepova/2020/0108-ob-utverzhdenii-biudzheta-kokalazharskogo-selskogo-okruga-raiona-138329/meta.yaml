  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 8 января 2020 года № 56-5 «Об утверждении бюджета Кокалажарского сельского округа района имени Габита Мусрепова на 2020-2022 годы»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2020 жылғы 8 қаңтардағы № 56-5 «2020-2022 жылдарға арналған Ғабит Мүсірепов атындағы ауданы Көкалажар ауылдық округінің бюджетін бекіту туралы» шешіміне өзгерістер енгізу туралы
