  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 8 января 2020 года № 56-6 «Об утверждении бюджета Кырымбетского сельского округа района имени Габита Мусрепова на 2020-2022 годы»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2020 жылғы 8 қаңтардағы № 56-6 «2020-2022 жылдарға арналған Ғабит Мүсірепов атындағы ауданы Қырымбет ауылдық округінің бюджетін бекіту туралы» шешіміне өзгерістер енгізу туралы
