act_code: '150542'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 22 декабря 2020 года № 71-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 декабря 2020 года № 6857
title:
  rus: О предоставлении в 2021 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова
  kaz: 2021 жылы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік амсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
