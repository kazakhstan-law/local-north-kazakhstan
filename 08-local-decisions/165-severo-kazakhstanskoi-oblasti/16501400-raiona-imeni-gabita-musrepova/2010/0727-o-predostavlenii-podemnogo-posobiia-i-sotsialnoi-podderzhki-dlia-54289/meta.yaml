requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 27 июля 2010 года № 19-4. Зарегистрировано Управлением юстиции района имени Габита Мусрепова Северо-Казахстанской области 2 сентября 2010 года № 13-5-117. Утратило силу - решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 20 декабря 2010 года № 22-8
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим в сельские населенные пункты района имени Габита Мусрепова в 2010 году
  kaz: 2010 жылғы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
