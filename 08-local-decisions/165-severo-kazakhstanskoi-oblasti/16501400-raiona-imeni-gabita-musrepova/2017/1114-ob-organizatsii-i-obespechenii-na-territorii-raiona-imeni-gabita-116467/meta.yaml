  title:
    rus: О внесении изменений в решение акима района имени Габита Мусрепова Северо-Казахстанской области от 14 ноября 2017 года № 21 «Об организации и обеспечении на территории района имени Габита Мусрепова Северо-Казахстанской области приписки и медицинского освидетельствования граждан мужского пола Республики Казахстан с января по март 2018 года»
    kaz: «2018 жылғы қаңтар-наурыз аралығында Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының аумағында Қазақстан Республикасының жынысы ер азаматтарын әскерге шақыруды және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы» Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан әкімінің 2017 жылғы 14 қарашадағы № 21 шешіміне өзгерістер енгізу туралы
