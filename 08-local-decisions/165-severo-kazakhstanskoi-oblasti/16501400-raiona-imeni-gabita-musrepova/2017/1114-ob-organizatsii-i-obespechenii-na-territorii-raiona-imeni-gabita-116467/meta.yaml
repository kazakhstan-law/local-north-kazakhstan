  kaz: 2018 жылғы қаңтар-наурыз аралығында Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының аумағында Қазақстан Республикасының жынысы ер азаматтарын тіркеуді және медициналық куәландыруды ұйымдастыру және қамтамасыз ету туралы
