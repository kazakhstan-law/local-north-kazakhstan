requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 3 марта 2017 года № 10-8. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 апреля 2017 года № 4130. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 28 мая 2020 года № 61-11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат маслихата района имени Габита Мусрепова Северо-Казахстанской области» и его описания
  kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан мәслихаты аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы
