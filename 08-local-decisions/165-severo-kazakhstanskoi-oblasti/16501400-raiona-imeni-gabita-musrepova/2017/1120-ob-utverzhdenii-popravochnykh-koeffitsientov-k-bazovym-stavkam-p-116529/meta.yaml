  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 20 ноября 2017 года № 15-4 «Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки сельских населенных пунктов района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2017 жылғы 20 қарашадағы № 15-4 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендерінің жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
