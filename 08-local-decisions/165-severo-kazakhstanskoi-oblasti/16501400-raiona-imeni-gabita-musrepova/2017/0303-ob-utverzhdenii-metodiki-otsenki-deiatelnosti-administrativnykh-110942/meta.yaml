requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 3 марта 2017 года № 10-9. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 апреля 2017 года № 4131. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 12 марта 2018 года № 20-1
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района имени Габита Мусрепова Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы аудан мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
