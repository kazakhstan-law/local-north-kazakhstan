requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 3 марта 2017 года № 10-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 марта 2017 года № 4121. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 13 октября 2023 года № 9-1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
