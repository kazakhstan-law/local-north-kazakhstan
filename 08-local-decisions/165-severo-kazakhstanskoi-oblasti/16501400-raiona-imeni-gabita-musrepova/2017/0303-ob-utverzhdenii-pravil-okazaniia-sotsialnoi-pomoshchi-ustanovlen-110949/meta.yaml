  title:
    rus: О внесении изменений и дополнений в решение маслихата района имени Габита Мусрепова от 3 марта 2017 года № 10-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе имени Габита Мусрепова Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Ғабит Мүсірепов атындағы ауданда мәслихатының 2017 жылғы 3 наурыздағы № 10-3 шешіміне өзгерістер мен толықтырулар енгізу туралы
