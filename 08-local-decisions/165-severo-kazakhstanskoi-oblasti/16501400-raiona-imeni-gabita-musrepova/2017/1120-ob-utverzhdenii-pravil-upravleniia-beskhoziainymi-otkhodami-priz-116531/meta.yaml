act_code: '116531'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 20 ноября 2017 года № 15-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 декабря 2017 года № 4409. Утратил силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 27 июля 2021 года № 7-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Сот шешімімен Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның коммуналдық меншігіне түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы
