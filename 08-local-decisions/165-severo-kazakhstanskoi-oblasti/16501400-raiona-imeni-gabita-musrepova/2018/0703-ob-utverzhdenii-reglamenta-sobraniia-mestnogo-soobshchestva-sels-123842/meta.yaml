    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 3 июля 2018 года № 26-5 «Об утверждении регламента собрания местного сообщества сельских округов района имени Габита Мусрепова Северо-Казахстанской области»
