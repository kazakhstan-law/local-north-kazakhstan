    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2018 жылғы 3 шілдедегі № 26-4 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданында тұрғын үй көмегін көрсетудің мөлшері мен тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
