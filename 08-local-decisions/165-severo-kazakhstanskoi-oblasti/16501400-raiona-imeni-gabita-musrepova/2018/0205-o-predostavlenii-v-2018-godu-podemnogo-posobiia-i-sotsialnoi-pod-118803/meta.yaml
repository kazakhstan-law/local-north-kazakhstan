act_code: '118803'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 5 февраля 2018 года № 19-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 февраля 2018 года № 4569
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова
  kaz: Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін 2018 жылы көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
