  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 12 марта 2018 года № 20-1 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2018 жылғы 12 наурыздағы № 20-1 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы
