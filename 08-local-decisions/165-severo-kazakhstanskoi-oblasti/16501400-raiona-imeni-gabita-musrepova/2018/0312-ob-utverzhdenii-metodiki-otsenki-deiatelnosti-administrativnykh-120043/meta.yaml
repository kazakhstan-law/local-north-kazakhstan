requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 12 марта 2018 года № 20-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 марта 2018 года № 4620. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2023 года № 2-4 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района имени Габита Мусрепова Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
