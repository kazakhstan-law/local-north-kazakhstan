  kaz: «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
