  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2023 года № 2-3 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2023 жылғы 31 наурыздағы № 2-3 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» шешіміне өзгеріс енгізу туралы
