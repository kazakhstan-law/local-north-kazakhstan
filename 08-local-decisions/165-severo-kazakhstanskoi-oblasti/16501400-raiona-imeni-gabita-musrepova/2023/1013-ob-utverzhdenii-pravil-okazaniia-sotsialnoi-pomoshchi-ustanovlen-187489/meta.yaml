  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 13 октября 2023 года № 9-1 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2023 жылғы 13 қазандағы № 9-1 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
