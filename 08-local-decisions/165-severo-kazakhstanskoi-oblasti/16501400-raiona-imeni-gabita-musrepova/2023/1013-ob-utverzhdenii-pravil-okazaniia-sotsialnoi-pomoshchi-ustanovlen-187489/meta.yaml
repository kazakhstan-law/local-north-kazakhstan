requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 13 октября 2023 года № 9-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 октября 2023 года № 7599-15. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 15 июля 2026 года № 42-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданда әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы
