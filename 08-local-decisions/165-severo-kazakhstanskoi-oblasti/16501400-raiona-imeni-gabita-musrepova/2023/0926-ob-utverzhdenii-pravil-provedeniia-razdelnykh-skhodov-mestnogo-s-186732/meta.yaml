  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова от 26 сентября 2023 года № 8-8 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и сел для участия в сходе местного сообщества Возвышенского сельского округа района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2023 жылғы 26 қыркүйектегі № 8-8 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның Возвышен ауылдық округінің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер мен ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
