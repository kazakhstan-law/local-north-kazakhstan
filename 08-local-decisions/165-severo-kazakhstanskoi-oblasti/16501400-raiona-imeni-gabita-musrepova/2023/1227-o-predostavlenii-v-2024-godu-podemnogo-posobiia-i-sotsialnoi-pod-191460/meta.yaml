act_code: '191460'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 27 декабря 2023 года № 12-2
title:
  rus: О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова Северо-Казахстанской области
  kaz: 2024 жылы Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
