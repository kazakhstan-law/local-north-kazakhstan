act_code: '184891'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 8 августа 2023 года № 6-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 10 августа 2023 года № 7566-15
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района имени Габита Мусрепова
  kaz: Ғабит Мүсірепов атындағы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі мен мөлшерін бекіту туралы
