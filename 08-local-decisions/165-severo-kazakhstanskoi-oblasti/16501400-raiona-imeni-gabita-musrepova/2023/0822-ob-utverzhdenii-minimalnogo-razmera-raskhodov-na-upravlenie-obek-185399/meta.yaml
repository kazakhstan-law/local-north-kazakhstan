requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 22 августа 2023 года № 7-2
title:
  rus: Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по району имени Габита Мусрепова Северо-Казахстанской области на 2023 год
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың 2023 жылға ең төмен мөлшерін бекіту туралы
