  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова от 29 декабря 2023 года № 14-4 «Об утверждении бюджета Дружбинского сельского округа района имени Габита Мусрепова на 2024-2026 годы»
    kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2023 жылғы 29 желтоқсандағы № 14-4 «2024-2026 жылдарға арналған Ғабит Мүсірепов атындағы ауданы Дружба ауылдық округінің бюджетін бекіту туралы» шешіміне өзгерістер енгізу туралы
