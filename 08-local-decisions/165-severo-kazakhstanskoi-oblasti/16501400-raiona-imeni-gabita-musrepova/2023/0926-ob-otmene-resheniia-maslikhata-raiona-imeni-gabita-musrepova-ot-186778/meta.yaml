requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 26 сентября 2023 года № 8-13
title:
  rus: Об отмене решения маслихата района имени Габита Мусрепова от 4 сентября 2023 года № 7-8 «Об утверждении ставки туристского взноса для иностранцев на 2023 год на территории района имени Габита Мусрепова Северо-Казахстанской области»
  kaz: Ғабит Мүсірепов атындағы ауданы мәслихатының 2023 жылғы 26 қыркүйектегі № 7-8 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының аумағында шетелдіктер үшін 2023 жылға арналған туристік жарнаның мөлшерлемесін бекіту туралы» шешімін жою туралы
