title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и сел для участия в сходе местного сообщества Новосельского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның Новоселов ауылдық округі жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергіліктіқ қоғамдастық жиынына қатысу үшін көшелер мен ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
