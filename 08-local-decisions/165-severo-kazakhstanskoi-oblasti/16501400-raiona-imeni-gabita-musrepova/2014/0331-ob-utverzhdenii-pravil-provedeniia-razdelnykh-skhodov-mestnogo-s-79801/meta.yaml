  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-11 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и сел для участия в сходе местного сообщества Ломоносовского сельского округа района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2014 жылғы 31 наурыздағы № 23-11 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Ломоносов ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын көше және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
