  title:
    rus: О внесении изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-15 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и сел для участия в сходе местного сообщества Рузаевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2014 жылғы 31 наурыздағы № 23-15 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Рузаев ауылдық округінде жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер мен ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
