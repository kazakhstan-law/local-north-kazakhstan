  requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 8 июня 2020 года № 62-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 июня 2020 года № 6344. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 4 сентября 2023 года № 7-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-13 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов села Новоишимское Новоишимского сельского округа района имени Габита Мусрепова Северо-Казахстанской области для участия в сходе местного сообщества»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2014 жылғы 31 наурыздағы № 23-13 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Новоишим ауылдық округі Новоишим ауылының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын көше және көп пәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143712/rus
