act_code: '79808'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2014 года № 2744. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 4 сентября 2023 года № 7-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей микрорайонов и улиц для участия в сходе местного сообщества села Новоишимское Новоишимского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Новоишим ауылдық округі Новоишим ауылында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін шағын аудандар мен көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы
