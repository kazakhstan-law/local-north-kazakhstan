  title:
    rus: О внесении изменений и дополнений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-13 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей микрорайонов и улиц для участия в сходе местного сообщества села Новоишимское Новоишимского сельского округа района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2014 жылғы 31 наурыздағы № 23-13 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Новоишим ауылдық округі Новоишим ауылында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін шағын аудандар мен көшелер тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
