act_code: '85932'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 25 декабря 2014 года № 32-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 января 2015 года № 3068. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата района имени Габита Мусрепова Северо-Казахстанской области от 14 января 2016 года N 6.2.1-22/15)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова на 2015 год
  kaz: Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен салаларының мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
