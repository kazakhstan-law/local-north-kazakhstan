  title:
    rus: О внесении изменения в решение маслихата района имени Габита Мусрепова от 25 декабря 2014 года № 32-3 «О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования,социального обеспечения, культуры,спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района имени Габита Мусрепова на 2015 год»
    kaz: Ғабит Мүсірепов атындағы аудан мәслихатының 2014 жылғы 25 желтоқсандағы № 32-3 «Ғабит Мүсірепов атындағы ауданның ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен салаларының мамандарына тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы» шешіміне өзгеріс енгізу туралы
