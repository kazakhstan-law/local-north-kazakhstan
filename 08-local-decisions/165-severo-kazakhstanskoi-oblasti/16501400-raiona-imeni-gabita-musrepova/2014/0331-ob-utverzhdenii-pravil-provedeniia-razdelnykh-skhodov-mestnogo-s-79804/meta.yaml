act_code: '79804'
requisite: Решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2014 года № 2743. Утратило силу решением маслихата района имени Габита Мусрепова Северо-Казахстанской области от 4 сентября 2023 года № 7-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и сел для участия в сходе местного сообщества Андреевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Андреев ауылдық округінде жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көше және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
