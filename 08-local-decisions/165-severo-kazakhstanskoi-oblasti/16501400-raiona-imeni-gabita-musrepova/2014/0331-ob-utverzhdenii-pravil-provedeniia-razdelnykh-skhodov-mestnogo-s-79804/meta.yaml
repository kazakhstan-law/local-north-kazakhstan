  title:
    rus: О внесений изменений в решение маслихата района имени Габита Мусрепова Северо-Казахстанской области от 31 марта 2014 года № 23-5 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Андреевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданы мәслихатының 2014 жылғы 31 наурыздағы № 23-5 «Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданының Андреев ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
