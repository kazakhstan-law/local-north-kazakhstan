    kaz: «Тайынша ауданы Краснополян селолық округі елді мекендерінің құрамдық бөліктеріне атау беру туралы» Солтүстік Қазақстан облысы Тайынша ауданы Краснополян ауылдық округі әкімінің 2010 жылғы 21 қыркуйекдағы №5 шешіміне өзгерістер енгізу туралы
