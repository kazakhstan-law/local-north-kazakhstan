act_code: '61705'
requisite: Решение акима Аккайынского района Северо-Казахстанской области от 10 ноября 2011 года № 48. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 ноября 2011 года № 13-2-141. Утратило силу в связи с истечением срока действия (письмо аппарата акима Аккайынского района Северо-Казахстанской области от 19 июня 2012 года № 02.03.03-29/580)
title:
  rus: Об образовании и обеспечении на территории Аккайынского района приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Аққайың ауданының аумағында шақыру жылы он жеті жасқа толатын және одан үлкен жастағы шақыру учаскесінде бұрын тіркелмеген Қазақстан Республикасының ер азаматтарын тіркеуді ұйымдастыру және қамтамасыз ету туралы
