requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 10 марта 2011 года № 27-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 7 апреля 2011 № 13-2-130. Утратило силу (письмо Департамента юстиции Северо-Казахстанской области от 2 апреля 2013 года № 04-07/1933)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района на 2011 год
  kaz: 2011 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме ақы және үй алу үшін әлеуметтік қолдау ұсыну туралы
