  title:
    rus: О внесении изменений в решение маслихата Аккайынского района от 25 декабря 2013 года № 19-3 "О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты  Аккайынского района на 2014 год"
    kaz: '"2014 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы" Аққайың ауданы мәслихатының 2013 жылғы 25 желтоқсандағы № 19-3 шешіміне өзгерістер енгізу туралы'
