act_code: '76977'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 25 декабря 2013 года № 19-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 января 2014 года № 2505. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Аккайынского района Северо-Казахстанской области от 10 марта 2015 года № 5.2.1-13/45)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района на 2014 год
  kaz: 2014 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
