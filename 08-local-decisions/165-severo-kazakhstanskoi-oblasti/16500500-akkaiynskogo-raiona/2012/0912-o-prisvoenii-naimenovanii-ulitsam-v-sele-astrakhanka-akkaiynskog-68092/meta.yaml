  title:
    rus: О внесении изменений в решение акима Астраханского сельского округа Аккайынского района Северо-Казахстанской области от 12 сентября 2012 года № 15 «О присвоении наименований улицам в селе Астраханка Аккайынского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданының Астрахан селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Астраханка ауылдық округі әкімінің 2012 жылғы 12 қыркүйектегі № 15 шешіміне өзгерістер енгізу туралы
