    kaz: «Солтүстік Қазақстан облысы Аққайың ауданының Ивановка селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Ивановка ауылдық округі әкімінің 2012 жылғы 6 қыркүйектегі №7 шешіміне өзгерістер енгізу туралы
