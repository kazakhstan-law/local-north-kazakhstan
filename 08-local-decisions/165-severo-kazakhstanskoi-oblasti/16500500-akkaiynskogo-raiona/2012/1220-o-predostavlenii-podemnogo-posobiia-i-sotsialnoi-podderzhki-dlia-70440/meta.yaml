act_code: '70440'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 20 декабря 2012 года № 9-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 22 января 2013 года № 2092. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Аккайынского района Северо-Казахстанской области от 10 марта 2015 года № 5.2.1-13/45)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района на 2013 год
  kaz: 2013 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
