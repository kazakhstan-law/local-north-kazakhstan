    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі Григорьевка селосының көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі әкімінің 2012 жылғы 26 қыркүйектегі № 9 шешіміне өзгерістер енгізу туралы
