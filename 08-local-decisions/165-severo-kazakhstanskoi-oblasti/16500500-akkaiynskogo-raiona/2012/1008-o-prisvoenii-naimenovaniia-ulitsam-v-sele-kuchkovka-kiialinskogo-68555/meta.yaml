    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Қиялы селолық округінің Кучковка селосы көшесіне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Қиялы селолық округі әкімінің 2012 жылғы 8 қазандағы № 11 шешіміне өзгерістер енгізу туралы
