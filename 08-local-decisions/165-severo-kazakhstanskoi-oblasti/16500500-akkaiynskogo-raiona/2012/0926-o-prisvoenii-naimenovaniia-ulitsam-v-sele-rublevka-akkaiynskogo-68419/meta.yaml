    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Аралағаш селолық округі Рублевка селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Аралағаш селолық округі әкімінің 2012 жылғы 26 қыркүйектегі №11 шешіміне өзгерістер енгізу туралы
