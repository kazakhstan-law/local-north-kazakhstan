    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Қиялы селолық округінің Қиялы селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Қиялы селолық округі әкімінің 2012 жылғы 8 қазандағы № 10 шешіміне өзгерістер енгізу туралы
