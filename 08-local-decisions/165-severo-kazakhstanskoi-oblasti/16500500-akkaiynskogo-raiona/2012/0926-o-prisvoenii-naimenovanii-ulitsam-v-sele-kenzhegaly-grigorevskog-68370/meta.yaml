    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі Кенжеғалы селосының көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі әкімінің 2012 жылғы 26 қыркүйектегі № 10 шешіміне өзгерістер енгізу туралы
