requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 18 июля 2012 года № 5-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 августа 2012 года № 13-2-157. Утратило силу (письмо Департамента юстиции Северо-Казахстанской области от 2 апреля 2013 года № 04-07/1933)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района на 2012 год
  kaz: 2012 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және үй алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
