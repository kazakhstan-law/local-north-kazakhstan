    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Власовка селолық округінің Сенное селосы көшесіне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Власовка селолық округі әкімінің 2012 жылғы 27 қыркүйектегі № 10 шешіміне өзгерістер енгізу туралы
