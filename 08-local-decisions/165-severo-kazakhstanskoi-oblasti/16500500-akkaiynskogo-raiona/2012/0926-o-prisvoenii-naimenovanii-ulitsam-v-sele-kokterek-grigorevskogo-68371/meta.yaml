    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі Көктерек селосының көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Григорьевка селолық округі әкімінің 2012 жылғы 26 қыркүйектегі № 11 шешіміне өзгерістер енгізу туралы
