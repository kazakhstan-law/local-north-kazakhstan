    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Власовка селолық округінің Власовка селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Власовка ауылдық округі әкімінің 2012 жылғы 27 қыркүйектегі №8 шешіміне өзгерістер енгізу туралы
