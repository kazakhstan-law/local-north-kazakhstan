    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Полтавка селолық округінің Лесные поляны селосы көшелеріне атау беру туралы» Солтүстік Қазақстан облысы Аққайың ауданы Полтавка ауылдық округі әкімінің 2012 жылғы 14 қыркүйектегі №15 шешіміне өзгерістер енгізу туралы
