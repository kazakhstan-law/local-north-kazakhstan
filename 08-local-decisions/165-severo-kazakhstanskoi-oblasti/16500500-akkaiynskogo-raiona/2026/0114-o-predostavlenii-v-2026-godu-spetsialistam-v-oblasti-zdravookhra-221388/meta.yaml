act_code: '221388'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 14 января 2026 года № 32-2
title:
  rus: О предоставлении в 2026 году специалистам в области здравоохранения, образования, социального обеспечения, архивного дела, культуры, спорта, в сфере цифровых технологий, агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим или вернувшимся с обучения для работы и проживания в сельские населенные пункты Аккайынского района»
  kaz: 2026 жылы Аққайың ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген немесе оқудан оралған денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, архив ісі, мәдениет, спорт, цифрлық технологиялар, агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау ұсыну туралы
