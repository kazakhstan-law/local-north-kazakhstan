  title:
    rus: О внесении изменения в решение маслихата Аккайынского района Северо-Казахстанской области от 15 июля 2026 года № 37-2 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Аккайынском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2026 жылғы 15 шілдедегі № 37-2 шешіміне өзгеріс енгізу туралы
