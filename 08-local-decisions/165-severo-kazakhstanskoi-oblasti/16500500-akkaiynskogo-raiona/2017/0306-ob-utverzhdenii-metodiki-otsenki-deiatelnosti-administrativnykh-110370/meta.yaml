requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 6 марта 2017 года № 10-4. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 марта 2017 года № 4095. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 12 апреля 2018 года № 19-5
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Аккайынского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
