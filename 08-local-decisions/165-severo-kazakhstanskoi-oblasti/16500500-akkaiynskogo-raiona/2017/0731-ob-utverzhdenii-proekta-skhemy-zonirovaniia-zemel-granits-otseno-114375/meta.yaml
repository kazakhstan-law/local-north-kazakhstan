  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 31 июля 2017 года № 13-8 «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Смирново и сельских населенных пунктов Аккайынского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2017 жылғы 31 шілдедегі № 13-8 «Солтүстік Қазақстан облысы Аққайың ауданы Смирново ауылы және ауылдық елді мекендерінің жерлерін аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
