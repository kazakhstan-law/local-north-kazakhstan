act_code: '117736'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 22 декабря 2017 года № 16-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 января 2018 года № 4482
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования,социального обеспечения, культуры,спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты Аккайынского района
  kaz: 2018 жылы Аққайың ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы  және  әлеуметтік   қолдауды ұсыну туралы
