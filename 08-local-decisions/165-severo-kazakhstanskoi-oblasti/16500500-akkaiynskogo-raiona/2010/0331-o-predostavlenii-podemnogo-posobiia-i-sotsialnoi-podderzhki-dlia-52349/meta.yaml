requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 31 марта 2010 года № 20-4. Зарегистрировано Управлением юстиции Аккайынского района Северо-Казахстанской области 11 мая 2010 года № 13-2-118. Утратило силу (письмо Департамента юстиции Северо-Казахстанской области от 2 апреля 2013 года № 04-07/1933)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района на 2010 год
  kaz: 2010 жылға Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және әлеуметтік қолдау шараларын ұсыну туралы
