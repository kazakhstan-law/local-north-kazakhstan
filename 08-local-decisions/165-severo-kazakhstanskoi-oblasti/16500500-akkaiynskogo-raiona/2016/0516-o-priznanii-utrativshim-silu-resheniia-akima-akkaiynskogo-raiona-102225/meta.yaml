act_code: '102225'
requisite: Решение акима Аккайынского района Северо-Казахстанской области от 16 мая 2016 года № 32
title:
  rus: О признании утратившим силу решения акима Аккайынского района Северо-Казахстанской области от 08 апреля 2016 года № 24 «Об объявлении на территории Аккайынского района Северо-Казахстанской области чрезвычайной ситуации природного характера местного масштаба»
  kaz: «Солтүстік Қазақстан облысы Аққайың ауданының аумағында жергілікті ауқымдағы табиғи сипаттағы төтенше жағдайды жариялау туралы» Солтүстік Қазақстан облысы Аққайың ауданы әкімінің 2016 жылғы 08 cәуірдегі № 24 шешімінің күші жойылғандығын тану туралы
