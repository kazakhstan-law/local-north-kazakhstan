act_code: '108841'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 22 декабря 2016 года № 8-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 января 2017 года № 3995
title:
  rus: О предоставлении в 2017 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района
  kaz: 2017 жылы Аққайың ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдауды ұсыну туралы
