  title:
    rus: О внесении изменений в решение маслихата Аккайынского района от 29 ноября 2016 года № 7-11 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Аккайынском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Аққайың ауданы мәслихатының 2016 жылғы 29 қарашадағы № 7-11 шешіміне өзгерістер енгізу туралы Реквизиты документа
