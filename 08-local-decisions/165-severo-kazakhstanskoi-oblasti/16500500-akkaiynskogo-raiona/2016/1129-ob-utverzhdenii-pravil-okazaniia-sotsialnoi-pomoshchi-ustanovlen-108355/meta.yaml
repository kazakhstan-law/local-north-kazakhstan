caused_by:
  code: '159908'
  requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 19 октября 2021 года № 6-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 ноября 2021 года № 24993. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 9 ноября 2023 года № 9-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение маслихата Аккайынского района Северо-Казахстанской области от 29 ноября 2016 года № 7-11 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Аккайынском районе Северо-Казахстанской области» и признании утратившими силу некоторых решений маслихата Аккайынского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданында әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2016 жылғы 29 қарашадағы № 7-11 шешіміне өзгеріс енгізу және Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының кейбір шешімдерінің күші жойылған деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/159908/rus
