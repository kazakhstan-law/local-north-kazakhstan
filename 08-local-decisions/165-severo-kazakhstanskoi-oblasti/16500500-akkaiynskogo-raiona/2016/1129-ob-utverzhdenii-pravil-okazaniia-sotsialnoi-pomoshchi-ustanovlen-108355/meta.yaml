  requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 22 декабря 2017 года № 16-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 января 2018 года № 4507. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 9 ноября 2023 года № 9-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 29 ноября 2016 года № 7-11 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Аккайынском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2016 жылғы 29 қарашадағы № 7-11 шешіміне өзгерістер енгізу туралы
