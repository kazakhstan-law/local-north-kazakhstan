requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 29 ноября 2016 года № 7-11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 декабря 2016 года № 3971. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 9 ноября 2023 года № 9-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
