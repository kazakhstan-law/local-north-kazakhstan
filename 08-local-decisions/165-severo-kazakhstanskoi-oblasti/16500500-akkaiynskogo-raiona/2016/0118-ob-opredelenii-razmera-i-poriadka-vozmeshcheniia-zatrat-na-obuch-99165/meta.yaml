  title:
    rus: О внесении изменения в решение маслихата Аккайынского района Северо-Казахстанской области от 18 января 2016 года № 39-2 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2016 жылғы 18 қаңтардағы № 39-2 шешіміне өзгеріс енгізу туралы
