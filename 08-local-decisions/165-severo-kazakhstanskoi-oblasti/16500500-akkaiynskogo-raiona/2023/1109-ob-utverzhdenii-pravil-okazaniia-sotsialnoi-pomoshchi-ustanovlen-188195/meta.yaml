  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 9 ноября 2023 года № 9-4 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Аккайынском районе Северо-Казахстанской области»
