requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 9 ноября 2023 года № 9-4. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 10 ноября 2023 года № 7616-15. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 25 августа 2026 года № 38-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
