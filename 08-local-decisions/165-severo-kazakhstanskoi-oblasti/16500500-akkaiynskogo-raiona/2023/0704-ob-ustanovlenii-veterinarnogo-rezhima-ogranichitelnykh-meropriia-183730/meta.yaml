requisite: Решение акима Лесного сельского округа Аккайынского района Северо-Казахстанской области от 4 июля 2023 года № 14. Утратил силу решением акима Лесного сельского округа Аккайынского района Северо-Казахстанской области от 24 июля 2024 года № 17 (вводится в действие со дня его первого официального опубликования)
title:
