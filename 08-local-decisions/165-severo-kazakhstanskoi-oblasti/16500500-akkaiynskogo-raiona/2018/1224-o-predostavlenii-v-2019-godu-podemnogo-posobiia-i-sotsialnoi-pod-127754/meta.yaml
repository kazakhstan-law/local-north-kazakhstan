  title:
    rus: О внесении изменения в решение маслихата Аккайынского района Северо-Казахстанской области от 24 декабря 2018 года № 27-5 «О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2018 жылғы 24 желтоқсандағы № 27-5 «2019 жылы Аққайың ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
