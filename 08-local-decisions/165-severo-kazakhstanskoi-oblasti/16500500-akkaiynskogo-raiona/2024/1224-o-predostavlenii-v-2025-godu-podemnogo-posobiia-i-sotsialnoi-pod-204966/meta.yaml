act_code: '204966'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 24 декабря 2024 года № 22-3
title:
  rus: О предоставлении в 2025 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района
  kaz: 2025 жылы Аққайың ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға  келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға,  ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
