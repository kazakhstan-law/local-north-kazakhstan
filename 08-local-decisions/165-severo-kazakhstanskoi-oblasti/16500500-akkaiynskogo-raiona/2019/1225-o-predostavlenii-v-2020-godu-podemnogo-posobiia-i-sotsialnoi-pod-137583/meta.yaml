  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 25 декабря 2019 года № 35-2 «О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2019 жылғы 25 желтоқсандағы № 35-2 «2020 жылы Аққайың ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147767/rus
