act_code: '97356'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 24 декабря 2015 года № 38-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2016 года № 3531
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района
  kaz: 2016 жылы Аққайың ауданының ауылдық елді мекендеріне  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы  және  әлеуметтік қолдауды   ұсыну туралы
