requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 30 января 2014 года № 20-11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 марта 2014 года № 2588. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 25 июля 2014 года № 26-3
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Полтавского сельского округа Аккайынского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Аққайың ауданының Полтавка ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
