requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 30 января 2014 года № 20-15. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 марта 2014 года № 2592. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 22 сентября 2023 года № 8-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
