  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 30 января 2014 года № 20-15 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества сельского округа Шагалалы Аккайынского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2014 жылғы 30 қаңтардағы № 20-15 «Солтүстік Қазақстан облысы Аққайың ауданының Шағалалы ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
