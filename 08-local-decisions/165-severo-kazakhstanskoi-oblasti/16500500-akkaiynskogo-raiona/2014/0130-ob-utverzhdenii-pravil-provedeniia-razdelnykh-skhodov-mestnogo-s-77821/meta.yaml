  kaz: Солтүстік Қазақстан облысы Аққайың ауданының Шағалалы ауылдық округінде жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
