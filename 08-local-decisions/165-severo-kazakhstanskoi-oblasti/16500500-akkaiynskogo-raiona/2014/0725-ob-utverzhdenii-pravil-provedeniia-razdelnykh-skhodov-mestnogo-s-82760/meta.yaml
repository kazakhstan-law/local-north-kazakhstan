  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 25 июля 2014 года № 26-3 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Полтавского сельского округа Аккайынского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2014 жылғы 25 шілдедегі № 26-3 «Солтүстік Қазақстан облысы Аққайың ауданының Полтавка ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
