act_code: '77820'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 30 января 2014 года № 20-12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 марта 2014 года № 2591. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 22 сентября 2023 года № 8-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц села Смирново Смирновского сельского округа Аккайынского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Аққайың ауданы Смирново ауылдық округі Смирново ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын көше тұрғындары өкілдерінің сандық құрамын бекіту туралы
