  requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 19 июля 2021 года № 4-19. Утратило силу решением маслихата Аккайынского района Северо-Казахстанской области от 16 октября 2024 года № 20-25 (вводится в действие со дня официального опубликования)
  title:
    rus: О внесении изменения в решение маслихата Аккайынского района Северо-Казахстанской области от 30 января 2014 года № 20-12 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов села Смирново Смирновского сельского округа Аккайынского района Северо-Казахстанской области для участия в сходе местного сообщества»
    kaz: «Солтүстік Қазақстан облысы Аққайың ауданы Смирново ауылдық округі Смирново ауылының бөлек жергілікті қоғамдастық  жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын көше тұрғындары мен көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2014 жылғы 30 қаңтардағы № 20-12 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157431/rus
