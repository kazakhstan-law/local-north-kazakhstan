act_code: '86121'
requisite: Решение маслихата Аккайынского района Северо-Казахстанской области от 24 декабря 2014 года № 29-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 января 2015 года № 3072
title:
  rus: 'О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккайынского района в 2015 году '
  kaz: 2015 жылы Аққайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
