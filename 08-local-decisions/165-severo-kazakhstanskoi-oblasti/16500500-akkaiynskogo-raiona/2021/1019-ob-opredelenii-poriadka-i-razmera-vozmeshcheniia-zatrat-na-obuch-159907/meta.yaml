  title:
    rus: О внесении изменений в решение маслихата Аккайынского района Северо-Казахстанской области от 19 октября 2021 года № 6-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Аккайынском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Аққайың ауданы мәслихатының 2021 жылғы 19 қазандағы № 6-4 «Солтүстік Қазақстан облысы Аққайың ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
