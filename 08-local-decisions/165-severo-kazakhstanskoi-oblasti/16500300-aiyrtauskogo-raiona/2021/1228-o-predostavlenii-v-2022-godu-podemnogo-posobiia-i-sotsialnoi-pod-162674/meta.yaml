act_code: '162674'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 28 декабря 2021 года № 7-13-26
title:
  rus: О предоставлении в 2022 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: 2022 жылы Айыртау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
