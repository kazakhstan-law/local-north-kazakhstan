act_code: '59317'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 10 июня 2011 года № 4-35-2. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 20 июня 2011 года № 13-3-137. Утратило силу - в связи с истечением срока действия (письмо маслихата Айыртауского района Северо-Казахстанской области от 28 июня 2012 года № 68)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района на 2011 год
  kaz: 2011 жылға Айыртау ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме ақы және үй алу үшін әлеуметтік қолдау ұсыну туралы
