  title:
    rus: О внесении изменений в решение Айыртауского районного маслихата от 25 декабря 2013 года № 5-21-3 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района"
    kaz: Айыртау аудандық мәслихатының 2013 жылғы 25 желтоқсандағы № 5-21-3 "Айыртау ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
