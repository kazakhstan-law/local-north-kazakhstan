act_code: '76978'
requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 25 декабря 2013 года № 5-21-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 января 2014 года № 2506. Утратило силу (письмо маслихата Айыртауского района Северо-Казахстанской области от 30 апреля 2015 года № 3.2.3-2/61)
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
