act_code: '108845'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 23 декабря 2016 года № 6-7-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 января 2017 года № 4007
title:
  rus: О предоставлении в 2017 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін 2017 жылы көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
