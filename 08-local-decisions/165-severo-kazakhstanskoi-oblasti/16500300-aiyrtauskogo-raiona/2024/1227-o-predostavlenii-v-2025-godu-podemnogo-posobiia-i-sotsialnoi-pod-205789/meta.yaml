act_code: '205789'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 27 декабря 2024 года № 8-22-17
title:
  rus: О предоставлении в 2025 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: 2025 жылы Айыртау ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау,бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
