  kaz: Солтүстік Қазақстан облысы Айыртау ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
