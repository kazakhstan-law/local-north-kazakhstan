title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку  и захоронение твердых бытовых отходов по Айыртаускому району Северо-Казахстанской области
  kaz: Айыртау ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы
