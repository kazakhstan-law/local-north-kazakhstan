  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата Северо-Казахстанской области от 5 марта 2024 года № 8-12-23 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов Айыртауского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Айыртау аудандық мәслихатының 2024 жылғы 5 наурыздағы № 8-12-23 «Солтүстік Қазақстан облысы Айыртау ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
