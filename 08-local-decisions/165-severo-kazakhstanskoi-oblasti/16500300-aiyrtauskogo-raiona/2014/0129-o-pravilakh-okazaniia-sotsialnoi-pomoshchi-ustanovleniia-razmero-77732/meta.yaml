  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата от 29 января 2014 года № 5-22-1 «О Правилах оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Айыртауского района»
    kaz: «Айыртау ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидалары туралы» Айыртау аудандық мәслихатының 2014 жылғы 29 қаңтардағы № 5-22-1 шешіміне өзгеріс енгізу туралы
