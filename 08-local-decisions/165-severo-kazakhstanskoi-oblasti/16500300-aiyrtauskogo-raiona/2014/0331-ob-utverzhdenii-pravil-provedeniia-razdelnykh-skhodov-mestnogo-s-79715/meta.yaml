  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата Северо-Казахстанской области от 31 марта 2014 года № 5-23-5 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, улиц и многоквартирных жилых домов для участия в сходе местного сообщества Володарского сельского округа Айыртауского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Айыртау аудандық мәслихатының 2014 жылғы 31 наурыздағы № 5-23-5 «Солтүстік Қазақстан облысы Айыртау ауданы Володар ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл, көше және көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгеріс енгізу туралы
