act_code: '79715'
requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 31 марта 2014 года № 5-23-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2014 года № 2758. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 18 мая 2022 года № 7-18-19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел, улиц и многоквартирных жилых домов для участия в сходе местного сообщества Володарского сельского округа Айыртауского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Айыртау ауданы Володар ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысатын ауыл, көше және көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
