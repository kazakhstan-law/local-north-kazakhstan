requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 31 марта 2014 года № 5-23-13. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 6 мая 2014 года № 2766. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 18 мая 2022 года № 7-18-19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Елецкого сельского округа Айыртауского района Северо-Казахстанской области
