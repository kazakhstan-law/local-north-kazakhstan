act_code: '97169'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 25 декабря 2015 года № 5-44-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2016 года № 3534
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін 2016 жылы көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
