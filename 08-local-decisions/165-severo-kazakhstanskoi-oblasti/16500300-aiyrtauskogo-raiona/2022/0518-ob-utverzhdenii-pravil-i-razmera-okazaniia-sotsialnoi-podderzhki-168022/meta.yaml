  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата от 18 мая 2022 года № 7-18-20 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Айыртауского района»
    kaz: Айыртау аудандық мәслихатының 2022 жылғы 18 мамырдағы № 7-18-20 «Айыртау ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеуге және отын сатып алуға әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
