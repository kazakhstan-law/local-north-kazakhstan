act_code: '168022'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 18 мая 2022 года № 7-18-20. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 мая 2022 года № 28159
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен көрсетілетін коммуналдық қызметтерге ақы төлеуге және отын сатып алуға әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы
