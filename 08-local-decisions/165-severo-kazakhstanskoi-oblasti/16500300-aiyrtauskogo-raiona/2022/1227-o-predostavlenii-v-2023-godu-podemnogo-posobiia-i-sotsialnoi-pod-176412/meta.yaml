  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата Северо-Казахстанской области от 27 декабря 2022 года № 7-23-5 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района»
    kaz: Солтүстік Қазақстан облысы Айыртау аудандық мәслихатының 2022 жылғы 27 желтоқсандағы № 7-23-5 «2023 жылы Айыртау ауданының ауылдық елді мекендерінде жұмыс істеуге және тұруға үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу
  link: https://zan.gov.kz/client/#!/doc/185294/rus
