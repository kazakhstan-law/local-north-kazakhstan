requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 20 июля 2004 года № 3-8-7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 23 августа 2004 года № 1335. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 26 ноября 2009 года № 4-20-3
title:
  rus: О Правилах предоставления социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельской местности
  kaz: Селолық жерде тұратын және жұмыс істейтін денсаулық сақтау, білім, әлеуметтік қамсыздандыру, мәдениет және спорт мемлекеттік ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру Ережесі туралы
