    kaz: «Айыртау ауданы бойынша жер салығының және бірыңғай жер салығының базалық мөлшерлемелерін түзету туралы» Солтүстік Қазақстан облысы Айыртау аудандық мәслихатының 2018 жылғы 13 сәуірдегі № 6-18-4 шешіміне өзгеріс енгізу туралы
