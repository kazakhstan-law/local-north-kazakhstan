act_code: '119901'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 5 марта 2018 года № 6-17-11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 марта 2018 года № 4612. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 9 марта 2022 года № 7-16-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Айыртауского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Айыртау ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметіне бағалаудың әдістемесін бекіту туралы»
