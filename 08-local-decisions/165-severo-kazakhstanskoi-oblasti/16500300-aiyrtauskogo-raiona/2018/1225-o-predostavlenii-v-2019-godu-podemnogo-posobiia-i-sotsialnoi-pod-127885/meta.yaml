act_code: '127885'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 25 декабря 2018 года № 6-26-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 декабря 2018 года № 5121
title:
  rus: О предоставлении в 2019 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: 2019 жылы Айыртау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
