act_code: '52348'
requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 6 апреля 2010 года № 4-23-9. Зарегистрировано Управлением юстиции Айыртауского района Северо-Казахстанской области 7 мая 2010 года № 13-3-117. Утратило силу - решением Айыртауского районного маслихата Северо-Казахстанской области от 10 июня 2011 года № 4-35-2
title:
  rus: Об определении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района на 2010 год
  kaz: Айыртау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2010 жылға әлеуметтік қодау шараларын айқындау туралы
