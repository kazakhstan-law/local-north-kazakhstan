    kaz: Айыртау аудандық мәслихатының 2023 жылғы 20 қарашадағы № 8-9-2 «Солтүстік Қазақстан облысы Айыртау ауданының әлеуметтік көмек көрсету, оның мөлшерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс және толықтыру енгізу туралы
