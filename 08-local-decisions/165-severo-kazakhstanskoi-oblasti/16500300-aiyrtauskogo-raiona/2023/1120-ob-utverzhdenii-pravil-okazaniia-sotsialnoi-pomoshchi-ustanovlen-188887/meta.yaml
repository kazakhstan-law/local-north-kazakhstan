  title:
    rus: О внесении изменений в решение Айыртауского районного маслихата от 20 ноября 2023 года № 8-9-2 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Айыртауского района Северо-Казахстанской области»
    kaz: Айыртау аудандық мәслихатының 2023 жылғы 20 қарашадағы № 8-9-2 «Солтүстік Қазақстан облысы Айыртау ауданының әлеуметтік көмек көрсету, оның мөлшерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
