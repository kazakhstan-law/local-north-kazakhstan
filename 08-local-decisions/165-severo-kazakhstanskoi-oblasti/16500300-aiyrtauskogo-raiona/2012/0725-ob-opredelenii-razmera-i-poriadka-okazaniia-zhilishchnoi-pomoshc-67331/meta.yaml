    kaz: «Аз қамтылған отбасыларына(азаматтарға) тұрғын үйді ұстауға және коммуналдық қызметтерді төлеуге тұрғын үй көмегін көрсету қағидасы туралы» Айыртау аудандық мәслихатының 2012 жылғы 25 шілдедегі № 5-6-3 шешіміне өзгеріс енгізу туралы
