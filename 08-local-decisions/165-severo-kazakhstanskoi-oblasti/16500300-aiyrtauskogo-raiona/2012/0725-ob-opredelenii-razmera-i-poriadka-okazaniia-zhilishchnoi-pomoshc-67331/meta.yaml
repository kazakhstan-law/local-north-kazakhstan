requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 25 июля 2012 года № 5-6-3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 августа 2012 года № 13-3-161. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 29 марта 2024 года № 8-13-1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
