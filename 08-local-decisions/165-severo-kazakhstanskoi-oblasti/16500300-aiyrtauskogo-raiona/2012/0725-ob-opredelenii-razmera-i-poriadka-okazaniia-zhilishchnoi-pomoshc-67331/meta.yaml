  title:
    rus: О внесении изменений и дополнения в решение Айыртауского районного маслихата от 25 июля 2012 года № 5-6-3 «О Правилах оказания малообеспеченным семьям (гражданам) жилищной помощи на содержание жилья и оплату коммунальных услуг»
    kaz: «Аз қамтылған отбасыларына (азаматтарға) тұрғын үйді ұстауға және коммуналдық қызметтерді төлеуге тұрғын үй көмегін көрсету қағидасы туралы» Айыртау аудандық мәслихатының 2012 жылғы 25 шілдедегі № 5-6-3 шешіміне өзгерістер мен толықтыру енгізу туралы
