act_code: '66596'
requisite: Решение маслихата Айыртауского района Северо-Казахстанской области от 27 июня 2012 года № 5-5-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 13 июля 2012 года № 13-3-159. Утратило силу (письмо маслихата Айыртауского района Северо-Казахстанской области от 8 апреля 2013 года № 44)
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға әлеуметтік шараларын ұсыну туралы
