  title:
    rus: О внесении изменения в решение Айыртауского районного маслихата от 6 апреля 2017 года № 6-9-1 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Айыртауского района»
    kaz: Айыртау аудандық мәслихатының 2017 жылғы 6 сәуірдегі № 6-9-1 «Айыртау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
