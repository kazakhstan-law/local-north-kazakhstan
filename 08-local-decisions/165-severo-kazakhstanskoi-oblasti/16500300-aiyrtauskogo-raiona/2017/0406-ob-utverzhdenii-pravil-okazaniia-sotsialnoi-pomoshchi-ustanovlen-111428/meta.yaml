    kaz: «Айыртау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Айыртау аудандық мәслихатының 2017 жылғы 6 сәуірдегі № 6-9-1 шешіміне өзгерістер енгізу туралы
