requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 6 апреля 2017 года № 6-9-1. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 апреля 2017 года № 4147. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 25 ноября 2020 года № 6-47-17 (вводится в действие со дня его первого официального опубликования)
title:
  rus: «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Айыртауского района»
  kaz: «Айыртау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы»
