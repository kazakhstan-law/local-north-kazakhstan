  title:
    rus: О внесении изменений в решение Айыртауского районного маслихата от 6 апреля 2017 года № 6-9-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Айыртауского района»
    kaz: Айыртау аудандық мәслихатының 2017 жылғы 6 сәуірдегі № 6-9-1 «Айыртау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
