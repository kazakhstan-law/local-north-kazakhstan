act_code: '117485'
requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 22 декабря 2017 года № 6-15-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2018 года № 4467
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айыртауского района
  kaz: Айыртау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін 2018 жылы көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
