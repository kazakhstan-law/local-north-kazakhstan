requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 5 декабря 2017 года № 6-14-2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 14 декабря 2017 года № 4431. Утратил силу решением Айыртауского районного маслихата Северо-Казахстанской области от 29 октября 2021 года 7-11-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Айыртауского района Северо-Казахстанской области
