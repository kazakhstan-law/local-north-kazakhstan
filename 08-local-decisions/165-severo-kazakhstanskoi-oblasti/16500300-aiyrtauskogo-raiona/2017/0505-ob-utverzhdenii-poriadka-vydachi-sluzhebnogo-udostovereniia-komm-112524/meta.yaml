requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 5 мая 2017 года № 6-10-8. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 1 июня 2017 года № 4205. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 30 июня 2020 года № 6-43-14 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка выдачи служебного удостоверения коммунального государственного учреждения «Аппарат Айыртауского районного маслихата Северо-Казахстанской области» и его описания
  kaz: «Солтүстік Қазақстан облысы Айыртау ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің қызметтік куәлігін беру тәртібін және оның сипаттамасын бекіту туралы
