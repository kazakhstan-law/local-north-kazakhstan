requisite: Решение Айыртауского районного маслихата Северо-Казахстанской области от 3 марта 2017 года № 6-8-5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 марта 2017 года № 4098. Утратило силу решением Айыртауского районного маслихата Северо-Казахстанской области от 5 марта 2018 года № 6-17-11
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Айыртауского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Айыртау ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы»
