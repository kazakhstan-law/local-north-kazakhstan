act_code: '231289'
requisite: Решение акима Константиновского сельского округа Айыртауского района Северо-Казахстанской области от 6 октября 2026 года № 29
title:
  rus: О предоставлении товариществу с ограниченной ответственностью «КОКШЕТАУ ЭНЕРГО» права ограниченного целевого пользования земельным участком (публичный сервитут) сроком на 49 лет для обслуживания воздушной линии 10 кВ «Константиновка-ЦУ» яч. 3 от ПС 35/10 кВ «Константиновка» в селе Константиновка
  kaz: «КӨКШЕТАУ ЭНЕРГО» жауапкершілігі шектеулі серіктестігіне Солтүстік Қазақстан облысы Айыртау ауданы Константиновка ауылдық округінің Константиновка ауылындағы Рабочий поселок, Достық, А. Михедько көшелерінде орналасқан «Константиновка-ЦУ» 10 кВ әуе желісіне, «Константиновка» 35/10 кВ ҚС-ның № 3 ұяшығына қызмет көрсету үшін жер учаскесіне 49 жыл мерзімге шектеулі нысаналы пайдалану (жария сервитут) құқығын беру туралы
