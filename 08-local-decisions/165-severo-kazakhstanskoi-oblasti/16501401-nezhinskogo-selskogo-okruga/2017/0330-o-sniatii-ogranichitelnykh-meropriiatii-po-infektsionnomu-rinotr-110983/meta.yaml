title:
  rus: О снятии ограничительных мероприятий по инфекционному ринотрахеиту среди крупного рогатого скота на территории животноводческой фермы фермерского хозяйства «Колос» села Привольное Новосельского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның Новоселов ауылдық округі Привольное ауылының «Колос» фермер қожалығы мал шаруашылығы фермасының аумағында ірі қара мал арасында жұқпалы ринотрахеит бойынша шектеу іс-шараларын тоқтату туралы
