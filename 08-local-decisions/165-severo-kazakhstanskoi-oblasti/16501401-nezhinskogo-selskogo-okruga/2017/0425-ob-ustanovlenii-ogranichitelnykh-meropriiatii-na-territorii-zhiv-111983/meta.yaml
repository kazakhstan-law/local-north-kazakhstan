requisite: Решение акима Шоптыкольского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 25 апреля 2017 года № 6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 мая 2017 года № 4176. Утратило силу решением акима Шоптыкольского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 10 июля 2017 года № 10
title:
