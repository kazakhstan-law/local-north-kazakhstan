requisite: Решение акима Рузаевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 15 августа 2017 года № 25 Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 августа 2017 года № 4296. Утратило силу решением акима Рузаевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области от 5 января 2018 года № 1
title:
  rus: Об установлении ограничительных мероприятий на территории животноводческой фермы фермерского хозяйства «Корель» села Рузаевка Рузаевского  сельского округа района имени Габита Мусрепова Северо-Казахстанской области
