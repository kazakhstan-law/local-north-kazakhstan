title:
  rus: О снятии ограничительных мероприятий по бруцеллезу на территории животноводческой фермы фермерского хозяйства «Корель» села Рузаевка Рузаевского сельского округа района имени Габита Мусрепова Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Ғабит Мүсірепов атындағы ауданның Рузаев ауылдық округі Рузаевка ауылының «Корель» фермер қожалығы мал шаруашылығы фермасының аумағында бруцеллез бойынша шектеу іс-шараларын тоқтату туралы
