requisite: Решение акима Ясновского сельского округа Есильского района Северо-Казахстанской области от 4 августа 2017 года № 5. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 августа 2017 года № 4287. Утратило силу решением акима Ясновского сельского округа Есильского района Северо-Казахстанской области от 24 ноября 2017 года № 8
title:
  rus: Об установлении ограничительных мероприятий по инфекционному ринотрахеиту среди крупного рогатого скота на территории Товарищества с ограниченной ответственностью «Московский» в селе Ясновка Ясновского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Ясновка ауылдық округінің Ясновка ауылы «Московский» жауапкершілігі шектеулі серіктестігінің аумағында ірі мүйізді қара малдар арасында жұқпалы ринотрахеит бойынша шектеу іс-шараларын белгілеу туралы
