title:
  rus: О снятие ограничительных мероприятий по инфекционному ринотрахеиту среди крупного рогатого скота на территории Товарищества с ограниченной ответственностью «Московский» в селе Ясновка Ясновского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Ясновка ауылдық округінің Ясновка ауылы «Московский» жауапкершілігі шектеулі серіктестігінің аумағында ірі мүйізді қара малдар арасында жұқпалы ринотрахеит бойынша шектеу іс-шараларын тоқтату туралы
