requisite: Решение акима Заградовского сельского округа Есильского района Северо-Казахстанской области от 26 июня 2017 года № 11. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 29 июня 2017 года № 4243. Утратило силу решением акима Заградовского сельского округа Есильского района Северо-Казахстанской области от 10 октября 2017 года № 14
title:
  rus: Об установлении ограничительных мероприятий по бруцеллёзу крупного рогатого скота на территории Товарищества с ограниченной ответственностью «Прометей-Агро» в селе Заградовка Заградовского сельского округа Есильского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Есіл ауданы Заградовка ауылдық округінің Заградовка ауылы «Прометей-Агро» жауапкершілігі шектеулі серіктестігінің аумағында ірі қара малдың бруцеллез бойынша шектеу іс-шараларын белгілеу туралы
