requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 15 января 2021 года № 7. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 января 2021 года № 7104. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 13 ноября 2023 года № 87 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
