  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 15 января 2021 года № 7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2021 жылғы 15 қаңтардағы № 7 «Солтүстік Қазақстан облысы Тайынша ауданында мұқтаж азаматтардың жекелеген санаттары тізбесін айқындау, әлеуметтік көмек көрсету және мөлшерлерін белгілеудің Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
