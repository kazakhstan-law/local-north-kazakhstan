  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 57 «Об утверждении Регламента собрания местного сообщества города Тайынша, сельских округов Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2021 жылғы 14 шілдедегі № 57 «Солтүстік Қазақстан облысы Тайынша ауданының Тайынша қаласы, ауылдық округтердің жергілікті қоғамдастық жиналысының регламентін бекіту туралы» шешіміне өзгеріс енгізу туралы
