  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 14 июля 2021 года № 56 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Тайыншинского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2021 жылғы 14 шілдедегі № 56 шешіміне өзгерістер енгізу туралы
