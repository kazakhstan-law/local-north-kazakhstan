  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 31 марта 2014 года № 163 "О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области в 2014 году"
    kaz: '"2014 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы" Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2014 жылғы 31 наурыздағы № 163 шешіміне өзгеріс енгізу туралы'
