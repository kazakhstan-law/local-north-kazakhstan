act_code: '79312'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 31 марта 2014 года № 163. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 28 апреля 2014 года № 2686. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Тайыншинского района Северо-Казахстанской области от 2 февраля 2015 года № 12.2.6-18/23)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области в 2014 году
  kaz: 2014 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
