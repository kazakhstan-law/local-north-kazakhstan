requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2014 года № 176. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 июня 2014 года № 2826. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 17 марта 2022 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Амандыкского сельского округа Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы Амандық ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
