  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 17 января 2014 года № 158 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных  категорий нуждающихся граждан в Тайыншинском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Солтүстік Қазақстан облысы Тайынша аудандық мәслихатының 2014 жылғы 17 қаңтардағы № 158 шешіміне өзгерістер енгізу туралы
