requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2014 года № 181. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 июня 2014 года № 2837. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 4 декабря 2019 года № 303 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Келлеровского сельского округа Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы Келлер ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
