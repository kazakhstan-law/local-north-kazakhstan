act_code: '80853'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2014 года № 187. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 20 июня 2014 года № 2832. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 17 марта 2022 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов города Тайынша Тайыншинского района Северо-Казахстанской области для участия в сходе местного сообщества
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы Тайынша қаласының бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер мен көппәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы
