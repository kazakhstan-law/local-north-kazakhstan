  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2014 года № 187 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов города Тайынша Тайыншинского района Северо-Казахстанской области для участия в сходе местного сообщества»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданы Тайынша қаласының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін көшелер мен көппәтерлі тұрғын үйлер тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2014 жылғы 21 мамырдағы № 187 шешіміне өзгеріс енгізу туралы
