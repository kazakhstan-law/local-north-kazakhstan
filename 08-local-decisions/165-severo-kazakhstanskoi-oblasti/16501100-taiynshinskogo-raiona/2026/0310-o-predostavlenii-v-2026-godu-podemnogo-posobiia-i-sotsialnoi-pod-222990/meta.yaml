act_code: '222990'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 10 марта 2026 года № 457/30
title:
  rus: О предоставлении в 2026 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов сельских округов, прибывших для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2026 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
