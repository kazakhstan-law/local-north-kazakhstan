act_code: '137867'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 25 декабря 2019 года № 308. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 5 января 2020 года № 5780. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 15 декабря 2020 года № 417 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2020 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
