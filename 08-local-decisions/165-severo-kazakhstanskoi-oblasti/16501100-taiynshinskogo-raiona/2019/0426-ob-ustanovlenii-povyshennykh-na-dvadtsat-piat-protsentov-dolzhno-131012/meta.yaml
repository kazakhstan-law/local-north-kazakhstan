act_code: '131012'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 26 апреля 2019 года № 248. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 30 апреля 2019 года № 5379
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Тайыншинского района Северо-Казахстанской области
  kaz: Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
