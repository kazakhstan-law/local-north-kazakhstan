  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 26 апреля 2019 года № 248 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Тайыншинского района Северо-Казахстанской области»
    kaz: «Азаматтық қызметшілер болып табылатын және Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2019 жылғы 26 сәуірдегі № 248 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164366/rus
