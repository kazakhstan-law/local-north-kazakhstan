requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 4 декабря 2019 года № 301. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 9 декабря 2019 года № 5713. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 17 марта 2022 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Алаботинского сельского округа Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданы Алабота ауылдық округінің бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауылдар тұрғындары өкілдерінің сандық құрамын бекіту туралы
