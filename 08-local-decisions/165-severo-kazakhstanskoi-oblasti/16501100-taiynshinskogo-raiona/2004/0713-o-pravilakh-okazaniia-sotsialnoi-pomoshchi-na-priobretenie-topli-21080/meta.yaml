title:
  rus: О правилах оказания социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Селолық елді мекендерде тұратын және қызмет ететін мемлекеттік ұйымдардың денсаулық сақтау, әлеуметтік қамсыздандыру, білім, мәдениет және спорт мамандарына отын сатып алуға әлеуметтік комек корсету Ережелері туралы
