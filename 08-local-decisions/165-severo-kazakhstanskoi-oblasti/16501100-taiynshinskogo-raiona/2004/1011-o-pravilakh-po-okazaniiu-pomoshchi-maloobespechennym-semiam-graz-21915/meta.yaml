act_code: '21915'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 12 октября 2004 года № 52. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 ноября 2004 года № 1389. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 10 июля 2008 года № 60
title:
  rus: О правилах по оказанию помощи малообеспеченным семьям (гражданам) на оплату содержания жилища (кроме содержания индивидуального жилого дома), арендной платы за пользование жилищем, арендованным местным исполнительным органом в частном жилищном фонде, потребления коммунальных услуг и услуг связи в части увеличения абонентской платы за телефон, подключенный к городской сети телекоммуникаций
  kaz: Табысы аз отбасыларына (азаматтарға) үйді ұстау төлемін (жеке тұрғын үйді ұстаудан басқа), жеке тұрғын үй жергілікті атқарушы орган жалдаған тұрғын үйді пайдаланғаны, жалға алу төлемін, коммуналдық қызметтер және қалалық телекоммуникация желіне қосылған телефон үшін абоненттік ақыны ұлғайту бөлігіндегі байланыс қызметтері үшін ақы төлеуге көмек көрсету Ережелері туралы
