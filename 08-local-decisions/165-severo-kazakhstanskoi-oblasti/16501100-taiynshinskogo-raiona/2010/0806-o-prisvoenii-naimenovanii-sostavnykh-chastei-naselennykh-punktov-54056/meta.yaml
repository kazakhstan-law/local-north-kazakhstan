    kaz: «Тайынша ауданы Алабота селолық округі елді мекендерінің құрамдық бөліктеріне атау беру туралы» Солтүстік Қазақстан облысы Тайынша ауданы Алабота ауылдық округі әкімінің 2010 жылғы 6 тамыздағы №12 шешіміне өзгерістер енгізу туралы
