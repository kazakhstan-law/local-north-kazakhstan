  kaz: 2011 жылда ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
