requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 20 декабря 2010 года № 241. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 21 января 2011 года № 13-11-202. Утратило силу в связи с истечением срока действия (письмо маслихата Тайыншинского района Северо-Казахстанской области от 28 июня 2012 года № 04-05-92)
title:
