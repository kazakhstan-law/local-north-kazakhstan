act_code: '70482'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 20 декабря 2012 года № 72. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 24 января 2013 года № 2115. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Тайыншинского района Северо-Казахстанской области от 2 февраля 2015 года № 12.2.6-18/23)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района в 2013 году
  kaz: 2013 жылы Тайынша ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
