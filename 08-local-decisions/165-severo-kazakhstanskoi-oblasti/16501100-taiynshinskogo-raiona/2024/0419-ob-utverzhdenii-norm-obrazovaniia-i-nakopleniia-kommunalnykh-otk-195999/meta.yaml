  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 19 апреля 2024 года № 152/13 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Тайыншинскому району Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша аудандық мәслихатының 2024 жылғы 19 сәуірдегі № 152/13 «Солтүстік Қазақстан облысы Тайынша ауданы бойынша коммуналдық қалдықтардың түзету және жинақталу нормаларын, халық үшін қатты тұрмыстық қатты қалдықтарды жинақтау, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
