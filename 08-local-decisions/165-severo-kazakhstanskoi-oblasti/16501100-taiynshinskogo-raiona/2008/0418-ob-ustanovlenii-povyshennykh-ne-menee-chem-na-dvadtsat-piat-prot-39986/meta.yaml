act_code: '39986'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 18 апреля 2008 года № 56. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 29 мая 2008 года № 13-11-116
title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в аульной (сельской) местности Тайыншинского района по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Қалалық жағдайда қызметтің осы түрімен айналысатын азаматтық қызметкерлерінің жалақыларымен және ставкаларымен салыстырғанда Тайынша ауданының ауылдық (селолық) жерлерінде жұмыс істейтін әлеуметтік қамтамасыз ету, білім беру, мәдениет азаматтық қызметкерлерінің жиырма бес пайыздан кем емес көтерілген лауазымдық жалақылары мен тарифтік ставкаларын белгілеу туралы
