  title:
    rus: О внесении изменений и дополнений в решение районного маслихата от 10 июля 2008 года № 60 "Об утверждении Правил предоставления семьям (гражданам) жилищной помощи на содержания жилья (кроме содержания индивидуального жилого дома) и оплату коммунальных услуг и услуг связи в части увеличения абонентской платы за телефон"
    kaz: '"Тұрғын үйді ұстау (жеке тұрғын үйден басқа), коммуналдық қызметтерін пайдаланғаны және телефон үшін абоненттік ақыны ұлғайту бөлігіндегі байланыс қызметтері үшін төлеуге отбасыларға (азаматтарға) көмек көрсету Ережесін бекіту туралы" аудандық мәслихаттың 2008 жылғы 10 шілдедегі № 60 шешіміне өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/48977/rus
