title:
  rus: Об утверждении инструкции размера и порядка оказания жилищной помощи малообеспеченным гражданам
  kaz: Аз қамтамасыз етілген отбасыларға (азаматтарға) азаматтарға тұрғын үй көмегінің мөлшері және көрсетілген тәртіптің нұсқауын бекіту туралы
