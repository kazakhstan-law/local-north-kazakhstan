  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2015 года № 277 «О повышении ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в границах Тайыншинского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданының шегіндегі Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемелерін арттыру туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2015 жылғы 21 мамырдағы № 277 шешіміне өзгеріс енгізу туралы
