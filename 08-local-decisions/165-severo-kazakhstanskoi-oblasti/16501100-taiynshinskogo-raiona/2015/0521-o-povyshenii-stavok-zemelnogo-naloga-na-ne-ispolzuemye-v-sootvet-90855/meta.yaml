  kaz: Солтүстік Қазақстан облысы Тайынша ауданының шегіндегі Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемелерін арттыру туралы
