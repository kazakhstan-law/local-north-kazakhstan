act_code: '90585'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 21 мая 2015 года № 276. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 16 июня 2015 года № 3273
title:
  rus: О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2015 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
