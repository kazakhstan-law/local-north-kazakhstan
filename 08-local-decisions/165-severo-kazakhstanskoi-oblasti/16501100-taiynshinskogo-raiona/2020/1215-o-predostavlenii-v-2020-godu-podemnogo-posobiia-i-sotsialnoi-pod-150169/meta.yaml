act_code: '150169'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 15 декабря 2020 года № 417. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 21 декабря 2020 года № 6826
title:
  rus: О предоставлении в 2020 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2020 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
