  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 9 декабря 2020 года № 414 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, норм их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования по Тайыншинскому району Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2020 жылғы 9 желтоқсандағы № 414 «Солтүстік Қазақстан облысы Тайынша ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
