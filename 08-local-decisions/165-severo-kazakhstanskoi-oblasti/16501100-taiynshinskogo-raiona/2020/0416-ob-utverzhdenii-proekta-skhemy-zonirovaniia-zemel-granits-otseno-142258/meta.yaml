title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Тайынша и сельских населенных пунктов Тайыншинского района Северо-Казахстанской области
