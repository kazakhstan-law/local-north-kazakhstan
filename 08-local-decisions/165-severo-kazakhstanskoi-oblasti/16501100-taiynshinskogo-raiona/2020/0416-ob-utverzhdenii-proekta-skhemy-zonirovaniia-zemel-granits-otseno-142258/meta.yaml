  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 16 апреля 2020 года № 356 «Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Тайынша и сельских населенных пунктов Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2020 жылғы 16 сәуірдегі № 356 «Солтүстік Қазақстан облысы Тайынша ауданы Тайынша қаласының және ауылдық елді мекендерінің жерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
