requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 23 февраля 2017 года № 61. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 марта 2017 года № 4100. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 19 марта 2018 года № 149
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
