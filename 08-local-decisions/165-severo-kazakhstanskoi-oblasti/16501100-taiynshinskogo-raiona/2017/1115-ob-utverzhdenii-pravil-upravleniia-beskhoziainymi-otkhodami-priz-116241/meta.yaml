requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 15 ноября 2017 года № 109. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 ноября 2017 года № 4378. Утратил силу решением маслихата Тайыншинского района Северо-Казахстанской области от 16 ноября 2021 года № 101 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность Тайыншинского района Северо-Казахстанской области
