  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 4 апреля 2017 года № 70 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2017 жылғы 4 сәуірдегі № 70 «Солтүстік Қазақстан облысы Тайынша ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтары жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
