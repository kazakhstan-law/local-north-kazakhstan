requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 22 декабря 2011 года № 309. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 января 2012 года № 13-11-223. Утратило силу - решением маслихата Тайыншинского района Северо-Казахстанской области от 20 декабря 2012 года № 72
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты района на 2012 год
  kaz: 2012 жылы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
