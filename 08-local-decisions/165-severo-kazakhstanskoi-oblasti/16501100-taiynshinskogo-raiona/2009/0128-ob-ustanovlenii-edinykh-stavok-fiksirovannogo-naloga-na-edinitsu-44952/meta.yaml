    kaz: '"Тайынша ауданындағы кәсіпкерлік қызметтің жеке түрлеріне бірыңғай тіркелген жиынтық салық ставкаларын белгілеу туралы" аудандық мәслихаттың 2009 жылғы 29 қаңтардағы № 98 шешіміне өзгерістер енгізу туралы'
