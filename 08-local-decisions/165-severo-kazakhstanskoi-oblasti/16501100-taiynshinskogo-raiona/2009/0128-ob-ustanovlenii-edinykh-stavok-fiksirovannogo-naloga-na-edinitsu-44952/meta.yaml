requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 29 января 2009 года № 98. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 10 марта 2009 года № 13-11-138. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 25 декабря 2013 года № 152
title:
  rus: Об установлении единых ставок фиксированного налога на единицу объекта налогообложения в месяц для всех налогоплательщиков, осуществляющих деятельность на территории Тайыншинского района
  kaz: Тайынша ауданының аумағында қызметін жүзеге асыратын барлық салық төлеушілер үшін айына салық салу объектісінің бірлігіне бірыңғай тіркелген салық ставкаларын белгілеу туралы
