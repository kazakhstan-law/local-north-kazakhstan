act_code: '50538'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 23 декабря 2009 года № 165. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 3 февраля 2010 года № 13-11-167. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 11 июля 2013 года № 111
title:
  rus: Об установлении повышенных, не менее чем на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим здравоохранения, социального обеспечения, образования, культуры и спорта, работающим в аульной (сельской) местности Тайыншинского района по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Тайынша ауданының ауылдық (селолық) жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласының азаматтық қызметкерлеріне арналған қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
