requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 23 декабря 2009 года № 164. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 3 февраля 2010 года № 13-11-166. Утратило силу в связи с истечением срока действия (письмо маслихата Тайыншинского района Северо-Казахстанской области от 28 июня 2012 года № 04-05-92)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района на 2010 год
  kaz: 2010 жылда ауылдық елді мекедерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
