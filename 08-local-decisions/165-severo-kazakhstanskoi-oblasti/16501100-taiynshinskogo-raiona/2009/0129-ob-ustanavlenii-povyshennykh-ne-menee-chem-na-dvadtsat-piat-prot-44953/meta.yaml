act_code: '44953'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 29 января 2009 года № 99. Зарегистрировано Управлением юстиции Тайыншинского района Северо-Казахстанской области 10 марта 2009 года № 13-11-139. Утратило силу в связи с истечением срока действия (письмо маслихата Тайыншинского района Северо-Казахстанской области от 16 октября 2012 года № 05-20-149)
title:
  rus: Об устанавлении повышенных, не менее чем на двадцать пять процентов должностных окладов и тарифных ставок гражданским служащим социального обеспечения, образования, культуры, работающим в аульной (сельской) местности Тайыншинского района по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях на 2009 год
  kaz: Тайынша ауданының ауылдық (селолық) жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру және мәдениет саласының азаматтық қызметкерлеріне 2009 жылға арналған қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің жалақыларымен және ставкаларымен салыстырғанда кемінде жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
