act_code: '99543'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 3 февраля 2016 года № 359. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 25 февраля 2016 года № 3633
title:
  rus: О предоставлении в 2016 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2016 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру,әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
