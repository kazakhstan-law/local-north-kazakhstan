requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 21 декабря 2016 года № 52. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 января 2017 года № 4030. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 10 июня 2020 года № 361 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения коммунального государственного учреждения «Аппарат маслихата Тайыншинского района Северо-Казахстанской области» и его описания
