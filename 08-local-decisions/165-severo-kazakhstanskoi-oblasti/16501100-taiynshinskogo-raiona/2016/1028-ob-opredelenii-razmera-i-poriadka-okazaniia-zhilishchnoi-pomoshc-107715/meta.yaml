  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 28 октября 2016 года № 30 «Об определении порядка и размера оказания жилищной помощи малообеспеченным семьям (гражданам) Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2016 жылғы 28 қазанындағы № 30 «Солтүстік Қазақстан облысы Тайынша ауданының аз қамтылған отбасыларына (азаматтарына) тұрғын үй көмегін көрсету мөлшерін және тәртібін айқындау туралы» шешіміне өзгеріс енгізу туралы
