  title:
    rus: О внесении изменений в решение маслихата Тайыншинского района Северо-Казахстанской области от 28 октября 2016 года № 30 «Об определении порядка и размера оказания жилищной помощи малообеспеченным семьям (гражданам) Тайыншинского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданының аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің тәртібін және мөлшерін айқындау туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2016 жылғы 28 қазандағы № 30 шешіміне өзгерістер енгізу туралы
