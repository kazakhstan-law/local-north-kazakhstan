requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 17 марта 2022 года № 149. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 13 ноября 2023 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей улиц города Тайынша и сел сельских округов для участия в сходе местного сообщества Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін Тайынша қаласы көшелері мен ауылдық округтер ауылдары тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
