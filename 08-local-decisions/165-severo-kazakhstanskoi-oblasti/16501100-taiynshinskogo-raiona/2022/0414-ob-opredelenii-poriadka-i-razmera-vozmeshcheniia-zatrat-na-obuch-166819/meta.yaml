  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 14 апреля 2022 года № 162 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Тайыншинском районе Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2022 жылғы 14 сәуірдегі № 162 «Солтүстік Қазақстан облысы Тайынша ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
