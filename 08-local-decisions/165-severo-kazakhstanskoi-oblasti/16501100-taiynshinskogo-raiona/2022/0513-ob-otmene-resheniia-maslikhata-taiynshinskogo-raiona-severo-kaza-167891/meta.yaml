act_code: '167891'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 13 мая 2022 года № 190
title:
  rus: Об отмене решения маслихата Тайыншинского района Северо-Казахстанской области от 24 декабря 2021 года № 110 «Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по Тайыншинскому району Северо-Казахстанской области на 2022 год»
  kaz: «2022 жылға арналған Солтүстік Қазақстан облысы Тайынша ауданы бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп - ұстауға арналған шығыстардың ең төмен мөлшерін бекіту туралы» Солтүстік Қазақстан облысы Тайынша аудандық мәслихатының 2021 жылғы 24 желтоқсандағы № 110 шешімінің күшін жою туралы
