  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 29 декабря 2022 года № 284 «О предоставлении в 2023 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области»
    kaz: «2023 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауы көрсету туралы» Солтүстік Қазақстан облысы Тайынша ауданы  мәслихатының 2022 жылғы 29 желтоқсандағы № 284 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186193/rus
