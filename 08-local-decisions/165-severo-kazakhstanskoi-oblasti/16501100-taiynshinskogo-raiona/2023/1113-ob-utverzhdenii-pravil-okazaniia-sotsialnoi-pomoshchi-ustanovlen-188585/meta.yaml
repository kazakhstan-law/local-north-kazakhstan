act_code: '188585'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 13 ноября 2023 года № 87. Зарегистрировано в Департаменте юстиции Северо-Казахстанской области 20 ноября 2023 года № 7625-15. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 10 марта 2026 года № 456/30 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Тайыншинского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Тайынша ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
