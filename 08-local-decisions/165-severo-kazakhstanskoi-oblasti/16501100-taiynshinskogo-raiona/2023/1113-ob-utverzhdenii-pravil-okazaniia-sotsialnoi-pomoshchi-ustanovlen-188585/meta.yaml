  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 13 ноября 2023 года № 87 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2023 жылғы 13 қарашадағы № 87 «Солтүстік Қазақстан облысы Тайынша ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
