  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 27 декабря 2023 года № 128/9 «О предоставлении в 2024 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2023 жылғы 27 желтоқсандағы № 128/9 «2024 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдауы көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200898/rus
