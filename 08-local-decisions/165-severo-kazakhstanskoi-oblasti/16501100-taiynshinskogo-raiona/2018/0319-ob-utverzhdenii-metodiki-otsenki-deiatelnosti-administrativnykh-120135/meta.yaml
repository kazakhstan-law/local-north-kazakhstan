requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 19 марта 2018 года № 149. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 апреля 2018 года № 4630. Утратило силу решением маслихата Тайыншинского района Северо-Казахстанской области от 6 мая 2021 года № 24 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Тайыншинского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
