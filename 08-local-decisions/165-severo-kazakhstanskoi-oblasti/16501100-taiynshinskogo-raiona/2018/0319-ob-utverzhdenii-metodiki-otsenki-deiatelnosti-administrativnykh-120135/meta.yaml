  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 19 марта 2018 года № 149 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Тайыншинского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2018 жылғы 19 наурыздағы № 149 шешіміне өзгеріс енгізу туралы
