  title:
    rus: О внесении изменения в решение маслихата Тайыншинского района Северо-Казахстанской области от 29 декабря 2018 года № 232 «О предоставлении в 2019 году подъёмного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Тайынша ауданы мәслихатының 2018 жылғы 29 желтоқсандағы № 232 «2019 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы» мәслихатының шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/133589/rus
