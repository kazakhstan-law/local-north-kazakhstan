act_code: '120137'
requisite: Решение маслихата Тайыншинского района Северо-Казахстанской области от 19 марта 2018 года № 145. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 апреля 2018 года № 4629
title:
  rus: О предоставлении в 2018 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Тайыншинского района Северо-Казахстанской области
  kaz: 2018 жылы Солтүстік Қазақстан облысы Тайынша ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы мен әлеуметтік қолдауды ұсыну туралы
