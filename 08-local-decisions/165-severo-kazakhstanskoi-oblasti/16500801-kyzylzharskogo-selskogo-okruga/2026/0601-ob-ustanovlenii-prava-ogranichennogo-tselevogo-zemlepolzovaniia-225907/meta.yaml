title:
  rus: Об установлении права ограниченного целевого землепользования (публичный сервитут) коммунальному государственному учреждению «Кызылжарский районный отдел архитектуры, строительства, жилищно-коммунального хозяйства, пассажирского транспорта и автомобильных дорог» на земельный участок
  kaz: «Қызылжар аудандық сәулет, құрылыс, тұрғын үй-коммуналдық шаруашылық, жолаушылар көлігі және автомобиль жолдары бөлімі» коммуналдық мемлекеттік мекемесіне жер учаскесіне шектеулі нысаналы жер пайдалану құқығын (жария сервитут) белгілеу туралы
