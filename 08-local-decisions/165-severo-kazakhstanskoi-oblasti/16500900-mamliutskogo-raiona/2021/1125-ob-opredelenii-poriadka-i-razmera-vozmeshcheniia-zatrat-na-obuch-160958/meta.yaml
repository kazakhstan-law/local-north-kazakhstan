  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 25 ноября 2021 года № 13/4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Мамлютском районе Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2021 жылғы 25 қарашадағы № 13/4 шешіміне өзгерістер енгізу туралы
