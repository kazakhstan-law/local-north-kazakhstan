requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 10 сентября 2026 года № 62/2
title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Молодежный ресурсный центр» коммунального государственного учреждения «Отдел внутренней политики, культуры и развития языков акимата Мамлютского района Северо-Казахстанской области»
  kaz: «Солтүстік Қазақстан облысы Мамлют ауданы әкімдігінің ішкі саясат, мәдениет және тілдерді дамыту бөлімі» коммуналдық мемлекеттік мекемесінің «Жастар ресурстық орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
