act_code: '52133'
requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 26 марта 2010 года № 22/3. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 29 апреля 2010 года № 13-10-110. Утратило силу в связи с истечением срока применения (письмо маслихата Мамлютского района Северо-Казахстанской области от 14 октября 2011 года № 129)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельских населенных пунктах Мамлютского района на 2010 год
  kaz: Мамлют ауданының селолық елді мекендерінде тұратын және жұмыс істейтін денсаулық, білім, әлеуметтік қамту, мәдениет және спорт мемлекеттік ұйымдардың мамандарына отын алуға 2010 жылға әлеуметтік көмек көрсету туралы
