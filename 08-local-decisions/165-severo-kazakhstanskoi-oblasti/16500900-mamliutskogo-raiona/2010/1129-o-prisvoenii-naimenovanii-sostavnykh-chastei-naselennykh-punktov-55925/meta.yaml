  title:
    rus: О внесении изменений в решение акима Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области от 29 ноября 2010 года № 17 «О присвоении наименований составных частей населенных пунктов Воскресеновского сельского округа Мамлютского района»
    kaz: «Мамлют ауданы Воскресенов селолық округі елді мекендерінің құрамдық бөліктеріне атау беру туралы» Солтүстік Қазақстан облысы Мамлют ауданы Воскресенов ауылдық округі әкімінің 2010 жылғы 29 қарашадағы № 17 шешіміне өзгерістер енгізу туралы
