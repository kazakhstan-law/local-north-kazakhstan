act_code: '53539'
requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 3 июня 2010 года № 24/3. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 15 июля 2010 года № 13-10-117. Утратило силу в связи с истечением срока применения (письмо маслихата Мамлютского района Северо-Казахстанской области от 14 октября 2011 года № 129)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Мамлютского района в 2010 году
  kaz: 2010 жылы Мамлют ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға әлеуметтік қолдауды ұсыну туралы
