act_code: '80508'
requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 19 мая 2014 года № 31/6. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 4 июня 2014 года № 2816. Утратило силу в связи с истечением срока действия (письмо аппарата маслихата Мамлютского района Северо-Казахстанской области от 29 января 2015 года № 17)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мамлютского района на 2014 год
  kaz: Мамлют ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
