  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/5 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының Воскресенов ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2013 жылғы 28 қарашадағы № 22/5 шешіміне өзгерістер енгізу туралы
