  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/10 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Ленинского сельского округа Мамлютского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2013 жылғы 28 қарашадағы № 22/10 «Солтүстік Қазақстан облысы Мамлют ауданының Ленин ауылдық округінде бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешіміне өзгерістер енгізу туралы
