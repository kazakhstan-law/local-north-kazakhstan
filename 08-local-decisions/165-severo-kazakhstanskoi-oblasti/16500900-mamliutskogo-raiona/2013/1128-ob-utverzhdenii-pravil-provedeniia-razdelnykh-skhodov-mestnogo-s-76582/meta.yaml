act_code: '76582'
requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2014 года № 2472. Утратило силу решением маслихата Мамлютского района Северо-Казахстанской области от 19 сентября 2023 года № 10/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц города Мамлютка Мамлютского района Северо-Казахстанской области для участия в сходе местного сообщества
  kaz: Солтүстік Қазақстан облысы Мамлют ауданы Мамлютка қаласының жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастықтың жиындарына қатысатын көшелері тұрғындары өкілдерінің сандық құрамын бекіту туралы
