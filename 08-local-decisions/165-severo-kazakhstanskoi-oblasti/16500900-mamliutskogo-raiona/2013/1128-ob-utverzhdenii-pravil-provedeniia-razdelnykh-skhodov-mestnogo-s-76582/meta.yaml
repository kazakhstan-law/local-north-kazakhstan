requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2014 года № 2472. Утратило силу решением маслихата Мамлютского района Северо-Казахстанской области от 19 сентября 2023 года № 10/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
