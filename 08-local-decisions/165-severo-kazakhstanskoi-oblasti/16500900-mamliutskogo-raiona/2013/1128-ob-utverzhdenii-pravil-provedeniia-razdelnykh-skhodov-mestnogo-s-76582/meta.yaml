  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/2 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц и многоквартирных жилых домов города Мамлютка для участия в сходе местного сообщества»
    kaz: «Солтүстік Қазақстан облысы Мамлютка қаласының бөлек жергілікті қоғамдастық жиындарын өткізудің қағидасын және жергілікті қоғамдастық жиындарына қатысатын көше тұрғындары мен көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2013 жылғы 28 қарашадағы № 22/2 шешіміне өзгерістер енгізу туралы
