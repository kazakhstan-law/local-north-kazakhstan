requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 9 апреля 2013 года № 13/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 3 мая 2013 года № 2263. Утратило силу (письмо аппарата маслихата Мамлютского района Северо-Казахстанской области от 3 марта 2014 года № 11.24.3.9/44)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Мамлютского района на 2013 год
  kaz: Мамлют ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
