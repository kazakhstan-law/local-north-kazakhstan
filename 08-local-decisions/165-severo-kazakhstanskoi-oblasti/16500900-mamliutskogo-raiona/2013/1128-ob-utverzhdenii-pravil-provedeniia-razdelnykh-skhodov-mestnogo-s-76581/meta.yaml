requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 28 ноября 2013 года № 22/12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 8 января 2014 года № 2471. Утратило силу решением маслихата Мамлютского района Северо-Казахстанской области от 19 сентября 2023 года № 10/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Пригородного сельского округа Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының Пригород ауылдық округінде жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастықтың жиындарына қатысатын ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
