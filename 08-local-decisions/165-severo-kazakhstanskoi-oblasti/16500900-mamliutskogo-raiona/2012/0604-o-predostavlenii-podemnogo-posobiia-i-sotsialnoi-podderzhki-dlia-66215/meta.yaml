requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 4 июня 2012 года № 4/3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 19 июня 2012 года № 13-10-158. Утратило силу в связи с истечением срока действия (письмо маслихата Мамлютского района Северо-Казахстанской области от 24 января 2013 года № 03-03/10)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Мамлютского района в 2012
  kaz: 2012 жылғы Мамлют ауданының селолық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына тұрғын үй сатып алуға немесе салу үшін әлеуметтік қолдауға және көтерме жәрдемақы ұсыну туралы
