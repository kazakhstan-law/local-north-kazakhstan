    kaz: «Солтүстік Қазақстан облысы Мамлют ауданы Қызыләскер селолық округінің елді мекендерінің құрамдас бөліктеріне атау беру туралы» Солтүстік Қазақстан облысы Мамлют ауданы Қызыләскер ауылдық округі әкімінің 2012 жылғы 15 қарашадағы № 9 шешіміне өзгерістер енгізу туралы
