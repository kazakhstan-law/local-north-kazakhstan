  title:
    rus: О внесении изменения в решение маслихата Мамлютского района Северо-Казахстанской области от 26 марта 2018 года № 26/5 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» коммунального государственного учреждения «Аппарат маслихата Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының аппараты» коммуналдық мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2018 жылғы 26 наурыздағы № 26/5 шешіміне өзгеріс енгізу туралы
