title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Мамлютка и сельских населенных пунктов Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлютка қаласының және Мамлют ауданының ауылдық елді мекендердің жерлерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелеріне үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы
