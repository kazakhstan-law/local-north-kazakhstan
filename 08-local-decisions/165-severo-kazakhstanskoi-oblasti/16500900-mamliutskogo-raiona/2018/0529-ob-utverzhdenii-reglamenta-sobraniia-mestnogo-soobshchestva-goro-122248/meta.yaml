  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 29 мая 2018 года № 28/2 «Об утверждении регламента собрания местного сообщества города Мамлютка и сельских округов Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының Мамлютка қаласы және ауылдық округтерінің жергілікті қоғамдастық жиналысының регламентін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2018 жылғы 29 мамырдағы № 28/2 шешіміне өзгерістер енгізу туралы
