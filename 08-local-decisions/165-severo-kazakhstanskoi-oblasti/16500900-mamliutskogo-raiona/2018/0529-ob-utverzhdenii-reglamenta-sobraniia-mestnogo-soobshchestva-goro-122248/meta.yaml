  title:
    rus: О внесении изменения в решение маслихата Мамлютского района Северо-Казахстанской области от 29 мая 2018 года № 28/2 «Об утверждении регламента собрания местного сообщества города Мамлютка и сельских округов Мамлютского района Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының Мамлютка қаласы және ауылдық округтерінің жергілікті қоғамдастық жиналысының регламентін бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2018 жылғы 29 мамырдағы № 28/2 шешіміне өзгеріс енгізу туралы
