requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 25 ноября 2009 года № 19/2. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 26 ноября 2009 года № 13-10-93. Утратило силу в связи с истечением срока применения (письмо маслихата Мамлютского района Северо-Казахстанской области от 14 октября 2011 года № 129)
title:
