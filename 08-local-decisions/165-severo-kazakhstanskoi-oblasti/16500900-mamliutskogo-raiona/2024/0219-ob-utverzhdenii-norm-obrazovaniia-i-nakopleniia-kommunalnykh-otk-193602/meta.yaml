requisite: Решение Мамлютского районного маслихата Северо-Казахстанской области от 19 февраля 2024 года № 20/2
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Мамлютскому району Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы
