  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 19 сентября 2023 года № 10/5 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей улиц города Мамлютка и сел сельских округов Мамлютского района Северо-Казахстанской области для участия в сходе местного сообщества»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданының жергілікті қоғамдастық бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиындарына қатысу үшін Мамлютка қаласы көшелері және ауылдық округтердің ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2023 жылғы 19 қыркүйектегі № 10/5 шешіміне өзгерістер енгізу туралы
