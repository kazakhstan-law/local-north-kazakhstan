  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 11 декабря 2023 года № 14/4 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Мамлютского района Северо-Казахстанской области»
    kaz: Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2023 жылғы 11 желтоқсандағы № 14/4 «Солтүстік Қазақстан облысы Мамлют ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
