act_code: '130707'
requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 17 апреля 2019 года № 49/2. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 18 апреля 2019 года № 5353
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2019 жылы әлеуметтік қолдау шараларын ұсыну туралы
