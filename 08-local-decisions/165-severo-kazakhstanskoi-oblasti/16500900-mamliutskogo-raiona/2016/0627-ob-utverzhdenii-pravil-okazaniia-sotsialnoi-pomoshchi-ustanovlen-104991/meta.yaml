  title:
    rus: О внесении изменений и дополнения в решение маслихата Мамлютского района Северо-Казахстанской области от 27 июня 2016 года № 5/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2016 жылғы 27 маусымдағы № 5/7 шешіміне өзгерістер және толықтыру енгізу туралы
