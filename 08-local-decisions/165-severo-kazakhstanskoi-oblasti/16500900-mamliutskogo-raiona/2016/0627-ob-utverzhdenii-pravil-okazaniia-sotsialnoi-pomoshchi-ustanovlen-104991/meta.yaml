  title:
    rus: О внесении изменений в решение маслихата Мамлютского района Северо-Казахстанской области от 27 июня 2016 года № 5/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Мамлютского района»
    kaz: Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2016 жылғы 27 маусымдағы № 5/7 «Мамлют ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
