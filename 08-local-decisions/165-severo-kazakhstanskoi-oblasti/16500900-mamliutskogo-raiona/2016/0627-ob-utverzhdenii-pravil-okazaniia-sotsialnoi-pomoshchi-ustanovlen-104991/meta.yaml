  requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 25 ноября 2021 года № 13/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 ноября 2021 года № 25480. Утратило силу решением маслихата Мамлютского района Северо-Казахстанской области от 19 декабря 2023 года № 14/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение маслихата Мамлютского района Северо-Казахстанской области от 27 июня 2016 года № 5/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Мамлютского района» и признании утратившими силу некоторых решений маслихата Мамлютского района Северо-Казахстанской области
    kaz: Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2016 жылғы 27 маусымдағы № 5/7 «Мамлют ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу  және Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының кейбір шешімдерінің күші жойылған деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/160963/rus
