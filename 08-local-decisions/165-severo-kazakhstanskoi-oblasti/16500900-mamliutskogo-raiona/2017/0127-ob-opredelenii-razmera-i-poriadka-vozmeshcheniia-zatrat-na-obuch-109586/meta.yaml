  title:
    rus: О внесении изменения в решение маслихата Мамлютского района Северо-Казахстанской области от 27 января 2017 года № 12/2 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2017 жылғы 27 қаңтардағы № 12/2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгеріс енгізу туралы
