title:
  rus: О снятии ограничительных мероприятий по болезни инфекционный ринотрахеит крупного рогатого скота на территории крестьянского хозяйства «Союз» в селе Искра Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданы Воскресенов ауылдық округінің Искра ауылында «Союз» шаруа қожалығы аумағында ірі қара малдың инфекциялық ринотрахеит ауруы бойынша шектеу іс-шараларын алып тастау туралы
