act_code: '115205'
requisite: Решение акима Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области от 6 октября 2017 года № 12. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 11 октября 2017 года № 4340. Утратило силу решением акима Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области от 6 декабря 2017 года № 13
title:
  rus: Об установлении ограничительных мероприятий по болезни инфекционный ринотрахеит крупного рогатого скота на территории крестьянского хозяйства «Союз» в селе Искра Воскресеновского сельского округа Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданы Воскресенов ауылдық округінің Искра ауылында «Союз» шаруа қожалығы аумағында ірі қара малдын инфекциялық ринотрахеит ауруы бойынша шектеу іс-шараларын белгілеу туралы
