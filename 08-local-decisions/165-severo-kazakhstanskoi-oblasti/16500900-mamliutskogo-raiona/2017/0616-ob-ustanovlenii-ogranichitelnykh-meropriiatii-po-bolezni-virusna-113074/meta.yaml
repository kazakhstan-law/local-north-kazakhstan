requisite: Решение акима Кызыласкерского сельского округа Мамлютского района Северо-Казахстанской области от 16 июня 2017 года № 3. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 27 июня 2017 года № 4239. Утратило силу решением акима Кызыласкерского сельского округа Мамлютского района Северо-Казахстанской области от 26 сентября 2017 года № 5
title:
  rus: Об установлении ограничительных мероприятий по болезни вирусная диарея крупного рогатого скота, на территории товарищества с ограниченной ответственностью «Кзыласкерское» Кызыласкерского сельского округа Мамлютского района Северо-Казахстанской области
  kaz: Солтүстік Қазақстан облысы Мамлют ауданы Қызыләскер ауылдық округінің «Кзыласкерское» жауапкершілігі шектеулі серіктестігі аумағында ірі қара малдың вирус диареясы ауруы бойынша шектеу іс-шараларын белгілеу туралы
