act_code: '61999'
requisite: Решение акима Мамлютского района Северо-Казахстанской области от 6 декабря 2011 года № 36. Зарегистрировано Департаментом юстиции Северо-Казахстанской области 15 декабря 2011 года № 13-10-146. Утратило силу в связи с истечением срока действия (письмо аппарата акима Мамлютского района Северо-Казахстанской области от 13 сентября 2012 года № 02-08-02-02/828)
title:
  rus: Об организации и обеспечении на территории Мамлютского района приписки граждан Республики Казахстан мужского пола, которым в год приписки исполняется семнадцать лет и старших возрастов, не прошедших приписку к призывному участку ранее
  kaz: Тіркеу жылы он жеті жасқа толатын және алдында тіркеуді өтпеген ересек жастағы Қазақстан Республикасы ер азаматтарының Мамлют ауданының аумағында әскерге шақыру учаскесінде тіркеуін ұйымдастыру және қамтамасыз ету туралы
