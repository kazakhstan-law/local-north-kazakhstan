requisite: Решение маслихата Мамлютского района Северо-Казахстанской области от 28 марта 2011 года № 31/3. Зарегистрировано Управлением юстиции Мамлютского района Северо-Казахстанской области 22 апреля 2011 года № 13-10-133. Утратило силу - в связи с истечением срока действия (письмо маслихата Мамлютского района Северо-Казахстанской области от 11 июня 2012 года № 82)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Мамлютского района в 2011 году
  kaz: 2011 жылы Мамлют ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына тұрғын үй сатып алу үшін әлеуметтік қолдауға және көтерме жәрдемақы ұсыну туралы
