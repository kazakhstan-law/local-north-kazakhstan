  title:
    rus: О внесении изменения в решение маслихата Мамлютского района Северо-Казахстанской области от 15 декабря 2020 года № 80/14 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования по Мамлютскому району Северо-Казахстанской области»
    kaz: «Солтүстік Қазақстан облысы Мамлют ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» Солтүстік Қазақстан облысы Мамлют ауданы мәслихатының 2020  жылғы 15 желтоқсандағы № 80/14 шешіміне өзгеріс енгізу туралы
